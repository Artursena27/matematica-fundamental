TEORIA['4-sistema-decimal']=`
<h3>O que é</h3>
<p>Para escrever qualquer número, usamos só <b>10 algarismos</b>: 0, 1, 2, 3, 4, 5, 6, 7, 8 e 9. O segredo é o <b>lugar</b> onde cada algarismo fica. Cada lugar se chama <b>casa</b> (ou ordem).</p>
<p>Funciona como trocar moedas: <b>10 unidades viram 1 dezena</b>, 10 dezenas viram 1 centena, 10 centenas viram 1 unidade de milhar, 10 unidades de milhar viram 1 dezena de milhar.</p>
<table class="t"><tr><th>Dezena de milhar</th><th>Unidade de milhar</th><th>Centena</th><th>Dezena</th><th>Unidade</th></tr>
<tr><td>DM</td><td>UM</td><td>C</td><td>D</td><td>U</td></tr>
<tr><td>10.000</td><td>1.000</td><td>100</td><td>10</td><td>1</td></tr></table>
<p class="tip">O ponto em 45.000 só ajuda a ler: ele separa a turma dos milhares da turma das unidades.</p>
<h3>Caso 1 — Quanto vale um algarismo</h3>
<div class="ex"><b>Exemplo:</b> no número 3<b class="hl">7</b>.405, quanto vale o 7?<ol><li>Conte as casas da direita para a esquerda: 5 é unidade, 0 é dezena, 4 é centena, <b>7 é unidade de milhar</b>.</li><li>Cada unidade de milhar vale 1.000.</li><li>Então o 7 vale 7 × 1.000 = <b>7.000</b>.</li></ol></div>
<div class="ex"><b>Exemplo:</b> no número 52.<b class="hl">8</b>19, quanto vale o 8?<ol><li>O 8 está na casa das <b>centenas</b>.</li><li>Cada centena vale 100.</li><li>8 × 100 = <b>800</b>.</li></ol></div>
<h3>Caso 2 — Ler e escrever números grandes</h3>
<div class="ex"><b>Exemplo:</b> como se lê 48.306?<ol><li>Leia primeiro o que está antes do ponto: <b>quarenta e oito mil</b>.</li><li>Depois leia o resto: <b>trezentos e seis</b>.</li><li>Junte: quarenta e oito mil, trezentos e seis.</li></ol></div>
<h3>Caso 3 — Antecessor e sucessor</h3>
<div class="ex"><b>Exemplo:</b> qual número vem logo antes e logo depois de 30.000?<ol><li>Logo depois (sucessor): some 1 → 30.000 + 1 = <b>30.001</b>.</li><li>Logo antes (antecessor): tire 1 → 30.000 − 1 = <b>29.999</b>.</li></ol></div>
<h3>Caso 4 — Comparar números</h3>
<div class="ex"><b>Exemplo:</b> qual é maior, 61.580 ou 61.508?<ol><li>Os dois têm 5 algarismos. Compare casa por casa, <b>da esquerda para a direita</b>.</li><li>6 = 6, 1 = 1, 5 = 5… iguais até aqui.</li><li>Na casa das dezenas: 8 é maior que 0.</li><li>Então <b>61.580 &gt; 61.508</b>.</li></ol></div>
<h3>Erros comuns</h3><ul><li>Achar que o algarismo vale sempre o mesmo. O 7 de 70 vale 70, não 7!</li><li>Comparar pela direita. Sempre comece pela <b>esquerda</b>.</li><li>Esquecer que o antecessor de 30.000 é 29.999 (não 30.999).</li></ul>
<p class="tip"><b>Resumo:</b> cada casa vale 10 vezes a da direita · valor do algarismo = algarismo × valor da casa · para comparar, comece pela esquerda.</p>`;

TEORIA['4-composicao-decomposicao']=`
<h3>O que é</h3>
<p><b>Decompor</b> é desmontar o número em pedaços, como separar um monte de dinheiro em notas de 10.000, 1.000, 100, 10 e moedas de 1. <b>Compor</b> é o contrário: juntar os pedaços e montar o número.</p>
<h3>Caso 1 — Decompor em soma</h3>
<div class="ex"><b>Exemplo:</b> decomponha 26.407.<ol><li>Separe cada algarismo na sua casa: 2 dezenas de milhar, 6 unidades de milhar, 4 centenas, 0 dezenas e 7 unidades.</li><li>Escreva quanto cada um vale: 20.000; 6.000; 400; 0; 7.</li><li>O zero não precisa aparecer: <b>20.000 + 6.000 + 400 + 7</b>.</li></ol></div>
<h3>Caso 2 — Decompor com multiplicação</h3>
<div class="ex"><b>Exemplo:</b> escreva 26.407 usando “vezes”.<ol><li>Cada pedaço é algarismo × valor da casa.</li><li><b>2 × 10.000 + 6 × 1.000 + 4 × 100 + 7 × 1</b>.</li></ol></div>
<h3>Caso 3 — Compor (montar o número)</h3>
<div class="ex"><b>Exemplo:</b> que número tem 3 dezenas de milhar, 5 centenas e 9 unidades?<ol><li>Monte o quadro de casas: DM = 3, UM = ?, C = 5, D = ?, U = 9.</li><li>As casas que ninguém falou ficam com <b>zero</b>: UM = 0 e D = 0.</li><li>Leia o quadro: <b>30.509</b>.</li></ol></div>
<div class="ex"><b>Exemplo:</b> quanto é 40.000 + 2.000 + 80?<ol><li>40.000 → 4 na dezena de milhar.</li><li>2.000 → 2 na unidade de milhar.</li><li>80 → 8 na dezena. Centena e unidade ficam com zero.</li><li>Resultado: <b>42.080</b>.</li></ol></div>
<h3>Caso 4 — Outras formas de decompor</h3>
<div class="ex"><b>Exemplo:</b> 3.500 também pode ser 35 centenas.<ol><li>Cada centena vale 100.</li><li>35 × 100 = 3.500. ✔</li><li>Então 3.500 = 3 milhares e 5 centenas = 35 centenas. É o mesmo número, contado de outro jeito!</li></ol></div>
<h3>Erros comuns</h3><ul><li>Esquecer o zero da casa vazia: escrever 3.509 em vez de 30.509.</li><li>Trocar a ordem das casas na hora de montar.</li></ul>
<p class="tip"><b>Resumo:</b> decompor = separar por casas · compor = juntar · casa vazia leva zero.</p>`;

TEORIA['4-adicao-subtracao-reagrupamento']=`
<h3>O que é</h3>
<p><b>Adição</b> é juntar ou acrescentar. <b>Subtração</b> é tirar, comparar ou descobrir quanto falta. Na conta armada, colocamos <b>unidade embaixo de unidade, dezena embaixo de dezena</b>, e começamos pela direita.</p>
<p><b>Reagrupar</b> é fazer trocas: 10 unidades viram 1 dezena (o famoso “vai um”), e 1 dezena pode virar 10 unidades quando precisamos (o “empresta”).</p>
<h3>Caso 1 — Adição com “vai um”</h3>
<div class="ex"><b>Exemplo:</b> 2.468 + 1.375<ol><li>Unidades: 8 + 5 = 13. Fica 3 e <b>vai 1</b> para as dezenas.</li><li>Dezenas: 6 + 7 + 1 = 14. Fica 4 e vai 1 para as centenas.</li><li>Centenas: 4 + 3 + 1 = 8.</li><li>Milhares: 2 + 1 = 3.</li><li>Resultado: <b>3.843</b>.</li></ol></div>
<h3>Caso 2 — Subtração com troca</h3>
<div class="ex"><b>Exemplo:</b> 5.342 − 1.718<ol><li>Unidades: 2 − 8 não dá. Troque 1 dezena por 10 unidades: 12 − 8 = 4. As dezenas viram 3.</li><li>Dezenas: 3 − 1 = 2.</li><li>Centenas: 3 − 7 não dá. Troque 1 milhar por 10 centenas: 13 − 7 = 6. Os milhares viram 4.</li><li>Milhares: 4 − 1 = 3.</li><li>Resultado: <b>3.624</b>.</li></ol></div>
<h3>Caso 3 — Subtração com zeros</h3>
<div class="ex"><b>Exemplo:</b> 4.000 − 1.256<ol><li>Unidades: 0 − 6 não dá, e as dezenas e centenas também são zero.</li><li>Troque 1 milhar: viram 10 centenas. Troque 1 centena: viram 10 dezenas. Troque 1 dezena: viram 10 unidades.</li><li>Agora temos 3 milhares, 9 centenas, 9 dezenas e 10 unidades.</li><li>10 − 6 = 4; 9 − 5 = 4; 9 − 2 = 7; 3 − 1 = 2.</li><li>Resultado: <b>2.744</b>.</li></ol></div>
<h3>Caso 4 — Conferir a conta</h3>
<div class="ex"><b>Exemplo:</b> 5.342 − 1.718 deu 3.624. Está certo?<ol><li>Faça a conta ao contrário: 3.624 + 1.718.</li><li>Dá 5.342 = o número do começo. ✔ Está certo!</li></ol></div>
<h3>Problemas: qual conta usar?</h3><ul><li>“ganhou”, “juntou”, “a mais”, “ao todo” → <b>adição</b>.</li><li>“gastou”, “perdeu”, “quanto falta”, “quanto a mais tem” → <b>subtração</b>.</li></ul>
<h3>Erros comuns</h3><ul><li>Esquecer o “vai um”.</li><li>Na subtração, fazer o número maior menos o menor na mesma casa (8 − 2 em vez de 12 − 8).</li><li>Armar a conta desalinhada.</li></ul>
<p class="tip"><b>Resumo:</b> alinhe as casas · comece pela direita · 10 numa casa vai 1 para a próxima · faltou, troque com a vizinha · confira com a conta inversa.</p>`;

TEORIA['4-multiplicacao']=`
<h3>O que é</h3>
<p>Multiplicar é somar <b>grupos iguais</b> de um jeito rápido. 4 pacotes com 6 balas são 6 + 6 + 6 + 6 = 24, ou seja, <b>4 × 6 = 24</b>.</p>
<ul><li><b>Dobro</b> = vezes 2. <b>Triplo</b> = vezes 3. Quádruplo = vezes 4.</li><li>A ordem não muda o resultado: 3 × 7 = 7 × 3 = 21.</li></ul>
<h3>Caso 1 — Tabuada com truques</h3>
<div class="ex"><b>Truques:</b><ol><li>× 2: é o dobro. 8 × 2 = 8 + 8 = 16.</li><li>× 4: é o dobro do dobro. 7 × 4 → 14 → <b>28</b>.</li><li>× 5: é a metade de × 10. 8 × 5 → 80 ÷ 2 = <b>40</b>.</li><li>× 9: é × 10 menos uma vez. 9 × 7 → 70 − 7 = <b>63</b>.</li><li>× 10: coloque um zero no fim. 23 × 10 = <b>230</b>.</li></ol></div>
<h3>Caso 2 — Dobro e triplo</h3>
<div class="ex"><b>Exemplo:</b> qual é o triplo de 45?<ol><li>Triplo é vezes 3: 45 × 3.</li><li>Separe: 40 × 3 = 120 e 5 × 3 = 15.</li><li>Junte: 120 + 15 = <b>135</b>.</li></ol></div>
<h3>Caso 3 — Conta armada (algoritmo)</h3>
<div class="ex"><b>Exemplo:</b> 36 × 4<ol><li>Unidades: 6 × 4 = 24. Escreva 4 e <b>vai 2</b>.</li><li>Dezenas: 3 × 4 = 12, mais 2 que foi = 14.</li><li>Resultado: <b>144</b>.</li></ol></div>
<div class="ex"><b>Exemplo:</b> 213 × 3<ol><li>3 × 3 = 9 (unidades).</li><li>1 × 3 = 3 (dezenas).</li><li>2 × 3 = 6 (centenas).</li><li>Resultado: <b>639</b>.</li></ol></div>
<h3>Caso 4 — Problemas</h3>
<div class="ex"><b>Exemplo:</b> uma caixa tem 6 pacotes com 25 figurinhas cada. Quantas figurinhas há?<ol><li>São 6 grupos iguais de 25 → multiplicação.</li><li>25 × 6 = 20 × 6 + 5 × 6 = 120 + 30 = <b>150 figurinhas</b>.</li></ol></div>
<h3>Erros comuns</h3><ul><li>Esquecer de somar o “vai” na casa seguinte.</li><li>Confundir dobro (× 2) com “mais 2”.</li></ul>
<p class="tip"><b>Resumo:</b> grupos iguais → multiplique · dobro × 2, triplo × 3 · separe dezenas e unidades para facilitar · conta armada começa pela direita.</p>`;

TEORIA['4-divisao']=`
<h3>O que é</h3>
<p>Dividir é <b>repartir em partes iguais</b> ou descobrir <b>quantos grupos</b> cabem. Se 12 balas são repartidas entre 3 amigos, cada um ganha 4: <b>12 ÷ 3 = 4</b>.</p>
<ul><li><b>Dividendo</b>: o total (12). <b>Divisor</b>: em quantas partes (3). <b>Quociente</b>: quanto cada um recebe (4). <b>Resto</b>: o que sobra.</li><li>A divisão é o contrário da multiplicação: 12 ÷ 3 = 4 porque 3 × 4 = 12.</li></ul>
<h3>Caso 1 — Divisão exata (resto zero)</h3>
<div class="ex"><b>Exemplo:</b> 35 lápis em 5 estojos iguais. Quantos em cada?<ol><li>Pergunte: “5 vezes quanto dá 35?”</li><li>Pela tabuada: 5 × 7 = 35.</li><li>Cada estojo fica com <b>7 lápis</b> e não sobra nada (resto 0).</li></ol></div>
<h3>Caso 2 — Divisão com resto</h3>
<div class="ex"><b>Exemplo:</b> 17 figurinhas para 5 crianças.<ol><li>Procure o maior número da tabuada do 5 que cabe em 17: 5 × 3 = 15 (5 × 4 = 20 já passa).</li><li>Cada criança recebe <b>3</b>.</li><li>Sobram 17 − 15 = <b>2</b>. O resto é 2.</li><li>Confira: 5 × 3 + 2 = 17 ✔</li></ol></div>
<p class="tip">O resto é sempre <b>menor que o divisor</b>. Se sobrar 5 ou mais dividindo por 5, ainda dava para dar mais um para cada!</p>
<h3>Caso 3 — Conta armada (chave)</h3>
<div class="ex"><b>Exemplo:</b> 84 ÷ 4<ol><li>Comece pelas dezenas: 8 dezenas ÷ 4 = 2 dezenas. Escreva 2.</li><li>Depois as unidades: 4 ÷ 4 = 1. Escreva 1.</li><li>Resultado: <b>21</b>. Confira: 4 × 21 = 84 ✔</li></ol></div>
<div class="ex"><b>Exemplo:</b> 75 ÷ 3<ol><li>7 dezenas ÷ 3 = 2, sobra 1 dezena (3 × 2 = 6).</li><li>A dezena que sobrou vira 10 unidades: 10 + 5 = 15.</li><li>15 ÷ 3 = 5.</li><li>Resultado: <b>25</b>.</li></ol></div>
<h3>Caso 4 — Quantos grupos cabem?</h3>
<div class="ex"><b>Exemplo:</b> 30 alunos, 6 por mesa. Quantas mesas?<ol><li>Quantos grupos de 6 cabem em 30?</li><li>6 × 5 = 30.</li><li><b>5 mesas</b>.</li></ol></div>
<h3>Erros comuns</h3><ul><li>Deixar um resto maior que o divisor.</li><li>Esquecer de conferir com divisor × quociente + resto.</li></ul>
<p class="tip"><b>Resumo:</b> repartir igual → divisão · use a tabuada ao contrário · resto &lt; divisor · confira: divisor × quociente + resto = total.</p>`;

TEORIA['4-fracoes-unitarias']=`
<h3>O que é</h3>
<p>Uma <b>fração</b> mostra um pedaço de um inteiro que foi dividido em <b>partes iguais</b>. As frações unitárias têm o número <b>1 em cima</b>: elas mostram <b>um pedaço só</b>.</p>
<ul><li>O número de baixo (<b>denominador</b>) diz em quantas partes iguais o inteiro foi dividido.</li><li>O número de cima (<b>numerador</b>) diz quantas partes estamos pegando. Aqui, sempre 1.</li></ul>
<table class="t"><tr><th>Fração</th><th>Como se lê</th><th>O inteiro foi dividido em</th></tr>
<tr><td>{1/2}</td><td>um meio (metade)</td><td>2 partes</td></tr><tr><td>{1/3}</td><td>um terço</td><td>3 partes</td></tr><tr><td>{1/4}</td><td>um quarto</td><td>4 partes</td></tr><tr><td>{1/5}</td><td>um quinto</td><td>5 partes</td></tr><tr><td>{1/10}</td><td>um décimo</td><td>10 partes</td></tr><tr><td>{1/100}</td><td>um centésimo</td><td>100 partes</td></tr></table>
<h3>Caso 1 — Que fração é um pedaço?</h3>
<div class="ex"><b>Exemplo:</b> uma pizza foi cortada em 8 pedaços iguais. Que fração é um pedaço?<ol><li>Em quantas partes iguais? <b>8</b> → vai embaixo.</li><li>Quantos pedaços pegamos? <b>1</b> → vai em cima.</li><li>Fração: <b>{1/8}</b> (um oitavo).</li></ol></div>
<h3>Caso 2 — Qual pedaço é maior?</h3>
<div class="ex"><b>Exemplo:</b> o que é maior, {1/3} ou {1/5} de uma barra de chocolate?<ol><li>{1/3}: a barra foi dividida entre 3 pessoas.</li><li>{1/5}: a mesma barra foi dividida entre 5 pessoas.</li><li>Quanto mais gente dividindo, <b>menor</b> o pedaço de cada um.</li><li>Então <b>{1/3} é maior</b> que {1/5}.</li></ol></div>
<p class="tip">Com o 1 em cima: <b>número de baixo maior = pedaço menor</b>.</p>
<h3>Caso 3 — Fração de uma quantidade</h3>
<div class="ex"><b>Exemplo:</b> quanto é {1/4} de 20 bolinhas?<ol><li>{1/4} quer dizer: divida em 4 grupos iguais e pegue 1.</li><li>20 ÷ 4 = 5.</li><li>{1/4} de 20 = <b>5 bolinhas</b>.</li></ol></div>
<h3>Caso 4 — Décimos e centésimos</h3>
<div class="ex"><b>Exemplo:</b> um real dividido em 100 partes iguais.<ol><li>Cada parte é {1/100} do real.</li><li>{1/100} de real é <b>1 centavo</b>.</li><li>E {1/10} de real = 10 centavos.</li></ol></div>
<h3>Erros comuns</h3><ul><li>Esquecer que as partes precisam ser <b>iguais</b>.</li><li>Achar que {1/10} é maior que {1/2} porque 10 é maior que 2.</li></ul>
<p class="tip"><b>Resumo:</b> embaixo = em quantas partes iguais · em cima = quantas pego · com 1 em cima, quanto maior embaixo, menor o pedaço · fração de quantidade: divida pelo de baixo.</p>`;

TEORIA['4-decimais-dinheiro']=`
<h3>O que é</h3>
<p>No dinheiro, a <b>vírgula</b> separa os <b>reais</b> dos <b>centavos</b>. 1 real = 100 centavos. Por isso, depois da vírgula sempre escrevemos <b>dois algarismos</b>.</p>
<ul><li>R$ 0,10 = 10 centavos = <b>um décimo</b> do real ({1/10}).</li><li>R$ 0,01 = 1 centavo = <b>um centésimo</b> do real ({1/100}).</li><li>R$ 0,50 = 50 centavos = metade do real.</li></ul>
<h3>Caso 1 — Escrever valores</h3>
<div class="ex"><b>Exemplo:</b> escreva 12 reais e 5 centavos.<ol><li>Reais antes da vírgula: 12.</li><li>Centavos depois, sempre com 2 algarismos: 5 vira <b>05</b>.</li><li>Fica <b>R$ 12,05</b>. Cuidado: R$ 12,5 seria 12 reais e 50 centavos!</li></ol></div>
<h3>Caso 2 — Somar preços</h3>
<div class="ex"><b>Exemplo:</b> um lanche custa R$ 7,80 e um suco R$ 4,50. Quanto ao todo?<ol><li>Coloque <b>vírgula embaixo de vírgula</b>.</li><li>Centavos: 80 + 50 = 130 centavos = 1 real e 30 centavos. Fica 30 e vai 1 real.</li><li>Reais: 7 + 4 + 1 = 12.</li><li>Total: <b>R$ 12,30</b>.</li></ol></div>
<h3>Caso 3 — Troco (subtração)</h3>
<div class="ex"><b>Exemplo:</b> paguei R$ 20,00 por um caderno de R$ 13,75. Qual o troco?<ol><li>Conte para cima, como o caixa: de 13,75 até 14,00 faltam R$ 0,25.</li><li>De 14,00 até 20,00 faltam R$ 6,00.</li><li>Troco: 0,25 + 6,00 = <b>R$ 6,25</b>.</li></ol></div>
<h3>Caso 4 — Comparar preços</h3>
<div class="ex"><b>Exemplo:</b> o que é mais caro, R$ 3,09 ou R$ 3,90?<ol><li>Os reais são iguais (3).</li><li>Compare os centavos: 09 centavos e 90 centavos.</li><li>90 &gt; 9, então <b>R$ 3,90 é mais caro</b>.</li></ol></div>
<h3>Erros comuns</h3><ul><li>Escrever R$ 12,5 quando queria dizer 5 centavos (o certo é R$ 12,05).</li><li>Armar a conta sem alinhar as vírgulas.</li><li>Esquecer que 100 centavos viram 1 real.</li></ul>
<p class="tip"><b>Resumo:</b> antes da vírgula = reais · depois = centavos (sempre 2 algarismos) · 100 centavos = 1 real · vírgula embaixo de vírgula.</p>`;

TEORIA['4-sequencias-igualdade']=`
<h3>O que é</h3>
<p>Uma <b>sequência</b> é uma fila de números (ou figuras) que segue uma <b>regra escondida</b>. Descobrir a regra é como ser detetive!</p>
<p>Uma <b>igualdade</b> é como uma <b>balança equilibrada</b>: o que está de um lado do sinal = vale o mesmo que o outro lado.</p>
<h3>Caso 1 — Sequência que aumenta sempre igual</h3>
<div class="ex"><b>Exemplo:</b> 5, 12, 19, 26, ___<ol><li>Veja quanto pula de um para o outro: 12 − 5 = 7; 19 − 12 = 7; 26 − 19 = 7.</li><li>A regra é <b>somar 7</b>.</li><li>Próximo: 26 + 7 = <b>33</b>.</li></ol></div>
<h3>Caso 2 — Sequência que diminui</h3>
<div class="ex"><b>Exemplo:</b> 100, 92, 84, 76, ___<ol><li>Cada número tem 8 a menos que o anterior.</li><li>A regra é <b>tirar 8</b>.</li><li>Próximo: 76 − 8 = <b>68</b>.</li></ol></div>
<h3>Caso 3 — Sequência de figuras</h3>
<div class="ex"><b>Exemplo:</b> ● ▲ ■ ● ▲ ■ ● … qual é a 10ª figura?<ol><li>O grupo que se repete tem 3 figuras: ● ▲ ■.</li><li>As posições 3, 6 e 9 terminam um grupo (são ■).</li><li>A 10ª começa um grupo novo: <b>●</b>.</li></ol></div>
<h3>Caso 4 — Igualdade: o número que falta</h3>
<div class="ex"><b>Exemplo:</b> 9 + □ = 15<ol><li>Pense na balança: de um lado 15, do outro 9 e mais alguma coisa.</li><li>Quanto falta de 9 para chegar a 15? 15 − 9 = 6.</li><li>□ = <b>6</b>. Confira: 9 + 6 = 15 ✔</li></ol></div>
<div class="ex"><b>Exemplo:</b> 4 × □ = 28<ol><li>4 vezes quanto dá 28?</li><li>Use a divisão: 28 ÷ 4 = 7.</li><li>□ = <b>7</b>.</li></ol></div>
<div class="ex"><b>Exemplo:</b> 10 + 5 = 12 + □<ol><li>O lado esquerdo vale 15.</li><li>O direito também precisa valer 15: 12 + □ = 15.</li><li>□ = <b>3</b>. (A resposta <b>não</b> é 15!)</li></ol></div>
<h3>Erros comuns</h3><ul><li>Olhar só os dois primeiros números para achar a regra. Confira em todos!</li><li>Achar que o sinal de = quer dizer “o resultado vem agora”. Ele quer dizer “os dois lados valem o mesmo”.</li></ul>
<p class="tip"><b>Resumo:</b> sequência → veja quanto muda de um para o outro · igualdade → balança: os dois lados valem o mesmo · use a conta contrária para achar o □.</p>`;

TEORIA['4-geometria']=`
<h3>O que é</h3>
<p><b>Figuras planas</b> são “achatadas”, como um desenho no papel: quadrado, retângulo, triângulo, círculo. <b>Figuras espaciais</b> (sólidos) têm volume, dá para pegar na mão: caixa, dado, bola, chapéu de festa.</p>
<table class="t"><tr><th>Polígono</th><th>Lados</th></tr><tr><td>Triângulo</td><td>3</td></tr><tr><td>Quadrado / retângulo</td><td>4</td></tr><tr><td>Pentágono</td><td>5</td></tr><tr><td>Hexágono</td><td>6</td></tr></table>
<h3>Caso 1 — Prismas e pirâmides</h3>
<p><b>Prisma</b>: tem <b>duas bases iguais</b>, uma em cima e outra embaixo, e as laterais são retângulos (uma caixa de sapato). <b>Pirâmide</b>: tem <b>uma base</b>, e as laterais são triângulos que se encontram numa ponta (o vértice).</p>
<div class="ex"><b>Exemplo:</b> quantas faces tem um prisma de base triangular?<ol><li>Bases: 2 triângulos.</li><li>Laterais: uma para cada lado da base → 3.</li><li>Total: 2 + 3 = <b>5 faces</b>.</li></ol></div>
<div class="ex"><b>Exemplo:</b> quantas faces tem uma pirâmide de base quadrada?<ol><li>Base: 1 quadrado.</li><li>Laterais: um triângulo para cada lado da base → 4.</li><li>Total: 1 + 4 = <b>5 faces</b>.</li></ol></div>
<p class="tip">Prisma: faces = lados da base + 2. Pirâmide: faces = lados da base + 1.</p>
<h3>Caso 2 — Ângulo reto</h3>
<div class="ex"><b>Como reconhecer:</b><ol><li>O ângulo reto mede <b>90°</b>. É o “cantinho” de uma folha de caderno, de uma porta, de um azulejo.</li><li>Teste: encaixe o canto de uma folha. Se encaixar certinho, é reto.</li></ol></div>
<h3>Caso 3 — Retas paralelas e perpendiculares</h3>
<div class="ex"><b>Exemplos do dia a dia:</b><ol><li><b>Paralelas</b>: nunca se encontram, mesmo se esticarmos. Ex.: os trilhos do trem, as linhas do caderno.</li><li><b>Perpendiculares</b>: se cruzam formando ângulo reto. Ex.: o cruzamento de duas ruas em “+”, o canto do quadro.</li></ol></div>
<h3>Caso 4 — Simetria</h3>
<div class="ex"><b>Exemplo:</b> a letra A tem simetria?<ol><li>Imagine dobrar a letra no meio, de cima para baixo.</li><li>Se as duas metades ficam <b>uma em cima da outra, certinhas</b>, a figura tem simetria.</li><li>O A tem! A linha da dobra se chama <b>eixo de simetria</b>. Borboletas e corações também têm.</li></ol></div>
<h3>Erros comuns</h3><ul><li>Confundir quadrado (figura plana) com cubo (sólido).</li><li>Achar que prisma e pirâmide são iguais. Lembre: pirâmide tem ponta!</li></ul>
<p class="tip"><b>Resumo:</b> plana = desenho · espacial = objeto · prisma: 2 bases · pirâmide: 1 base e uma ponta · ângulo reto = 90° · paralelas não se encontram · perpendiculares se cruzam em 90°.</p>`;

TEORIA['4-medidas-area']=`
<h3>O que é</h3>
<p>Medir é comparar com uma unidade. Cada tipo de coisa tem sua unidade:</p>
<table class="t"><tr><th>O que medimos</th><th>Unidades</th><th>Troca</th></tr>
<tr><td>Comprimento (tamanho)</td><td>metro (m), centímetro (cm), quilômetro (km)</td><td>1 m = 100 cm · 1 km = 1.000 m</td></tr>
<tr><td>Massa (“peso”)</td><td>grama (g), quilograma (kg)</td><td>1 kg = 1.000 g</td></tr>
<tr><td>Capacidade (quanto cabe)</td><td>litro (L), mililitro (mL)</td><td>1 L = 1.000 mL</td></tr></table>
<h3>Caso 1 — Trocar de unidade maior para menor</h3>
<div class="ex"><b>Exemplo:</b> quantos centímetros há em 3 metros?<ol><li>1 metro tem 100 cm.</li><li>3 metros: 3 × 100 = <b>300 cm</b>.</li></ol></div>
<div class="ex"><b>Exemplo:</b> quantos gramas há em 2 kg?<ol><li>1 kg = 1.000 g.</li><li>2 × 1.000 = <b>2.000 g</b>.</li></ol></div>
<h3>Caso 2 — Escolher a unidade certa</h3>
<div class="ex"><b>Pense no tamanho:</b><ol><li>Comprimento de um lápis → <b>cm</b>. Distância entre cidades → <b>km</b>.</li><li>Pacote de arroz → <b>kg</b>. Uma bala → <b>g</b>.</li><li>Garrafa de refrigerante → <b>L</b>. Colher de remédio → <b>mL</b>.</li></ol></div>
<h3>Caso 3 — Área na malha quadriculada</h3>
<p><b>Área</b> é o espaço que a figura ocupa. Na malha, contamos quantos <b>quadradinhos</b> ficam dentro da figura.</p>
<div class="ex"><b>Exemplo:</b> um retângulo tem 5 quadradinhos em cada linha e 3 linhas.<ol><li>Contar um por um dá trabalho. Use a multiplicação!</li><li>5 quadradinhos × 3 linhas = <b>15 quadradinhos</b>.</li></ol></div>
<div class="ex"><b>Exemplo:</b> uma figura em “L”.<ol><li>Divida em dois retângulos.</li><li>Parte de cima: 2 × 3 = 6. Parte de baixo: 4 × 2 = 8.</li><li>Some: 6 + 8 = <b>14 quadradinhos</b>.</li></ol></div>
<p class="tip">Duas figuras diferentes podem ter a <b>mesma área</b>: 2 × 6 e 3 × 4 ocupam 12 quadradinhos cada.</p>
<h3>Erros comuns</h3><ul><li>Achar que 1 m = 10 cm (são 100!).</li><li>Na malha, contar os tracinhos da borda em vez dos quadradinhos de dentro.</li><li>Usar kg para medir líquido em vez de L.</li></ul>
<p class="tip"><b>Resumo:</b> comprimento: m e cm (×100) · massa: kg e g (×1.000) · capacidade: L e mL (×1.000) · área = quadradinhos de dentro (linhas × colunas).</p>`;

TEORIA['4-horas-duracao']=`
<h3>O que é</h3>
<p>O relógio mede o tempo. <b>1 hora = 60 minutos</b> e <b>1 minuto = 60 segundos</b>. Um dia tem 24 horas.</p>
<ul><li>No relógio de ponteiros: o <b>ponteiro pequeno</b> mostra a hora; o <b>grande</b> mostra os minutos (cada número vale 5 minutos).</li><li>Meia hora = 30 minutos. Um quarto de hora = 15 minutos.</li><li>Depois do meio-dia, contamos 13h, 14h, 15h… (14h = 2 da tarde).</li></ul>
<h3>Caso 1 — Horas em minutos</h3>
<div class="ex"><b>Exemplo:</b> quantos minutos há em 3 horas?<ol><li>Cada hora tem 60 minutos.</li><li>3 × 60 = <b>180 minutos</b>.</li></ol></div>
<h3>Caso 2 — Minutos em horas e minutos</h3>
<div class="ex"><b>Exemplo:</b> 95 minutos são quantas horas?<ol><li>Tire 60 minutos (que viram 1 hora): 95 − 60 = 35.</li><li>Então 95 minutos = <b>1 hora e 35 minutos</b>.</li></ol></div>
<h3>Caso 3 — A que horas termina?</h3>
<div class="ex"><b>Exemplo:</b> um filme começou às 15h40 e durou 50 minutos. A que horas acabou?<ol><li>Das 15h40 até as 16h faltam <b>20 minutos</b>.</li><li>Dos 50 minutos, já usamos 20. Sobram 50 − 20 = 30.</li><li>16h + 30 minutos = <b>16h30</b>.</li></ol></div>
<h3>Caso 4 — Quanto tempo durou?</h3>
<div class="ex"><b>Exemplo:</b> uma aula de natação vai das 19h30 às 21h. Quanto tempo dura?<ol><li>Das 19h30 até as 20h: 30 minutos.</li><li>Das 20h até as 21h: 60 minutos.</li><li>30 + 60 = <b>90 minutos</b> = 1 hora e meia.</li></ol></div>
<h3>Erros comuns</h3><ul><li>Somar minutos como se a hora tivesse 100 minutos (15h40 + 50 min não é 15h90!).</li><li>Trocar os ponteiros do relógio.</li></ul>
<p class="tip"><b>Resumo:</b> 1 h = 60 min · passou de 60 minutos, vira mais 1 hora · para achar a duração, “pule” até a hora cheia e depois conte o resto.</p>`;

TEORIA['4-tabelas-graficos-probabilidade']=`
<h3>O que é</h3>
<p><b>Tabelas</b> organizam informações em linhas e colunas. <b>Gráficos de barras</b> mostram os mesmos números com barras: quanto <b>mais alta</b> a barra, <b>maior</b> o número. Já a <b>probabilidade</b> é a chance de algo acontecer.</p>
<h3>Caso 1 — Ler uma tabela</h3>
<div class="ex"><b>Exemplo:</b> fruta preferida da turma.<table class="t"><tr><th>Fruta</th><th>Votos</th></tr><tr><td>Banana</td><td>8</td></tr><tr><td>Maçã</td><td>5</td></tr><tr><td>Uva</td><td>11</td></tr></table><ol><li>Mais votada: procure o maior número → <b>uva</b> (11).</li><li>Menos votada: o menor → <b>maçã</b> (5).</li><li>Total de alunos: 8 + 5 + 11 = <b>24</b>.</li><li>Uva teve quantos votos a mais que banana? 11 − 8 = <b>3</b>.</li></ol></div>
<h3>Caso 2 — Ler um gráfico de barras</h3>
<div class="ex"><b>Como fazer:</b><ol><li>Leia o <b>título</b>: ele diz o assunto do gráfico.</li><li>Embaixo ficam as categorias (as frutas). Do lado, os números.</li><li>Siga o topo de cada barra até o número do lado.</li><li>A barra mais alta é a que tem mais; a mais baixa, a que tem menos.</li></ol></div>
<h3>Caso 3 — Certo, possível ou impossível</h3>
<div class="ex"><b>Exemplo com um dado comum (1 a 6):</b><ol><li>Tirar um número menor que 7 → <b>certo</b> (sempre acontece).</li><li>Tirar o número 4 → <b>possível</b> (pode acontecer, ou não).</li><li>Tirar o número 8 → <b>impossível</b> (não existe 8 no dado).</li></ol></div>
<h3>Caso 4 — Mais provável ou menos provável</h3>
<div class="ex"><b>Exemplo:</b> um saquinho tem 7 bolas vermelhas e 2 azuis. Tirando uma sem olhar, qual cor é mais provável?<ol><li>Conte cada cor: vermelhas 7, azuis 2.</li><li>Tem mais vermelhas, então a chance de sair vermelha é maior.</li><li><b>Vermelha é mais provável</b>. Azul é menos provável, mas ainda pode sair!</li></ol></div>
<h3>Erros comuns</h3><ul><li>Achar que “mais provável” quer dizer “vai acontecer com certeza”.</li><li>Ler o gráfico sem olhar os números do lado.</li></ul>
<p class="tip"><b>Resumo:</b> tabela e gráfico guardam os mesmos números · barra mais alta = maior quantidade · certo / possível / impossível · tem mais → mais provável.</p>`;

/* ===== CAMADA DIDÁTICA: a ideia em linguagem simples + como reconhecer o tipo de problema ===== */
var INTRO={
'sistema-numeracao':{i:'Pense numa caixa de ovos: 10 unidades formam 1 dezena, 10 dezenas formam 1 centena, e assim por diante. Por isso o <b>lugar</b> do algarismo muda o valor dele: o 3 em 300 vale cem vezes mais que o 3 em 3.',r:['“Quanto vale o algarismo…” → valor posicional: algarismo × valor da casa.','“Decomponha” → separe em casas (milhares + centenas + …).','“Arredonde para a…” → olhe o vizinho da direita.']},
'expressoes-numericas':{i:'Uma expressão é uma conta com várias operações. Assim como numa receita de bolo a ordem importa (não dá para assar antes de misturar), na matemática existe uma <b>ordem obrigatória</b> para todo mundo chegar no mesmo resultado.',r:['Tem ( ), [ ], { } → resolva de dentro para fora.','Mistura de + e × → × e ÷ primeiro.','Só × e ÷ (ou só + e −) → da esquerda para a direita.']},
'potenciacao':{i:'Potência é um jeito curto de escrever “multiplicar o mesmo número várias vezes”. 2⁵ é só uma abreviação de 2 × 2 × 2 × 2 × 2. O expoente diz <b>quantas vezes</b> o número aparece, <b>não</b> por quanto multiplicar.',r:['Número pequeno em cima → potência: multiplique a base por ela mesma.','Mesma base multiplicando → soma os expoentes; dividindo → subtrai.','Expoente 0 → resultado 1.']},
'radiciacao':{i:'A raiz é a pergunta ao contrário da potência: “<b>que número</b>, vezes ele mesmo, dá isso?”. Se 7 × 7 = 49, então √49 = 7. É como descobrir o lado de um quadrado sabendo a área.',r:['√ sem número pequeno → raiz quadrada (número × ele mesmo).','∛ → número × ele × ele.','Número grande → fatore e divida os expoentes pelo índice.']},
'multiplos-divisores':{i:'<b>Múltiplos</b> são a tabuada do número (5, 10, 15, 20…), e ela nunca acaba. <b>Divisores</b> são os números que dividem certinho, sem sobrar resto, e eles são poucos. Os critérios de divisibilidade são “testes rápidos” para não precisar fazer a conta.',r:['“É divisível por…?” → use o critério (2: par; 3: soma dos algarismos; 5: termina em 0 ou 5…).','“Liste os divisores” → teste em pares: 1 e o número, 2 e …','“Múltiplos de…” → faça a tabuada.']},
'primos-fatoracao':{i:'Números primos são os “tijolos” da multiplicação: só se dividem por 1 e por eles mesmos (2, 3, 5, 7, 11…). Todo número pode ser montado multiplicando primos, e fatorar é <b>desmontar</b> o número até sobrar só tijolo.',r:['“Fatore” → divida pelo menor primo possível, repetidamente.','“É primo?” → teste os primos até a raiz do número.','“Quantos divisores?” → fatore, some 1 em cada expoente e multiplique.']},
'mmc':{i:'MMC é o <b>primeiro encontro</b> de duas tabuadas. Se um ônibus passa a cada 4 min e outro a cada 6 min, eles passam juntos de 12 em 12 min. Pense em “quando vai <b>acontecer junto de novo</b>?”.',r:['“Juntos de novo”, “ao mesmo tempo”, “próxima vez” → MMC.','Somar frações com denominadores diferentes → MMC dos denominadores.','Números que não têm divisor comum → MMC é o produto.']},
'mdc':{i:'MDC é o <b>maior pedaço</b> que cabe certinho nos dois números. Se você tem fitas de 12 m e 18 m e quer cortar em pedaços iguais, do maior tamanho possível, sem sobrar: pedaços de 6 m.',r:['“Maior tamanho possível”, “dividir em partes iguais sem sobrar” → MDC.','Simplificar fração de uma vez → divida em cima e embaixo pelo MDC.','Dúvida entre MMC e MDC: se a resposta tem que ser <b>menor</b> que os números → MDC; maior → MMC.']},
'fracoes':{i:'Fração é um <b>pedaço de um inteiro</b>. Numa pizza cortada em 8 fatias, comer 3 é comer {3/8}. O número de baixo diz em quantas partes iguais o inteiro foi cortado; o de cima, quantas você pegou.',r:['“Simplifique” → divida em cima e embaixo pelo mesmo número.','“Equivalente” → multiplique (ou divida) em cima e embaixo pelo mesmo número.','“Fração de uma quantidade” ({2/5} de 30) → divida pelo de baixo e multiplique pelo de cima.']},
'comparacao-fracoes':{i:'Comparar frações é decidir qual pedaço de pizza é maior. Com o mesmo número de fatias (mesmo denominador), ganha quem pegou mais. Com fatias de tamanhos diferentes, primeiro <b>cortamos todas do mesmo tamanho</b> (mesmo denominador).',r:['Mesmo denominador → maior numerador ganha.','Mesmo numerador → menor denominador ganha (fatias maiores).','Tudo diferente → iguale os denominadores (MMC) ou multiplique cruzado.']},
'soma-subtracao-fracoes':{i:'Só dá para somar pedaços <b>do mesmo tamanho</b>: 1 fatia de pizza de 4 + 1 fatia de pizza de 6 não dá “2 fatias de 10”. Primeiro transformamos tudo em fatias iguais (mesmo denominador) e aí somamos as fatias.',r:['Denominadores iguais → conserva embaixo e soma em cima.','Denominadores diferentes → MMC, depois “divide pelo de baixo e multiplica pelo de cima”.','Número misto → transforme em fração imprópria antes.']},
'multiplicacao-divisao-fracoes':{i:'Multiplicar fração é pegar “<b>um pedaço de um pedaço</b>”: metade de metade é um quarto. Dividir é perguntar “quantas vezes cabe?”: quantas metades cabem em 3 pizzas? 6. Por isso dividir é multiplicar pelo inverso.',r:['× → em cima vezes em cima, embaixo vezes embaixo.','÷ → conserva a primeira e multiplica pelo inverso da segunda.','Simplifique cruzado antes de multiplicar para a conta ficar pequena.']},
'decimais':{i:'Decimal é dinheiro: R$ 2,75 é 2 reais e 75 centavos. A vírgula separa o inteiro dos “pedaços” (décimos, centésimos). Quase todo erro some se você <b>alinhar as vírgulas</b> como faria somando valores numa nota fiscal.',r:['+ ou − → vírgula embaixo de vírgula (complete com zeros).','× → multiplique sem vírgula e depois conte as casas decimais.','÷ → iguale as casas decimais e tire as vírgulas.']},
'fracao-decimal':{i:'Fração e decimal são <b>duas roupas do mesmo número</b>: {1/2} e 0,5 são a mesma coisa. Para ir de fração para decimal, divida o de cima pelo de baixo. Para voltar, leia o decimal em voz alta (0,25 = vinte e cinco centésimos = {25/100}).',r:['Fração → decimal: divida numerador ÷ denominador.','Decimal → fração: número sem vírgula sobre 10, 100, 1000… e simplifique.','Denominador 10, 100, 1000 → é só andar com a vírgula.']},
'porcentagem':{i:'Porcentagem é uma fração com denominador 100: 30% quer dizer 30 de cada 100. É a língua dos descontos e das promoções. Truque: 10% é só <b>andar a vírgula uma casa</b>, e quase tudo sai a partir daí.',r:['“X% de Y” → Y × X ÷ 100 (ou use os 10%).','Desconto → multiplique por (1 − taxa); aumento → por (1 + taxa).','“Quantos por cento” → parte ÷ todo × 100.']},
'inteiros-reta-modulo':{i:'Números negativos aparecem em temperatura abaixo de zero, saldo devedor e andares de garagem. Na reta, quanto mais para a <b>direita</b>, maior. Por isso −2 é maior que −10 (está menos frio a −2 °C). Módulo é a <b>distância até o zero</b>, sem ligar para o sinal.',r:['Comparar → quem está mais à direita na reta é maior.','| | → tire o sinal (distância até o zero).','Oposto/simétrico → troque o sinal.']},
'inteiros-soma-subtracao':{i:'Pense em dinheiro: positivo é o que você <b>tem</b>, negativo é o que você <b>deve</b>. Tenho 5 e devo 8 → no fim devo 3 (−3). Sinais iguais: junta e mantém o sinal. Sinais diferentes: subtrai e fica o sinal de quem “ganhou”.',r:['Sinais iguais → soma e repete o sinal.','Sinais diferentes → subtrai e usa o sinal do maior módulo.','−(−) → vira +; elimine os parênteses primeiro.']},
'inteiros-multiplicacao-divisao':{i:'Na multiplicação e divisão, só existe uma regra: <b>sinais iguais dão +, sinais diferentes dão −</b>. Pense como “o inimigo do meu inimigo é meu amigo”: (−) × (−) = (+).',r:['× ou ÷ → faça a conta sem sinal e depois aplique o jogo de sinais.','Potência de negativo → expoente par dá +, ímpar dá −.','Cuidado: −2² = −4, mas (−2)² = 4.']},
'racionais':{i:'Racionais são todos os números que viram fração: inteiros, frações, decimais, positivos e negativos. As regras são as mesmas que você já conhece: as das frações e as dos sinais, <b>usadas juntas</b>.',r:['Primeiro decida o sinal, depois faça a conta como fração/decimal.','Misturou decimal e fração → transforme tudo para o mesmo formato.','Expressão grande → ordem das operações normal.']},
'potencias-propriedades':{i:'Expoente negativo quer dizer “<b>vira de cabeça para baixo</b>”: 2⁻³ = {1/2³} = {1/8}. As propriedades são atalhos para não precisar abrir a potência inteira.',r:['Expoente negativo → inverte a base e o expoente fica positivo.','Mesma base → × soma, ÷ subtrai, potência de potência multiplica.','Fração elevada → eleve em cima e embaixo.']},
'notacao-cientifica':{i:'É um jeito de escrever números <b>gigantes ou minúsculos</b> sem uma fila de zeros: a distância da Terra ao Sol, 150.000.000 km, vira 1,5 × 10⁸ km. Sempre um número entre 1 e 10 vezes uma potência de 10.',r:['Número grande → vírgula anda para a esquerda, expoente positivo.','Número pequeno (0,000…) → vírgula anda para a direita, expoente negativo.','× ou ÷ → multiplique/divida os números e some/subtraia os expoentes.']},
'dizimas':{i:'Dízima periódica é um decimal que <b>repete para sempre</b> (0,333…). Apesar de não acabar, ela é uma fração disfarçada. A fração geratriz é a fração que “gera” essa dízima.',r:['Período logo depois da vírgula → período sobre tantos 9 quantos algarismos tiver.','Tem parte que não repete → é dízima composta: use o método do x ou a regra dos 9 e 0.','Tem parte inteira → separe e some no fim.']},
'conjuntos-numericos':{i:'Os conjuntos são como <b>bonecas russas</b>, uma dentro da outra: naturais (ℕ) dentro dos inteiros (ℤ), dentro dos racionais (ℚ), dentro dos reais (ℝ). Os irracionais (√2, π) ficam ao lado dos racionais, também dentro dos reais.',r:['Tem sinal negativo → no mínimo inteiro.','Vira fração (inclusive dízima periódica) → racional.','Decimal infinito que não repete (√2, π) → irracional.']},
'radicais':{i:'Simplificar radical é <b>tirar da raiz o que sai inteiro</b>. √50 = √(25 × 2) = 5√2: o 25 tem raiz exata, então sai; o 2 fica preso. Só dá para somar radicais que têm a mesma “parte presa”, como somar 3 maçãs com 2 maçãs.',r:['“Simplifique” → fatore e tire os pares (raiz quadrada).','+ ou − → só junta radicais iguais (simplifique antes).','Raiz no denominador → racionalize multiplicando em cima e embaixo.']},
'razao-proporcao':{i:'Razão é uma <b>comparação por divisão</b>: “3 meninas para cada 2 meninos” é 3 : 2. Proporção é quando duas razões são iguais, como numa receita: se 2 xícaras de farinha vão com 3 ovos, 4 xícaras vão com 6 ovos.',r:['“Para cada”, “a razão de A para B” → A ÷ B.','Duas razões iguais com um valor faltando → multiplique cruzado.','Dividir um total na razão a : b → divida o total em a + b partes.']},
'regra-de-tres-simples':{i:'Regra de três resolve “se isso dá aquilo, quanto dá tanto?”. O segredo é perguntar antes: <b>se uma coisa aumenta, a outra aumenta ou diminui?</b> Mais pão → mais farinha (direta). Mais pedreiros → menos dias (inversa).',r:['As duas grandezas sobem juntas → direta: multiplique cruzado.','Uma sobe e a outra desce → inversa: inverta uma coluna antes.','Na dúvida, pergunte em voz alta “se dobrar um, o outro dobra ou cai pela metade?”.']},
'regra-de-tres-composta':{i:'É uma regra de três com <b>mais de duas grandezas</b> (operários, horas, dias, peças…). Compare cada grandeza <b>sozinha</b> com a que tem o x, perguntando: direta ou inversa? Depois junte tudo numa conta só.',r:['Coloque o x numa coluna e compare cada coluna com ela, uma de cada vez.','Seta na mesma direção → direta; contrária → inverta essa fração.','Multiplique todas as frações do lado oposto ao x.']},
'juros-simples':{i:'Juro é o “<b>aluguel do dinheiro</b>”. No juro simples, o aluguel é sempre calculado em cima do valor inicial, então todo mês rende <b>o mesmo valor</b>. J = C · i · t.',r:['Pergunta o juro → J = C × i × t (taxa em decimal).','Pergunta o montante → M = C + J.','Taxa e tempo em unidades diferentes → converta antes (mês ↔ ano).']},
'juros-compostos':{i:'No juro composto, o juro de um mês <b>entra na conta</b> e rende juro no mês seguinte: é o “juro sobre juro”. Por isso cresce como bola de neve: M = C · (1 + i)ᵗ.',r:['“Juros compostos”, “rendimento mensal acumulado” → M = C(1 + i)ᵗ.','Pergunta o juro → J = M − C.','Compare com o simples: o composto sempre ganha depois do 1º período.']},
'valor-numerico':{i:'Letras na matemática são <b>caixinhas</b> esperando um número. Valor numérico é abrir a caixa: trocar a letra pelo número e fazer a conta. Coloque o número <b>entre parênteses</b>, principalmente se for negativo.',r:['“Calcule para x = …” → substitua com parênteses e faça a ordem das operações.','“Escreva a expressão que representa…” → traduza o texto: dobro = 2x, metade = x/2, sucessor = x + 1.','3x quer dizer 3 vezes x (o × fica escondido).']},
'polinomios':{i:'Monômios são como <b>frutas</b>: 3x² e 5x² são “a mesma fruta”, então dá para juntar (8x²). Já 3x² e 3x são frutas diferentes e ficam separadas. Polinômio é uma “salada” de monômios.',r:['Somar/subtrair → junte só os termos semelhantes (mesma letra e mesmo expoente).','Sinal de − antes do parêntese → troque o sinal de todos lá dentro.','Multiplicar → chuveirinho (distributiva) e soma os expoentes da mesma letra.']},
'produtos-notaveis':{i:'São multiplicações que aparecem tanto que viraram <b>fórmulas prontas</b>. (a + b)² NÃO é a² + b²: abrindo o quadrado (a + b)(a + b), aparece o termo do meio 2ab. Pense num quadrado de lado a + b dividido em 4 pedaços.',r:['(algo + algo)² → quadrado do 1º + 2·1º·2º + quadrado do 2º.','(algo − algo)² → mesmo, com − no meio.','(a + b)(a − b) → a² − b².']},
'fatoracao':{i:'Fatorar é o caminho de <b>volta</b> do produto notável: transformar soma em multiplicação. É como descobrir quais peças de Lego montaram o objeto.',r:['Todos os termos têm algo em comum → coloque em evidência.','Dois quadrados com − no meio → (a + b)(a − b).','Três termos com dois quadrados → teste o trinômio quadrado perfeito ou soma e produto.']},
'equacao-1-grau':{i:'Uma equação é uma <b>balança equilibrada</b>. Tudo o que você fizer de um lado tem que fazer do outro para ela não pender. “Passar para o outro lado trocando a operação” é só o atalho desse equilíbrio.',r:['Tem parêntese → distributiva primeiro.','Tem fração → multiplique tudo pelo MMC dos denominadores.','Letras para um lado, números para o outro; o que multiplica o x passa dividindo.']},
'problemas-equacao-1-grau':{i:'Resolver problema é <b>traduzir português para matemática</b>. Chame de x o que você não sabe, escreva a frase como equação e resolva. A parte difícil é a tradução, não a conta.',r:['“Um número” → x; “o dobro” → 2x; “a soma” → +; “é” → =.','Idades → monte uma tabela “hoje / daqui a n anos”.','Números consecutivos → x, x + 1, x + 2.']},
'inequacao-1-grau':{i:'Inequação é uma equação com <b>&lt; ou &gt;</b> no lugar do =. A resposta não é um número, é um <b>intervalo</b> de números. Resolve igualzinho à equação, com uma pegadinha: multiplicou ou dividiu por negativo, <b>vira o sinal</b>.',r:['Resolva como equação.','Dividiu/multiplicou por número negativo → inverta &lt; e &gt;.','“Maior inteiro”, “menor natural” → olhe o intervalo e escolha o número.']},
'sistemas':{i:'Sistema são <b>duas pistas</b> sobre dois mistérios. Uma pista sozinha não basta: “a soma é 10” tem infinitas respostas. Juntando com “a diferença é 2”, só sobra uma: 6 e 4.',r:['Uma letra fácil de isolar → substituição.','Coeficientes iguais ou opostos → adição (some ou subtraia as equações).','Problema com dois valores desconhecidos → chame de x e y e monte duas equações.']},
'equacao-2-grau-incompleta':{i:'Quando falta o b ou o c, não precisa de Bhaskara: tem <b>atalho</b>. Sem b: isole x² e tire a raiz (lembre do ±). Sem c: coloque o x em evidência e uma das respostas é sempre zero.',r:['ax² + c = 0 (sem x sozinho) → isole x² e tire a raiz com ±.','ax² + bx = 0 (sem número sozinho) → x(ax + b) = 0 → x = 0 ou x = −b/a.','x² igual a número negativo → não tem solução real.']},
'equacao-2-grau':{i:'A equação do 2º grau tem x² e pode ter até <b>duas respostas</b>, porque o gráfico (uma parábola) pode cortar o eixo em dois pontos. Bhaskara é uma <b>receita que sempre funciona</b>: calcula Δ e depois x.',r:['Deixe tudo igualado a zero e identifique a, b e c (com sinal!).','Δ = b² − 4ac: positivo → 2 raízes; zero → 1; negativo → nenhuma real.','Números pequenos → tente soma e produto antes.']},
'funcao-afim':{i:'Função afim é uma <b>regra de conta</b> que gera uma reta: f(x) = ax + b. É a conta do táxi: b é a bandeirada (valor fixo) e a é o preço por km (o quanto sobe a cada passo).',r:['“Calcule f(…)” → troque x pelo número.','“Para que x f(x) = …” → monte a equação e resolva.','Taxa fixa + valor por unidade → é função afim (b fixo, a por unidade).']},
'funcao-quadratica':{i:'A função do 2º grau desenha uma <b>parábola</b>, a curva de uma bola chutada para cima. Se a &gt; 0 ela sorri (boca para cima, tem ponto mais baixo); se a &lt; 0 ela fica triste (boca para baixo, tem ponto mais alto).',r:['“Zeros/raízes” → f(x) = 0, Bhaskara.','“Vértice”, “valor máximo/mínimo” → xᵥ = −b/2a e substitua.','“Onde corta o eixo y” → é o c.']},
'sequencias':{i:'Sequência é uma lista com um <b>padrão</b>. Se de um termo para o outro sempre <b>soma</b> o mesmo número, é uma PA (escada). Se sempre <b>multiplica</b> pelo mesmo número, é uma PG (bola de neve).',r:['Diferença constante → PA: aₙ = a₁ + (n − 1)·r.','Divisão constante → PG: aₙ = a₁ · qⁿ⁻¹.','Soma dos termos de PA → (a₁ + aₙ)·n ÷ 2.']},
'angulos':{i:'Ângulo mede <b>o quanto algo gira</b>. Uma volta inteira é 360°, meia volta é 180° (linha reta) e um quarto de volta é 90° (canto de folha de papel).',r:['“Complemento” → 90° − ângulo.','“Suplemento” → 180° − ângulo.','Duas retas se cruzando → opostos pelo vértice são iguais; vizinhos somam 180°.']},
'retas-paralelas-transversal':{i:'Duas paralelas cortadas por uma transversal formam <b>8 ângulos</b>, mas só existem <b>2 valores</b>: um agudo e um obtuso, que somam 180°. Pense num “Z” (alternos iguais) e num “F” (correspondentes iguais).',r:['Formato Z → alternos internos: iguais.','Formato F → correspondentes: iguais.','Formato C/U (mesmo lado, entre as paralelas) → colaterais: somam 180°.']},
'triangulos':{i:'Todo triângulo, de qualquer formato, tem ângulos que somam <b>180°</b>. Rasgue os três cantos de um triângulo de papel e junte: eles formam uma linha reta. Esse fato resolve quase tudo.',r:['Falta um ângulo → 180° − os outros dois.','Isósceles → os dois ângulos da base são iguais.','“Existe triângulo com lados…?” → o maior lado tem que ser menor que a soma dos outros dois.']},
'poligonos':{i:'Todo polígono pode ser <b>fatiado em triângulos</b> a partir de um vértice: um polígono de n lados vira n − 2 triângulos. Como cada triângulo tem 180°, a soma dos ângulos internos é (n − 2) · 180°.',r:['Soma dos internos → (n − 2) · 180°.','Polígono regular → divida a soma por n para achar cada ângulo.','Ângulos externos sempre somam 360°; diagonais → n(n − 3) ÷ 2.']},
'perimetro':{i:'Perímetro é o <b>contorno</b>: quanto de cerca você precisa para cercar um terreno, ou de fita para contornar um quadro. É só somar todos os lados.',r:['“Cerca”, “rodapé”, “contorno”, “moldura” → perímetro.','Figura regular → lado × número de lados.','Círculo → comprimento C = 2πr.']},
'areas':{i:'Área é o <b>espaço de dentro</b>: quanto de piso ou de tinta você precisa. Medimos contando quantos quadradinhos de 1 × 1 cabem na figura, por isso a unidade é m², cm²…',r:['“Piso”, “pintar”, “gramado”, “terreno” → área.','Retângulo → base × altura; triângulo → base × altura ÷ 2.','Figura estranha → corte em retângulos e triângulos e some.']},
'circunferencia-circulo':{i:'<b>Circunferência</b> é só a borda (o aro da bicicleta); <b>círculo</b> é a borda com o recheio (a pizza inteira). Em qualquer círculo, a borda é cerca de 3,14 vezes o diâmetro: esse número é o π.',r:['Contorno, volta, aro → comprimento C = 2πr.','Superfície, pizza, tampa → área A = πr².','Deram o diâmetro → divida por 2 para achar o raio.']},
'pitagoras':{i:'Só vale em <b>triângulo retângulo</b> (com um canto de 90°). O quadrado do lado maior (hipotenusa, de frente para o canto reto) é igual à soma dos quadrados dos outros dois: a² = b² + c².',r:['Triângulo retângulo com 2 lados e falta 1 → Pitágoras.','Escada encostada na parede, diagonal de retângulo/TV → Pitágoras.','Falta a hipotenusa → some os quadrados; falta um cateto → subtraia.']},
'tales-semelhanca':{i:'Retas paralelas cortadas por duas transversais formam pedaços <b>proporcionais</b>, como as linhas de um caderno cortadas por duas réguas.',r:['Retas paralelas + duas transversais → Tales.','Monte {cima/baixo} = {cima/baixo} na mesma ordem.','Reta paralela a um lado do triângulo → Tales dentro do triângulo.']},
'semelhanca-triangulos':{i:'Triângulos semelhantes são “<b>zoom</b>” um do outro: mesmos ângulos, lados multiplicados pelo mesmo número k.',r:['Sombra, paralela a um lado, ampulheta, maquete → semelhança.','Ache primeiro quem corresponde a quem (lados de frente para ângulos iguais).','Área → multiplica por k²; perímetro → por k.']},
'elementos-notaveis':{i:'São as <b>4 linhas especiais</b> do triângulo (altura, mediana, bissetriz, mediatriz) e os <b>4 pontos</b> onde elas se encontram (ortocentro, baricentro, incentro, circuncentro).',r:['Aparece 90° com o lado → altura (ou mediatriz, se passar no meio do lado).','Aparece “ponto médio” → mediana; aparece “ângulo dividido em dois” → bissetriz.','Baricentro numa mediana → 2 partes para o vértice, 1 para o lado.']},
'relacoes-metricas':{i:'Quando traçamos a altura no triângulo retângulo, ele se divide em <b>dois triângulos menores semelhantes ao grande</b>. Das proporções entre eles saem as fórmulas.',r:['Aparece a altura relativa à hipotenusa e as projeções m e n → relações métricas.','Escolha a fórmula que tem as 2 medidas que você sabe + a que quer.','Tem só 2 lados do triângulo grande → Pitágoras primeiro.']},
'trigonometria':{i:'Num triângulo retângulo, o ângulo decide a “<b>forma</b>” do triângulo. Por isso as divisões entre os lados (seno, cosseno, tangente) dependem só do ângulo, não do tamanho. Com um ângulo e um lado, descobrimos todos os outros.',r:['Tem ângulo + um lado e quer outro lado → escolha sen, cos ou tg pelos lados envolvidos (SOH-CAH-TOA).','Ângulo de 30°, 45° ou 60° → use a tabela dos notáveis.','“Rampa”, “sombra”, “altura de prédio vista de longe” → trigonometria.']},
'volume':{i:'Volume é <b>quanto cabe dentro</b>: quantos cubinhos de 1 × 1 × 1 enchem a caixa. Capacidade é o mesmo volume medido em litros. Ligação de ouro: <b>1 dm³ = 1 litro</b> e 1 m³ = 1000 litros.',r:['Caixa (paralelepípedo) → comprimento × largura × altura.','Cubo → aresta³; cilindro → área da base × altura.','Pede em litros → converta: 1 dm³ = 1 L; 1 m³ = 1000 L.']},
'unidades-medida':{i:'Converter unidade é como trocar dinheiro: o valor é o mesmo, só muda a “moeda”. Na escada <b>km, hm, dam, m, dm, cm, mm</b>, cada degrau é ×10 para baixo e ÷10 para cima (área ×100, volume ×1000).',r:['Do maior para o menor → multiplica; do menor para o maior → divide.','m² → cada degrau é 100; m³ → cada degrau é 1000.','Tempo não é decimal: 1 h = 60 min (1,5 h = 1 h 30 min).']},
'plano-cartesiano':{i:'O plano cartesiano é um <b>mapa com endereço</b>: o ponto (3, 2) quer dizer “ande 3 para a direita e 2 para cima”. Primeiro o x (horizontal), depois o y (vertical), como “primeiro a rua, depois o andar”.',r:['Quadrante → olhe os sinais de x e de y.','Distância entre pontos → Pitágoras com as diferenças de x e de y.','Ponto médio → média dos x e média dos y.']},
'media-moda-mediana':{i:'São formas de resumir uma lista de números num só. <b>Média</b>: dividir tudo igualmente. <b>Moda</b>: o que está na moda (aparece mais). <b>Mediana</b>: o do meio da fila (depois de ordenar).',r:['“Média” → soma tudo e divide pela quantidade.','“Moda” → o que mais se repete.','“Mediana” → ordene primeiro! Quantidade par → média dos dois do meio.']},
'probabilidade':{i:'Probabilidade mede a <b>chance</b> de algo acontecer: casos que você quer ÷ todos os casos possíveis. Vai de 0 (impossível) a 1 (certeza), ou de 0% a 100%.',r:['Uma escolha → favoráveis ÷ possíveis.','“E” (os dois acontecem, independentes) → multiplica.','“Não acontecer” → 1 − probabilidade de acontecer.']},
'contagem':{i:'Para contar possibilidades sem listar uma por uma, divida a escolha em <b>etapas</b> e multiplique: 3 camisas e 2 calças dão 3 × 2 = 6 looks. É o princípio multiplicativo.',r:['Escolhas em etapas (e depois… e depois…) → multiplique as opções de cada etapa.','“Sem repetir” → a cada etapa sobra uma opção a menos.','Ordenar todos (anagramas, filas) → fatorial n!.']}
,'4-sistema-decimal':{i:'Imagine um prédio com cinco andares de valor: unidades, dezenas, centenas, milhares e dezenas de milhar. O algarismo vale de acordo com o andar em que está.',r:['“Qual é o valor do algarismo?” → descubra a posição e multiplique por 1, 10, 100, 1.000 ou 10.000.','“Maior ou menor?” → compare primeiro a casa mais à esquerda.']}
,'4-composicao-decomposicao':{i:'Decompor é desmontar um número em pecinhas de valor. Compor é juntar essas pecinhas para montar o número de novo.',r:['“Decomponha” → escreva cada algarismo multiplicado pelo valor da sua casa.','“Forme o número” → some milhares, centenas, dezenas e unidades.']}
,'4-adicao-subtracao-reagrupamento':{i:'Quando juntamos 10 unidades, podemos trocar por 1 dezena. Quando faltam unidades para tirar, trocamos 1 dezena por 10 unidades. É como trocar moedas.',r:['Na adição, 10 ou mais em uma coluna → reagrupa para a próxima.','Na subtração, o algarismo de cima é menor → faz a troca com a casa vizinha.']}
,'4-multiplicacao':{i:'Multiplicar é contar vários grupos do mesmo tamanho sem precisar somar um por um. Dobro é duas vezes; triplo é três vezes.',r:['“Cada caixa tem… e são… caixas” → multiplique.','“Dobro” → vezes 2; “triplo” → vezes 3.']}
,'4-divisao':{i:'Dividir é repartir de maneira justa. Todo mundo recebe a mesma quantidade; se sobrarem objetos, eles formam o resto.',r:['“Repartir igualmente” → divisão.','Confira com divisor × quociente + resto = total.']}
,'4-fracoes-unitarias':{i:'Pense numa pizza cortada em pedaços do mesmo tamanho. O número de baixo diz quantos pedaços existem; o 1 de cima diz que estamos olhando para apenas um pedaço.',r:['O inteiro precisa estar dividido em partes iguais.','Com o mesmo numerador 1, mais partes significam pedaços menores.']}
,'4-decimais-dinheiro':{i:'A vírgula separa reais e centavos. Um real vale 100 centavos: por isso R$ 2,50 são dois reais e cinquenta centavos.',r:['Duas casas depois da vírgula representam centavos.','Ao somar preços, deixe as vírgulas uma embaixo da outra.']}
,'4-sequencias-igualdade':{i:'Uma sequência é como uma brincadeira com uma regra escondida. Igualdade é uma balança: os dois lados precisam ter o mesmo valor.',r:['Observe quanto muda de um número para o próximo.','Na igualdade, descubra o número que mantém os dois lados equivalentes.']}
,'4-geometria':{i:'Figuras planas parecem desenhos no papel; sólidos parecem objetos que podemos segurar. Um canto de 90 graus é um ângulo reto.',r:['Duas bases iguais e paralelas → prisma. Uma base e faces triangulares que se encontram → pirâmide.','Retas que formam um canto de 90° → perpendiculares; que não se encontram → paralelas.']}
,'4-medidas-area':{i:'Usamos unidades diferentes para medir coisas diferentes: régua para comprimento, balança para massa e recipiente para capacidade. Área é o espaço coberto pela figura.',r:['Comprimento → cm ou m; massa → g ou kg; capacidade → mL ou L.','Na malha, conte os quadradinhos que cobrem a figura.']}
,'4-horas-duracao':{i:'O relógio divide o tempo em horas e minutos. Cada hora tem 60 minutos. Para saber a duração, contamos o caminho do começo até o fim.',r:['De uma hora cheia até a próxima → 60 minutos.','Se passar de 60 minutos, troque 60 por 1 hora.']}
,'4-tabelas-graficos-probabilidade':{i:'A tabela organiza os números e o gráfico transforma esses números em barras para comparar. Na chance, o que aparece mais vezes costuma ser mais provável.',r:['Barra mais alta → maior quantidade.','Mais provável não quer dizer certeza; impossível é algo que não pode acontecer.']}

};

function quizState(id){ if(!ST.quiz[id]) ST.quiz[id]={seed:0,idx:0,mode:'quiz',shown:{}}; return ST.quiz[id]; }
function fullList(id,seed){ return getList(id,seed).concat(seed===0?(ST.exProf[id]||[]):[]); }
function renderQuiz(id){
  var s=quizState(id), L=fullList(id,s.seed), prof=isProf(); if(s.idx>=L.length) s.idx=0;
  if(!prof&&s.mode==='quiz') logEv('questao',id+':'+s.seed+':'+s.idx,{n:s.idx+1,lista:s.seed+1},30);

  if(s.mode==='quiz'){

    h+='<div class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between"><span class="qnum">QUESTÃO '+(s.idx+1)+' DE '+L.length+'</span>'+(g.prof?'<span class="badge">do professor</span>':'')+'</div><div class="progress"><i style="width:'+((s.idx+1)/L.length*100)+'%"></i></div><div class="qtext">'+g.q+'</div>';
    var opts=quizOpts(id,s.seed,s.idx,g); var esc_=s.pick&&s.pick[s.idx];
    h+='<div class="stack" style="margin-top:14px" role="group" aria-label="Alternativas">'+opts.map(function(o,k){ var cls='btn ghost block opt'; if(shown){ if(o===g.a) cls='btn block opt on-ok'; else if(esc_===k) cls='btn block opt on-bad'; } return '<button class="'+cls+'" style="justify-content:flex-start;text-align:left" data-a="escolhe" data-id="'+id+'" data-v="'+k+'"'+(shown?' disabled':'')+'><b style="margin-right:6px">'+'ABCD'[k]+')</b> <span>'+o+'</span></button>'; }).join('')+'</div>';

    else h+='<button class="btn sm ghost" style="margin-top:10px" data-a="revela" data-id="'+id+'">Não sei — ver a resolução</button>';
    h+='<div class="qnav"><button class="btn ghost" data-a="qnav" data-id="'+id+'" data-v="-1" '+(s.idx===0?'disabled':'')+'>← Anterior</button><button class="btn '+(shown?'primary':'ghost')+'" data-a="qnav" data-id="'+id+'" data-v="1" '+(s.idx===L.length-1?'disabled':'')+'>Próxima →</button></div>';
    h+='<div class="dots" aria-label="Ir para a questão">'+L.map(function(_,k){ var v=ac[s.seed+':'+k]; return '<button data-a="qjump" data-id="'+id+'" data-v="'+k+'" class="'+(k===s.idx?'cur ':'')+(v===true?'ok':v===false?'bad':'')+'" aria-label="Questão '+(k+1)+'">'+(k+1)+'</button>'; }).join('')+'</div>';
    if(!prof) h+='<p class="small muted" style="margin-top:10px">Escolha uma alternativa. Cada acerto vale 4% do assunto (até 20 acertos); a teoria vale 20%. Vale a primeira tentativa.</p>';

function quizOpts(id,seed,idx,g){
  var key=id+'|'+seed+'|'+idx; ST.opts=ST.opts||{}; if(ST.opts[key]) return ST.opts[key];
  var corr=g.a, sc=strip(corr);
  if(/^(Sim|Não)$/.test(sc)) return ST.opts[key]=['Sim','Não'];
  var pool=[]; [0,1,2,3].forEach(function(d){ getList(id,seed+d*37).forEach(function(x){ pool.push(x.a); }); });
  var seen={}; seen[sc]=1; var first=sc.split(/\s/)[0], last=sc.split(/\s/).pop(), hasFr=/class="fr"/.test(corr), isNum=/^[−\d.,]+$/.test(sc);
  var cand=[]; pool.forEach(function(p){ var t=strip(p); if(seen[t]) return; seen[t]=1; var s=0; if(t.split(/\s/)[0]===first) s+=2; if(t.split(/\s/).pop()===last) s+=2; if(/class="fr"/.test(p)===hasFr) s+=1; if(/^[−\d.,]+$/.test(t)===isNum) s+=2; if(Math.abs(t.length-sc.length)<=4) s+=1; cand.push([s,p]); });
  var r=R(hashStr(key)); cand=r.sh(cand).sort(function(x,y){return y[0]-x[0];});
  var out=[corr].concat(cand.slice(0,3).map(function(c){return c[1];}));
  if(out.length<4 && isNum){ var v=parseFloat(sc.replace(/\./g,'').replace(',','.').replace('−','-')); [1,-1,2,10].forEach(function(dv){ if(out.length<4){ var w=n(v+dv); if(out.map(strip).indexOf(w)<0) out.push(w);} }); }
  return ST.opts[key]=r.sh(out);
}

  s.pick=s.pick||{}; s.pick[s.idx]=k; s.shown[s.idx]=1; logEv('resposta',id+':'+s.seed+':'+s.idx,{n:s.idx+1,lista:s.seed+1,ok:ok},0);

function subirArquivo(url,file,onProg){ return new Promise(function(ok,fail){
  if(MOCK){ MEM.blobs[url]=URL.createObjectURL(file); var p=0; var iv=setInterval(function(){ p+=25; onProg(Math.min(p,100)); if(p>=100){ clearInterval(iv); ok(); } },120); return; }
  var fd=new FormData(); fd.append('cacheControl','3600'); fd.append('',file,file.name);
  var x=new XMLHttpRequest(); x.open('PUT',url); x.setRequestHeader('x-upsert','false');
  x.upload.onprogress=function(e){ if(e.lengthComputable) onProg(Math.round(e.loaded/e.total*100)); };
  x.onload=function(){ if(x.status>=200&&x.status<300) ok(); else { var m=''; try{ m=JSON.parse(x.responseText).message; }catch(e){} fail(new Error('O envio do arquivo falhou'+(m?': '+m:'')+'.')); } };
  x.onerror=function(){ fail(new Error('Sem conexão com a internet.')); };
  x.send(fd); }); }

function nomeTopico(id){ if(id&&TBY[id]) return strip(TBY[id].nome); var pt=id&&PORTUGUES_TOPICS.filter(function(t){return t.id===id;})[0]; return pt?'Português: '+pt.nome:'assunto'; }
async function ativHTML(al){

  // linha do tempo, agrupando questões do mesmo assunto/lista no mesmo dia
  var dias={}, ordem=[];
  ev.slice().reverse().forEach(function(e){ var dk=isoDate(new Date(e.created_at)); if(!dias[dk]){ dias[dk]={itens:[],quiz:{}}; ordem.push(dk); } var D=dias[dk], det=e.detalhe||{};
    if(e.tipo==='questao'||e.tipo==='resposta'||e.tipo==='revelou'){ var tp=String(e.ref||'').split(':')[0], qk=tp+'|'+(det.lista||1); var g=D.quiz[qk];
      if(!g){ g=D.quiz[qk]={tipo:'quiz',topic:tp,lista:det.lista||1,ini:e.created_at,fim:e.created_at,vistas:{},ok:0,err:0,rev:0}; D.itens.push(g); }
      g.fim=e.created_at; if(det.n) g.vistas[det.n]=1; if(e.tipo==='resposta'){ if(det.ok) g.ok++; else g.err++; } if(e.tipo==='revelou') g.rev++; }
    else D.itens.push({tipo:e.tipo,ref:e.ref,det:det,ini:e.created_at,fim:e.created_at}); });
  function linha(it){ var txt;
    if(it.tipo==='quiz'){ var ns=Object.keys(it.vistas).map(Number).sort(function(a,b){return a-b;}); var partes=[]; if(it.ok) partes.push('acertou '+it.ok); if(it.err) partes.push('errou '+it.err); if(it.rev) partes.push('pediu a resolução '+it.rev+'x');
      txt='✏️ <b>'+esc(nomeTopico(it.topic))+'</b> · Lista '+it.lista+': viu '+(ns.length===1?'a questão '+ns[0]:ns.length+' questões ('+ns.join(', ')+')')+(partes.length?' · '+partes.join(', '):''); }
    else if(it.tipo==='app') txt='📱 Abriu o app';
    else if(it.tipo==='assunto') txt='📖 Abriu o assunto <b>'+esc(nomeTopico(it.ref))+'</b>';
    else if(it.tipo==='lista') txt='📝 Abriu a lista <b>"'+esc(it.det.titulo||'')+'"</b>';
    else if(it.tipo==='jogo') txt='🎮 Jogou <b>'+esc(it.det.jogo||'')+'</b> ('+esc(nomeTopico(it.ref))+'): '+(it.det.acertos||0)+' de '+(it.det.de||5)+' ⭐';
    else if(it.tipo==='material') txt='📄 Abriu o PDF <b>"'+esc(it.det.titulo||'')+'"</b>';
    else if(it.tipo==='pagamentos') txt='💰 Viu a tela de pagamentos';
    else if(it.tipo==='ia') txt='✨ Usou o Professor IA em <b>'+esc(nomeTopico(it.ref))+'</b>';
    else txt=esc(it.tipo);
    var hr=hhmm(it.ini)+(hhmm(it.fim)!==hhmm(it.ini)?'–'+hhmm(it.fim):'');
    return '<div class="item" style="padding:10px 12px"><span class="small muted" style="min-width:74px;font-weight:700">'+hr+'</span><div class="grow small">'+txt+'</div></div>'; }
  x+='<h2>Linha do tempo</h2>'+(ordem.length?ordem.reverse().map(function(dk){ var D=dias[dk]; return '<h3 style="margin:14px 0 6px;font-size:15px;text-transform:capitalize">'+esc(diaRel(dk+'T12:00:00'))+'</h3><div class="stack">'+D.itens.slice().reverse().map(linha).join('')+'</div>'; }).join(''):'<p class="muted">Nenhuma atividade registrada ainda. Os registros começam a aparecer a partir de agora, quando o aluno usar o app.</p>');
  x+='<p class="small muted" style="margin-top:14px">Os registros de atividade ficam guardados por 90 dias e depois são apagados automaticamente.</p>';
  return x;
}
/* ================= FINANCEIRO ================= */
var DIAS_C=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'], DIAS_L=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
function brl(v){ return (+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function durTxt(m){ m=+m||60; return m%60===0? (m/60)+'h' : (m>60? Math.floor(m/60)+'h'+String(m%60).padStart(2,'0') : m+' min'); }
function dataLonga(iso){ var d=new Date(iso+'T12:00:00'); return DIAS_C[d.getDay()]+' '+fmtData(iso); }
function ehMensal(al){ return !!(al&&al.valor_mensal!=null&&al.valor_mensal!==''&&+al.valor_mensal>0); }
function ehMens(a){ return a&&a.tipo==='mensalidade'; }
// ciclos da mensalidade a partir do início (ex.: 30/11 → 30/11 a 29/12, 30/12 a 29/01…; no mês curto usa o último dia)
function mesMais(iso,k){ var y=+iso.slice(0,4), m=+iso.slice(5,7)-1+k, dia=+iso.slice(8,10); y+=Math.floor(m/12); m=((m%12)+12)%12; var ult=new Date(y,m+1,0).getDate(); return y+'-'+String(m+1).padStart(2,'0')+'-'+String(Math.min(dia,ult)).padStart(2,'0'); }
function ciclosMensais(al,ate){ var h=horarioDe(al), out=[]; if(!ehMensal(al)||!h.desde) return out; for(var k=0;k<240;k++){ var ini=mesMais(h.desde,k); if(ini>ate) break; var f=new Date(mesMais(h.desde,k+1)+'T12:00:00'); f.setDate(f.getDate()-1); out.push({data:ini,fim:isoDate(f),valor:+al.valor_mensal}); } return out; }
function periodoTxt(ini,fim){ return ini.slice(8,10)+'/'+ini.slice(5,7)+' a '+fim.slice(8,10)+'/'+fim.slice(5,7); }
function valorAula(a,al){ if(a.valor!=null&&a.valor!=='') return +a.valor; if(ehMens(a)) return 0; return al&&al.valor_hora? Math.round(al.valor_hora*(+a.duracao_min||60)/60*100)/100 : 0; }
function horarioDe(al){ var h=al&&al.horario; if(typeof h==='string'){ try{ h=JSON.parse(h); }catch(e){ h=null; } } return h&&h.slots?h:{desde:null,slots:[]}; }
// aulas do horário fixo entre duas datas (inclusive)
function slotsEntre(al,de,ate){ var h=horarioDe(al), out=[]; if(!h.slots.length) return out; var d=new Date(de+'T12:00:00'), fim=new Date(ate+'T12:00:00'); if(h.desde){ var ds=new Date(h.desde+'T12:00:00'); if(ds>d) d=ds; }
  for(;d<=fim;d.setDate(d.getDate()+1)){ var iso=isoDate(d); h.slots.forEach(function(s){ if(+s.dia===d.getDay()) out.push({data:iso,hora:s.hora,duracao_min:+s.dur||60}); }); } return out; }
function finResumo(al,aulas){
  var hojeIso=isoDate(hoje()), mes=hojeIso.slice(0,7);
  var pend=aulas.filter(function(a){return a.status==='pendente';}).sort(function(a,b){return a.data<b.data?-1:1;});
  var pagas=aulas.filter(function(a){return a.status==='paga';}).sort(function(a,b){return (b.pago_em||b.data)<(a.pago_em||a.data)?-1:1;});
  var tem={}; aulas.forEach(function(a){ tem[a.data+'|'+(a.hora||'')]=1; });
  var ini=new Date(hoje()); ini.setDate(ini.getDate()-28);
  var mensal=ehMensal(al), temMens={}; aulas.forEach(function(a){ if(ehMens(a)) temMens[a.data]=1; });
  var confirmar=mensal?[]:slotsEntre(al,isoDate(ini),hojeIso).filter(function(s){ return !tem[s.data+'|'+s.hora]; });
  var mensais=ciclosMensais(al,hojeIso).filter(function(c){ return !temMens[c.data]; });
  var fim=new Date(hoje()); fim.setDate(fim.getDate()+7); var amanha=new Date(hoje()); amanha.setDate(amanha.getDate()+1);
  var prox=slotsEntre(al,isoDate(amanha),isoDate(fim)).filter(function(s){ return !tem[s.data+'|'+s.hora]; });
  return { pend:pend, pagas:pagas, confirmar:confirmar, prox:prox, mensal:mensal, mensais:mensais,
    totPend:pend.reduce(function(s,a){return s+valorAula(a,al);},0),
    recMes:pagas.filter(function(a){return String(a.pago_em||a.data).slice(0,7)===mes;}).reduce(function(s,a){return s+valorAula(a,al);},0),
    totProx:mensal?0:prox.reduce(function(s,a){return s+valorAula(a,al);},0) };
}
function aulaLinha(a,al,acoes){ return '<div class="item">'+(acoes&&a.status==='pendente'?'<input type="checkbox" class="finsel" value="'+a.id+'" aria-label="Selecionar aula de '+esc(dataLonga(a.data))+'" style="width:22px;height:22px;min-height:0;margin-top:2px;flex-shrink:0">':'')+'<div class="grow"><b>'+(ehMens(a)?'Mensalidade':esc(dataLonga(a.data))+(a.hora?' · '+esc(a.hora):''))+'</b><span class="small muted">'+(ehMens(a)?'':durTxt(a.duracao_min))+(a.status==='paga'&&a.pago_em?(ehMens(a)?'':' · ')+'pago em '+fmtData(a.pago_em):'')+(a.obs?(ehMens(a)&&!(a.status==='paga'&&a.pago_em)?'':' · ')+esc(a.obs):'')+'</span></div><b style="white-space:nowrap">'+brl(valorAula(a,al))+'</b>'+(acoes?'<div class="row" style="gap:6px;flex-shrink:0">'+(a.status==='pendente'?'<button class="btn sm" style="background:var(--okbg);border-color:#B7DFC5;color:var(--ok)" data-a="finPagar" data-id="'+a.id+'">Pago</button>':'')+'<button class="btn sm ghost" data-a="finEditar" data-id="'+a.id+'" aria-label="Editar lançamento">✎</button></div>':'')+'</div>'; }
function pendTxt(pend){ var m=pend.filter(ehMens).length, au=pend.length-m; return [m?m+' mensalidade(s)':'',au?au+' aula(s)':''].filter(Boolean).join(' + ')+' a pagar'; }
function finCards(r,al){
  var semValor=!al.valor_hora&&r.pend.some(function(a){return a.valor==null&&!ehMens(a);});
  return '<div class="stats"><div class="stat" style="border-color:'+(r.totPend?'#F2BDBD':'var(--line)')+';background:'+(r.totPend?'var(--badbg)':'#fff')+'"><b style="color:'+(r.totPend?'var(--bad)':'var(--ok)')+'">'+brl(r.totPend)+'</b><span>'+(r.pend.length?pendTxt(r.pend):'nada pendente 🎉')+'</span></div>'+(ehMensal(al)?'<div class="stat"><b>'+brl(al.valor_mensal)+'</b><span>mensalidade fixa</span></div>':'')+'<div class="stat"><b>'+brl(r.recMes)+'</b><span>pago neste mês</span></div></div>'+(semValor&&isProf()?'<div class="err" style="margin-top:10px">Defina o valor da hora em "Horário e valor" para calcular os totais.</div>':'');
}
async function loadFin(al){ var aulas=await DB.q('aulas',{eq:{student_id:al.id},order:['data',false]}); ST.fin={al:al,aulas:aulas,by:{}}; aulas.forEach(function(a){ ST.fin.by[a.id]=a; }); return finResumo(al,aulas); }

/* ================= SEQUÊNCIA (estilo Duolingo) ================= */
function diaBR(off){ var d=new Date(Date.now()-3*3600*1000+(off||0)*86400000); return d.toISOString().slice(0,10); }
function diaSemana(iso){ return new Date(iso+'T12:00:00Z').getUTCDay(); }
async function loadAtiv(uid){ var m={}; try{ (await DB.q('atividade',{eq:{student_id:uid},order:['dia',false],limit:400})).forEach(function(r){ m[r.dia]=r.xp; }); }catch(e){} return m; }
function streakInfo(ativ,meta){
  ativ=ativ||ST.ativ||{}; meta=meta||(ST.me&&ST.me.meta_xp)||20;
  var hoje=diaBR(0), xpHoje=ativ[hoje]||0, met=xpHoje>=meta, seq=0;
  for(var k=met?0:1;k<400;k++){ if((ativ[diaBR(-k)]||0)>=meta) seq++; else break; }
  var rec=0,cur=0; Object.keys(ativ).sort().forEach(function(d,i,arr){ if(ativ[d]>=meta){ var prev=i>0?arr[i-1]:null; var dd=new Date(d+'T12:00Z'), pp=prev?new Date(prev+'T12:00Z'):null; cur=(pp&&(dd-pp)===86400000&&ativ[prev]>=meta)?cur+1:1; rec=Math.max(rec,cur);} });
  return {seq:seq,metHoje:met,xpHoje:xpHoje,meta:meta,emRisco:!met&&seq>0,recorde:Math.max(rec,seq)};
}
function flame(sz,st){ var on=st!=='off'; return '<svg viewBox="0 0 24 24" width="'+sz+'" height="'+sz+'" aria-hidden="true"><path d="M12 2c1 3.5 5.5 6 5.5 11.2A5.6 5.6 0 0 1 12 19a5.6 5.6 0 0 1-5.5-5.8c0-2.6 1.4-4.4 2.6-5.4.1 1.7.9 3 2 3.6C11 9 10.6 5.4 12 2z" fill="'+(on?'#FF9600':'#C4CBDB')+'"/><path d="M12 11.5c.6 1.6 2.6 2.6 2.6 4.6a2.6 2.6 0 0 1-5.2 0c0-1.3.8-2.2 1.5-2.7.2.8.6 1.3 1.1 1.5-.2-1.2-.3-2.3 0-3.4z" fill="'+(on?'#FFD23F':'#E3E7F0')+'"/></svg>'; }
async function addXP(n){
  if(isProf()||!n) return; var d=diaBR(0), meta=ST.me.meta_xp||20; var antes=ST.ativ[d]||0, depois=antes+n; ST.ativ[d]=depois;
  try{ await DB.ups('atividade',{student_id:ST.me.id,dia:d,xp:depois,updated_at:new Date().toISOString()},'student_id,dia'); }catch(e){}
  if(antes<meta&&depois>=meta) ST.celebrar=true;
  var chip=document.querySelector('.streakchip'); if(chip){ var t=document.createElement('div'); t.innerHTML=topExtras(); chip.replaceWith(t.firstChild); }
  maybeCelebrate();
}
function semanaHTML(ativ,meta){
  var nomes=['D','S','T','Q','Q','S','S'], h='<div class="week">';
  for(var k=6;k>=0;k--){ var d=diaBR(-k), ok=(ativ[d]||0)>=meta, hoje=k===0; h+='<div class="wd'+(ok?' ok':'')+(hoje?' hoje':'')+'"><span>'+nomes[diaSemana(d)]+'</span><i>'+(ok?'✓':'')+'</i></div>'; }
  return h+'</div>';
}
function streakCard(){

  var msg=s.metHoje?'Meta de hoje cumprida! Volte amanhã para manter a chama. 🔥':(s.emRisco?'Sua sequência de '+s.seq+' dia'+(s.seq>1?'s':'')+' acaba à meia-noite! Faltam '+(s.meta-s.xpHoje)+' XP.':'Faça '+s.meta+' XP hoje para começar uma sequência.');

   Rodadas curtas, mascote, estrelas e confete. Em Matemática os acertos contam no progresso
   do assunto (chaves "j:..." em progress.acertos); em Português dão só XP. */
var JG_R = 5;

/* ---------- números por extenso (até 99.999) ---------- */
var EXT_U=['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
var EXT_D=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
var EXT_C=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
function ext999(x){ if(!x) return ''; if(x===100) return 'cem'; var c=Math.floor(x/100), r=x%100, p=[]; if(c) p.push(EXT_C[c]); if(r){ if(r<20) p.push(EXT_U[r]); else p.push(EXT_D[Math.floor(r/10)]+(r%10?' e '+EXT_U[r%10]:'')); } return p.join(' e '); }
function extenso(N){ if(!N) return 'zero'; var mil=Math.floor(N/1000), r=N%1000, s=mil?(mil===1?'mil':ext999(mil)+' mil'):''; if(r) s+=(s?(r<100||r%100===0?' e ':' '):'')+ext999(r); return s; }

function falaCasas(x){ var d=digitos5(x), f=[]; d.forEach(function(q,i){ if(q) f.push(q+' '+(q>1?CASAS[i].np:CASAS[i].n)); }); return f.length>1?f.slice(0,-1).join(', ')+' e '+f[f.length-1]:(f[0]||'zero'); }
function parcelas(x){ var d=digitos5(x), p=[]; d.forEach(function(q,i){ if(q) p.push(n(q*CASAS[i].v)); }); return p; }

A.jgParE=function(el){ var jg=ST.jg; if(!jg||jg.fb) return; jg.cur.sel=+el.dataset.v; jgPaint(); };
A.jgParD=function(el){ var jg=ST.jg; if(!jg||jg.fb) return; var c=jg.cur, i=+el.dataset.v; if(c.sel==null){ toast('Primeiro toque numa palavra da esquerda 👈'); return; }
  if(c.sel===i){ c.feitos[i]=1; c.sel=null; if(Object.keys(c.feitos).length===jg.ronda.pares.length){ jgResolver(c.erros<=1); return; } } else { c.erros++; c.sel=null; toast('Hmm, esses dois não combinam 🤔'); } jgPaint(); };
A.jgPal=function(el){ var jg=ST.jg; if(!jg||jg.fb) return; var i=el.dataset.v; if(jg.cur.s[i]) delete jg.cur.s[i]; else jg.cur.s[i]=1; jgPaint(); };
A.jgPoe=function(el){ var jg=ST.jg; if(!jg||jg.fb) return; jg.cur.usadas.push(+el.dataset.v); jgPaint(); };
A.jgTira=function(el){ var jg=ST.jg; if(!jg||jg.fb) return; jg.cur.usadas.splice(+el.dataset.v,1); jgPaint(); };

/* ================= PORTUGUÊS: página do assunto ================= */
var PT_TEORIA={
'pt4-1':`<h3>O que é interpretar?</h3><p>Interpretar é <b>entender</b> o texto, como um detetive 🕵️. Existem três jeitos de perguntar sobre um texto:</p>
<div class="ex"><b>1. Localizar 🔎</b> — a resposta está <b>escrita</b> no texto.<ol><li>“Lia levou suco de uva.” Pergunta: que suco Lia levou?</li><li>Volte ao texto e ache: <b>suco de uva</b>.</li></ol></div>
<div class="ex"><b>2. Inferir 🧠</b> — a resposta <b>não está escrita</b>, mas as pistas mostram.<ol><li>“Ela pegou o guarda-chuva e a capa.”</li><li>Não está escrito “estava chovendo”, mas as pistas mostram que <b>estava chovendo</b>!</li></ol></div>
<div class="ex"><b>3. Ideia principal 💡</b> — do que o texto fala, no geral?<ol><li>Pense: se fosse contar o texto em <b>uma frase só</b>, o que diria?</li><li>Essa frase é a ideia principal.</li></ol></div>
<p class="tip"><b>Dica de ouro:</b> leia a pergunta, volte ao texto e sublinhe a parte que responde.</p>`,
'pt4-2':`<h3>Cada texto tem um jeitinho</h3><p>Os textos servem para coisas diferentes. Olhe as <b>pistas</b> para saber qual é qual:</p>
<div class="ex"><b>📝 Bilhete</b> — um recado curto para alguém.<ol><li>Tem para quem é: “Pedro,”</li><li>Tem o recado: “fui ao mercado”.</li><li>Tem quem escreveu: “Beijos, mamãe.”</li></ol></div>
<div class="ex"><b>📰 Notícia</b> — conta um fato que aconteceu de verdade.<ol><li>Diz <b>onde</b> e <b>quando</b>: “Recife, 12 de março”.</li><li>Conta o que aconteceu, quem participou.</li></ol></div>
<div class="ex"><b>🦊 Fábula</b> — historinha curta com bichos que falam e agem como gente.<ol><li>No final tem uma <b>moral</b>: um ensinamento.</li></ol></div>
<div class="ex"><b>🔢 Problema matemático</b> — um texto com números e uma <b>pergunta</b> para resolver com conta.<ol><li>“Ana tinha 24 figurinhas e ganhou 15. Quantas tem agora?”</li></ol></div>`,
'pt4-3':`<h3>Sinônimos 🤝 e antônimos 🔄</h3>
<div class="ex"><b>Sinônimos</b> são palavras que querem dizer <b>quase a mesma coisa</b>.<ol><li>feliz = alegre</li><li>bonito = lindo</li><li>rápido = veloz</li></ol></div>
<div class="ex"><b>Antônimos</b> são palavras que querem dizer <b>o contrário</b>.<ol><li>alto ↔ baixo</li><li>quente ↔ frio</li><li>abrir ↔ fechar</li></ol></div>
<p class="tip"><b>Para que serve?</b> Para não repetir palavras no seu texto: em vez de “feliz, feliz, feliz”, use “alegre” e “contente”.</p>`,
'pt4-4':`<h3>As palavras têm “profissões”</h3>
<div class="ex"><b>🏷️ Substantivo</b> dá <b>nome</b>: pessoas, bichos, coisas e lugares.<ol><li>Pedro, gato, bola, escola, Recife.</li></ol></div>
<div class="ex"><b>🎨 Adjetivo</b> diz <b>como é</b>: cor, tamanho, jeito.<ol><li>gato <b>preto</b>, bola <b>nova</b>, menina <b>alegre</b>.</li></ol></div>
<div class="ex"><b>🏃 Verbo</b> mostra uma <b>ação</b>: o que alguém faz ou fez.<ol><li>correr, pulou, comeu, canta.</li><li>Truque: dá para colocar “eu” ou “ele” na frente? “Ele <b>pulou</b>.” Então é verbo!</li></ol></div>
<p class="tip">Na frase “O gato <b>preto</b> <b>dormiu</b> no sofá”: gato e sofá são substantivos, preto é adjetivo, dormiu é verbo.</p>`,
'pt4-5':`<h3>Os sinais que dão o tom</h3>
<div class="ex"><b>. Ponto final</b> — termina uma frase que conta algo.<ol><li>Eu moro em Recife.</li></ol></div>
<div class="ex"><b>? Ponto de interrogação</b> — aparece nas perguntas.<ol><li>Qual é o seu nome?</li></ol></div>
<div class="ex"><b>! Ponto de exclamação</b> — mostra emoção: alegria, susto, surpresa.<ol><li>Que gol lindo!</li></ol></div>
<div class="ex"><b>, Vírgula</b> — faz uma pausinha.<ol><li>Separa coisas numa lista: banana, maçã, uva e pera.</li><li>Vem depois do nome de quem chamamos: Mariana, venha jantar!</li></ol></div>`,
'pt4-6':`<h3>Como montar uma frase bonita</h3>
<div class="ex"><b>Toda frase tem:</b><ol><li>Letra <b>maiúscula</b> no começo.</li><li>Um <b>sentido</b>: quem fez o quê.</li><li>Um <b>sinal</b> no final: . ? ou !</li></ol></div>
<div class="ex"><b>Exemplo:</b> as palavras “sofá / O / dormiu / gato / no.”<ol><li>Quem? <b>O gato</b> (começa com maiúscula).</li><li>Fez o quê? <b>dormiu</b>.</li><li>Onde? <b>no sofá.</b> (tem o ponto final).</li><li>Frase: <b>O gato dormiu no sofá.</b></li></ol></div>
<div class="ex"><b>Deixe a frase mais legal:</b><ol><li>O gato dormiu.</li><li>O gato <b>preto</b> dormiu <b>no sofá macio</b>.</li><li>Use adjetivos e diga onde e quando!</li></ol></div>`
};
function ptTopico(id){ return PORTUGUES_TOPICS.filter(function(t){return t.id===id;})[0]; }
async function vPt(id,tab){ var t=ptTopico(id); if(!t){ location.hash='#/assuntos'; return; }
  tab=tab||ST.tab[id]||'jogos'; ST.tab[id]=tab; var prof=isProf();
  var h='<div class="row wrap"><span class="badge">'+t.ano+'</span><span class="badge gray">Português</span></div><h1 style="margin-top:8px">'+esc(t.nome)+'</h1>';
  var tabs=[['jogos','🎮 Jogar'],['aprender','📖 Aprender'],['pdfs','📄 PDFs']];
  h+='<div class="tabs" role="tablist">'+tabs.map(function(x){return '<button role="tab" aria-selected="'+(tab===x[0])+'" class="'+(tab===x[0]?'on':'')+'" data-a="ptTab" data-id="'+id+'" data-v="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div><div id="tabBody"></div>';
  page({title:'Português',sub:t.ano,back:true,nav:prof?'conteudo':'assuntos',body:h});
  if(!prof) logEv('assunto',id);
  var tb=document.getElementById('tabBody');
  if(tab==='jogos') tb.innerHTML=jgTela(id);
  else if(tab==='aprender') tb.innerHTML='<div class="card teoria">'+fx(PT_TEORIA[id]||'')+'</div><button class="btn gold block" style="margin-top:12px" data-a="ptTab" data-id="'+id+'" data-v="jogos">🎮 Agora vamos jogar!</button>';
  else { tb.innerHTML='<div class="loading">Carregando…</div>'; var L=[]; try{ L=((await server('materiais',{acao:'listar',disciplina:'Português'})).materiais||[]).filter(function(m){return m.assunto===t.nome;}); }catch(e){}
    L.forEach(function(m){ (ST.mats=ST.mats||{})[m.id]=m; }); if(prof) await getAlunos();
    tb.innerHTML=(L.length?'<div class="stack">'+L.map(matItem).join('')+'</div>':'<p class="empty">'+(prof?'Nenhum PDF neste assunto ainda.':'O professor ainda não mandou PDFs deste assunto.')+'</p>')+(prof?'<button class="btn gold block" style="margin-top:10px" data-a="novoMat" data-disc="Português" data-ano="'+t.ano+'" data-assunto="'+esc(t.nome)+'">+ Enviar PDF para este assunto</button>':''); }
}
A.ptTab=function(el){ ST.tab[el.dataset.id]=el.dataset.v; vPt(el.dataset.id,el.dataset.v); window.scrollTo(0,0); };

boot();
})();
