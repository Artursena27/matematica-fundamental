<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1B3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mat Academy">
<meta name="description" content="Teoria, exercícios e acompanhamento de Matemática Academy.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<title>Matemática Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap">
<style>
:root{--navy:#0E1B3D;--navy2:#1A2C5C;--line:#DDE3F0;--bg:#F3F5FB;--card:#fff;--ink:#14213D;--muted:#55627F;--accent:#FFC93C;--accent2:#FFE7A3;--ok:#128C4A;--okbg:#E4F4EA;--bad:#C62828;--badbg:#FDECEC;--wa:#128C4A;--r:18px;--safeb:env(safe-area-inset-bottom,0px);--safet:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{font-size:16px;width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--navy)}
textarea{min-height:96px;resize:vertical}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
a{color:inherit}
.hidden{display:none!important}
/* topo */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + var(--safet)) 14px 10px;display:flex;align-items:center;gap:10px}
.top .logo{width:36px;height:36px;border-radius:11px;background:var(--accent);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;flex-shrink:0}
.top .tt{flex:1;min-width:0}
.top .tt b{display:block;font-size:16px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tt small{color:#C9D3EC;font-size:12px;font-weight:600}
.top .back{background:none;border:none;color:#fff;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-left:-6px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent2);color:var(--navy);font-weight:900;display:flex;align-items:center;justify-content:center;border:none;flex-shrink:0}
main{padding:16px 14px calc(96px + var(--safeb));max-width:900px;margin:0 auto}
/* navegação inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safeb));box-shadow:0 -4px 16px rgba(14,27,61,.06)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:700;padding:6px 2px;border-radius:12px;min-height:52px;position:relative}
.nav a.on{color:var(--navy)}
.nav a.on svg{background:var(--accent2);border-radius:10px}
.nav svg{width:40px;height:28px;padding:3px 9px}
.nav .dot{position:absolute;top:4px;right:calc(50% - 20px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 4px}
@media (min-width:900px){.nav{left:50%;transform:translateX(-50%);max-width:700px;border-radius:20px 20px 0 0;border:1px solid var(--line)}}
/* blocos */
h1{font-size:24px;line-height:1.15;margin:4px 0 12px;letter-spacing:-.02em;font-weight:900}
h2{font-size:18px;margin:22px 0 10px;font-weight:900}
h3{font-size:17px;margin:22px 0 8px;font-weight:800}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:620px){.grid{grid-template-columns:1fr 1fr}}
@media (min-width:880px){.grid.g3{grid-template-columns:1fr 1fr 1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 18px;border-radius:14px;border:2px solid var(--navy);background:#fff;color:var(--navy);font-weight:800;text-decoration:none;text-align:center}
.btn.primary{background:var(--navy);color:#fff}
.btn.gold{background:var(--accent);border-color:var(--accent);color:var(--navy)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.ghost{border-color:var(--line)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;color:var(--muted)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.badge{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--accent2);color:var(--navy)}
.badge.gray{background:#E8ECF6}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.bad{background:var(--badbg);color:var(--bad)}
.search{position:relative}
.search input{padding-left:46px;border-radius:16px}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%)}
/* card de assunto com régua */
.tcard{position:relative;display:flex;flex-direction:column;gap:8px;padding:14px 14px 12px;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);text-decoration:none;min-height:104px}
.tcard:active{transform:scale(.99)}
.tcard .badge{align-self:flex-start}
.tcard b{font-size:16px;line-height:1.25;padding-right:58px}
.pct{position:absolute;top:10px;right:10px;font-weight:900;font-size:13px;padding:4px 8px;border-radius:10px;color:#fff;min-width:46px;text-align:center}
.ruler{position:relative;height:10px;border-radius:6px;background:linear-gradient(90deg,#D32F2F,#F57C00 30%,#FBC02D 55%,#7CB342 78%,#2E7D32);margin-top:auto}
.ruler i{position:absolute;top:0;right:0;bottom:0;background:rgba(232,236,246,.92);border-radius:0 6px 6px 0}
.ruler s{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--navy);transform:translateX(-50%)}
.big-ruler{height:14px}
/* tema */
.tabs{display:flex;gap:4px;background:#E6EAF4;padding:4px;border-radius:14px;margin:12px 0}
.tabs button{flex:1;border:none;background:none;padding:10px 6px;border-radius:11px;font-weight:800;color:var(--muted);font-size:14px;min-height:42px}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.teoria{font-size:16.5px}
.ideia,.reconhecer,.indice,.teste{border-radius:14px;padding:12px 14px;margin:0 0 12px}
.ideia{background:#FFF4D1;border-left:5px solid #F5B700}
.reconhecer{background:#E9F7EF;border-left:5px solid #1E8E3E}
.reconhecer ul{margin:4px 0 0}
.indice{background:#F4F6FB}
.indice summary{cursor:pointer;margin:0}
.chips-i{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.indice a{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13.5px;color:inherit;text-decoration:none}
.ideia-tit{font-weight:800;font-size:15px;margin-bottom:4px}
.ideia p{margin:0}
.teste{background:#EEF2FD;margin-top:22px}
.tq{background:#fff;border-radius:12px;padding:10px 12px;margin:8px 0}
.tq summary{cursor:pointer;color:#1F6FEB;font-weight:700;margin-top:6px;min-height:32px;display:flex;align-items:center}
.tq ol{margin:6px 0;padding-left:20px}
.teoria h3[id]{scroll-margin-top:80px}

.teoria h3{margin-top:26px;padding-top:4px;border-top:2px dashed var(--line)}
.teoria h3:first-child{border-top:none;margin-top:4px}
.teoria ul,.teoria ol{padding-left:22px}
.teoria li{margin:5px 0}
.ex{background:#EEF2FD;border-radius:14px;padding:12px 14px;margin:10px 0;overflow-x:auto}
.ex ol,.ex ul{margin:6px 0}
.tip{background:#FFF4D1;border-radius:14px;padding:12px 14px}
.big{font-size:20px;text-align:center}
table.t{border-collapse:collapse;margin:10px 0;width:100%;font-size:14.5px;display:block;overflow-x:auto}
table.t td,table.t th{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:middle;background:#fff}
table.t th{background:#EEF2FD}
.teoria svg{max-width:100%;height:auto;display:block;margin:8px auto}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.12}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.ov{border-top:2px solid currentColor;padding:0 2px}
.hl{background:var(--accent);padding:0 3px;border-radius:4px}
sup{font-size:.7em}
.qnum{font-weight:900;color:var(--muted);font-size:13px;letter-spacing:.08em}
.progress{height:8px;background:#E6EAF4;border-radius:4px;margin:8px 0 14px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:4px}
.qtext{font-size:19px;font-weight:700;line-height:1.5;overflow-x:auto}
.answer{margin-top:16px;border-radius:16px;background:var(--okbg);padding:14px}
.answer .ans{font-size:20px;font-weight:900;color:var(--ok);overflow-x:auto}
.steps{margin:8px 0 0;padding-left:22px}
.steps li{margin:6px 0}
.opt{min-height:52px;font-weight:600;border-width:2px}
.opt .fr{vertical-align:middle}
.btn.on-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.on-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.opt:disabled{opacity:1}
.selfcheck{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.selfcheck .btn.on-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.selfcheck .btn.on-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.qnav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.dots button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:13px;color:var(--muted)}
.dots button.cur{border-color:var(--navy);color:var(--navy);border-width:2px}
.dots button.ok{background:var(--okbg);color:var(--ok);border-color:#B7DFC5}
.dots button.bad{background:var(--badbg);color:var(--bad);border-color:#F2BDBD}
.fab{position:fixed;right:14px;bottom:calc(84px + var(--safeb));z-index:25;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.fab{flex-direction:row}
.fab button{border:none;border-radius:999px;padding:10px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(14,27,61,.28);display:flex;align-items:center;gap:6px;min-height:46px}
main.has-fab{padding-bottom:calc(160px + var(--safeb))}
.fab .ia{background:var(--navy);color:#fff}
.fab .duv{background:var(--accent);color:var(--navy)}
/* folha inferior (modal) */
.sheet-bg{position:fixed;inset:0;background:rgba(14,27,61,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:var(--safeb);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet header b{flex:1;font-size:17px}
.sheet .x{border:none;background:#EEF1F8;width:38px;height:38px;border-radius:12px;font-size:20px}
.sheet .body{padding:14px 16px;overflow-y:auto;flex:1}
.sheet footer{padding:10px 16px 14px;border-top:1px solid var(--line)}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:22px}}
/* chat IA */
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;white-space:normal;word-wrap:break-word}
.msg.eu{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.msg.ia{align-self:flex-start;background:#EEF2FD;border-bottom-left-radius:4px}
.msg img{max-width:100%;border-radius:10px;margin-top:6px}
.typing{color:var(--muted);font-style:italic}
.chatbar{display:flex;gap:8px;align-items:flex-end}
.chatbar textarea{min-height:48px;max-height:140px;flex:1}
.iconbtn{width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn.primary{background:var(--navy);border-color:var(--navy)}
/* listas genéricas */
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:#fff;border:1.5px solid var(--line);border-radius:16px}
.item .grow{flex:1;min-width:0}
.item b{display:block}
.grow>b{display:block}
.grow>span.small{display:block}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--navy);background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px}
.check.on{background:var(--ok);border-color:var(--ok)}
.empty{padding:24px 10px;text-align:center;color:var(--muted)}
.stat{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-size:26px;font-weight:900;line-height:1.1}
.stat span{color:var(--muted);font-size:13px;font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.hero{background:var(--navy);color:#fff;border-radius:22px;padding:18px;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:30px 30px}
.hero h1{color:#fff;margin:0 0 4px}
.hero p{margin:0;color:#C9D3EC}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safeb));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:80;font-weight:700;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 18px calc(24px + var(--safeb));max-width:440px;margin:0 auto}
.login .logo{width:58px;height:58px;border-radius:16px;background:var(--accent);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:30px;margin-bottom:14px}
.err{background:var(--badbg);color:var(--bad);padding:10px 12px;border-radius:12px;font-weight:700;margin-top:10px}
.okmsg{background:var(--okbg);color:var(--ok);padding:10px 12px;border-radius:12px;font-weight:700;margin-top:10px}
.correct-item{border:1.5px solid var(--line);border-radius:16px;padding:14px;background:#fff}
.studans{background:#F6F7FB;border-radius:12px;padding:10px 12px;margin-top:8px;white-space:pre-wrap}
.seg{display:inline-flex;background:#E6EAF4;border-radius:12px;padding:3px}
.seg button{border:none;background:none;padding:8px 14px;border-radius:9px;font-weight:800;color:var(--muted);min-height:38px}
.seg button.on{background:#fff;color:var(--ink)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:40px;text-align:center;color:var(--muted)}
@media print{.top,.nav,.fab,.noprint{display:none!important}main{padding:0}}
/* sequência */
.streakchip{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.1);border:none;border-radius:999px;padding:5px 10px 5px 6px;color:#fff;font-weight:900;font-size:16px;min-height:38px}
.streakchip.on{background:rgba(255,150,0,.22)}
.streakchip.risk{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{background:rgba(255,80,40,.35)}}
.bell{position:relative;background:none;border:none;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.bell span{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:#E53935;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--navy)}
.streakcard{display:block;text-decoration:none;background:linear-gradient(135deg,#FFF3DC,#FFE2B8);border:2px solid #FFC879;border-radius:22px;padding:14px;margin-top:12px}
.streakcard.risk{background:linear-gradient(135deg,#FFE9E2,#FFD3C4);border-color:#FF9E80}
.streakcard .small{display:block;color:#5B3B00}
.flamebig{width:56px;height:56px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.xpbar{position:relative;height:22px;background:#fff;border-radius:11px;overflow:hidden;margin-top:12px;border:1.5px solid #FFD599}
.xpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#FFB020,#FF7A00);border-radius:11px}
.xpbar span{position:relative;display:block;text-align:center;font-size:12.5px;font-weight:900;line-height:19px;color:#4A2C00}
.week{display:flex;justify-content:space-between;margin-top:12px;gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;font-size:12px;font-weight:800;color:#8A6A3A}
.wd i{width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid #F1D3A3;display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff;font-weight:900}
.wd.ok i{background:#FF9600;border-color:#FF9600}
.wd.hoje i{box-shadow:0 0 0 3px rgba(14,27,61,.25)}
.streakhero{text-align:center;background:linear-gradient(180deg,#FFF3DC,#FFFFFF);border:2px solid #FFD599;border-radius:24px;padding:18px}
.streakhero p{margin:6px 0 0;font-weight:700;color:#5B3B00}
.bignum{font-size:64px;font-weight:900;line-height:1;color:#FF8A00;letter-spacing:-.04em}
.flameanim svg{animation:flick 1.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.06) rotate(-2deg)}60%{transform:scale(.97) rotate(2deg)}}
.celebra{background:#fff;border-radius:26px;padding:22px 18px;width:min(92vw,400px);text-align:center;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:300px}
.cal b{font-size:11px;text-align:center;color:var(--muted)}
.cal i{aspect-ratio:1;border-radius:8px;background:#E8ECF6}
.cal i.meio{background:#FFE2B8}.cal i.ok{background:#FF9600}.cal i.hoje{outline:2px solid var(--navy)}
/* instalar e avisos */
.installcard{background:var(--navy);color:#fff;border-radius:20px;padding:14px;margin-bottom:12px}
.installcard .small{display:block;color:#C9D3EC}
.istep{display:flex;gap:12px;align-items:flex-start;margin:12px 0}
.inum{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--navy);font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kbd{display:inline-flex;vertical-align:middle;background:#F1F3F8;border-radius:8px;padding:2px 4px}
.arrowhint{text-align:center;font-size:30px;color:#007AFF;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
.aviso.novo{border-color:var(--accent);background:#FFFBEF}
.aviso .small{display:block}
.dotnew{width:10px;height:10px;border-radius:50%;background:#E53935;flex-shrink:0;margin-top:6px}
/* relatório */
.report{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}

<script>
/* ===== núcleo: aleatório com semente, formatação e frações ===== */
var TOPICS = [];
var MINUS = '−';
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){var h=2166136261;for(var k=0;k<s.length;k++){h^=s.charCodeAt(k);h=Math.imul(h,16777619);}return h>>>0;}
function R(seed){
  var f=mulberry32(seed);
  var o={f:f};
  o.i=function(a,b){return a+Math.floor(f()*(b-a+1));};
  o.p=function(arr){return arr[Math.floor(f()*arr.length)];};
  o.nz=function(a,b){var x;do{x=o.i(a,b);}while(x===0);return x;};
  o.sh=function(arr){var c=arr.slice();for(var k=c.length-1;k>0;k--){var j=Math.floor(f()*(k+1));var t=c[k];c[k]=c[j];c[j]=t;}return c;};
  o.s=function(){return f()<0.5?-1:1;};
  return o;
}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function rnd(x,dp){var m=Math.pow(10,dp===undefined?6:dp);return Math.round(x*m)/m;}
/* número no formato brasileiro (vírgula decimal) */
function n(x,dp){
  if(dp===undefined) dp=4;
  x=rnd(x,dp); if(Object.is(x,-0)) x=0;
  var a=Math.abs(x), parts=String(a).split('.');
  var ip=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  if(parts[0].length<=4) ip=parts[0];
  var s=ip+(parts[1]?','+parts[1]:'');
  return (x<0?MINUS:'')+s;
}
function p(x){return x<0?'('+n(x)+')':n(x);}
function money(x){var s=rnd(x,2).toFixed(2).split('.');var ip=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return 'R$ '+ip+','+s[1];}
/* frações */
function Q(a,b){if(b===undefined)b=1;if(b<0){a=-a;b=-b;}var g=gcd(a,b)||1;return {n:a/g,d:b/g};}
function qa(x,y){return Q(x.n*y.d+y.n*x.d,x.d*y.d);}
function qs(x,y){return Q(x.n*y.d-y.n*x.d,x.d*y.d);}
function qm(x,y){return Q(x.n*y.n,x.d*y.d);}
function qd(x,y){return Q(x.n*y.d,x.d*y.n);}
function F(a,b){if(typeof a!=='number'||typeof b!=='number')return '<span class="fr"><span>'+a+'</span><span>'+b+'</span></span>';var neg=(a<0)!==(b<0);a=Math.abs(a);b=Math.abs(b);return (neg&&a!==0?MINUS:'')+'<span class="fr"><span>'+a+'</span><span>'+b+'</span></span>';}
function FQ(q){return q.d===1?n(q.n):F(q.n,q.d);}
function pFQ(q){return q.n<0?'('+FQ(q)+')':FQ(q);}
/* polinômio: [[coef,'x²'],[coef,'x'],[coef,'']] */
function poly(terms){
  var s='';
  terms.forEach(function(t){
    var c=t[0],v=t[1];if(c===0)return;
    var a=Math.abs(c);var cs=(a===1&&v)?'':n(a);
    if(s===''){s=(c<0?MINUS:'')+cs+v;}else{s+=(c<0?' − ':' + ')+cs+v;}
  });
  return s||'0';
}
function sup(e){return '<sup>'+e+'</sup>';}
function raiz(x){return '√<span class="ov">'+x+'</span>';}
function mix(i,fns){return fns[i%fns.length]();}
function topic(t){t.disciplina=t.disciplina||'Matemática';TOPICS.push(t);}
function lista(t,seed){
  var r=R(hashStr(t.id)+(seed||0)*7919);var out=[],seen={},tries=0;
  while(out.length<20&&tries<600){tries++;var g=t.gen(r,tries-1);if(seen[g.q])continue;seen[g.q]=1;out.push(g);}
  return out;
}

/* ===== NÚMEROS ===== */
function fact(x){var f=[],d=2;while(x>1){var e=0;while(x%d===0){x/=d;e++;}if(e)f.push([d,e]);d++;}return f;}
function factStr(x){return fact(x).map(function(t){return t[0]+(t[1]>1?sup(t[1]):'');}).join(' × ');}
function divisores(x){var d=[];for(var k=1;k<=x;k++)if(x%k===0)d.push(k);return d;}
function isPrime(x){if(x<2)return false;for(var k=2;k*k<=x;k++)if(x%k===0)return false;return true;}
function moneyS(x){return (x<0?MINUS:'')+money(Math.abs(x));}
function ps(x){return x>0?'(+'+x+')':'('+n(x)+')';}
var ORDENS=['unidades','dezenas','centenas','unidades de milhar','dezenas de milhar','centenas de milhar','unidades de milhão'];

topic({id:'sistema-numeracao',nome:'Sistema de numeração decimal',ano:'6º ano',area:'Números',
tags:'valor posicional ordem classe decomposição arredondamento algarismo',
teoria:'<p>Usamos 10 algarismos (0 a 9). O <b>valor de um algarismo depende da posição</b> que ele ocupa: cada posição vale 10 vezes a posição à sua direita.</p><table class="t"><tr><th>Classe dos milhões</th><th colspan="3">Classe dos milhares</th><th colspan="3">Classe das unidades simples</th></tr><tr><td>U. milhão</td><td>C. milhar</td><td>D. milhar</td><td>U. milhar</td><td>Centena</td><td>Dezena</td><td>Unidade</td></tr></table><ul><li><b>Valor absoluto</b>: o próprio algarismo. <b>Valor posicional (relativo)</b>: algarismo × valor da posição.</li><li><b>Decompor</b> é escrever o número como soma dos valores posicionais: 4.705 = 4 × 1000 + 7 × 100 + 5.</li><li><b>Arredondar</b>: olhe o algarismo logo à direita da ordem pedida. Se for 5 ou mais, aumenta 1; se for menor que 5, mantém. O resto vira zero.</li></ul><div class="ex"><b>Exemplo:</b> em 36.482, o 6 está nas unidades de milhar e vale 6.000. Arredondando para a centena: 36.500 (porque o 8 ≥ 5).</div>',
gen:function(r,i){return mix(i,[
function(){var len=r.i(5,7),N=r.i(Math.pow(10,len-1),Math.pow(10,len)-1);var s=String(N);var pos;do{pos=r.i(0,len-1);}while(s[len-1-pos]==='0');var d=+s[len-1-pos];
 var shown=n(N);var cnt=-1,html='';for(var k=shown.length-1;k>=0;k--){var ch=shown[k];if(ch!=='.')cnt++;html=((ch!=='.'&&cnt===pos)?'<b class="hl">'+ch+'</b>':ch)+html;}
 return {q:'No número '+html+', qual é o valor posicional do algarismo destacado?',a:n(d*Math.pow(10,pos)),s:'O '+d+' está na ordem das '+ORDENS[pos]+', então vale '+d+' × '+n(Math.pow(10,pos))+' = '+n(d*Math.pow(10,pos))+'.'};},
function(){var parts=[],N=0;var ex=r.sh([0,1,2,3,4,5]).slice(0,r.i(3,4)).sort(function(a,b){return b-a;});ex.forEach(function(e){var d=r.i(1,9);N+=d*Math.pow(10,e);parts.push(d+' × '+n(Math.pow(10,e)));});
 return {q:'Qual número é representado por '+parts.join(' + ')+'?',a:n(N),s:'Somando os valores posicionais: '+ex.map(function(e,k){return n(+parts[k].split(' × ')[0]*Math.pow(10,e));}).join(' + ')+' = '+n(N)+'.'};},
function(){var N=r.i(1000,99999);var ord=r.p([[10,'dezena'],[100,'centena'],[1000,'unidade de milhar']]);var R_=Math.round(N/ord[0])*ord[0];var dig=Math.floor(N/(ord[0]/10))%10;
 return {q:'Arredonde '+n(N)+' para a '+ord[1]+' mais próxima.',a:n(R_),s:'O algarismo à direita da '+ord[1]+' é '+dig+(dig>=5?' (≥ 5), então aumentamos 1':' (< 5), então mantemos')+'. Resultado: '+n(R_)+'.'};},
function(){var N=r.i(1001,99999);var s=String(N),parts=[];for(var k=0;k<s.length;k++){var d=+s[k],e=s.length-1-k;if(d)parts.push(e===0?String(d):d+' × '+n(Math.pow(10,e)));}
 return {q:'Decomponha o número '+n(N)+' usando potências de 10 (ex.: 3 × 100).',a:parts.join(' + '),s:'Cada algarismo diferente de zero vezes o valor da sua posição.'};}
]);}});

topic({id:'expressoes-numericas',nome:'Expressões numéricas',ano:'6º ano',area:'Números',
tags:'ordem das operações parênteses colchetes chaves prioridade',
teoria:'<p>Para resolver uma expressão numérica siga sempre esta ordem:</p><ol><li>Resolva o que está dentro de <b>( )</b>, depois <b>[ ]</b>, depois <b>{ }</b>.</li><li>Dentro de cada um: primeiro <b>potências e raízes</b>;</li><li>depois <b>multiplicações e divisões</b>, na ordem em que aparecem (da esquerda para a direita);</li><li>por último <b>adições e subtrações</b>, também da esquerda para a direita.</li></ol><div class="ex"><b>Exemplo:</b> 20 − 3 × 4 + 8 ÷ 2 = 20 − 12 + 4 = 12.<br>[10 + (6 − 2) × 3] ÷ 2 = [10 + 4 × 3] ÷ 2 = [10 + 12] ÷ 2 = 22 ÷ 2 = 11.</div><p class="tip">Erro comum: fazer 20 − 3 = 17 antes da multiplicação. Multiplicação vem antes!</p>',
gen:function(r,i){return mix(i,[
function(){var a=r.i(2,30),b=r.i(2,12),c=r.i(2,12);return {q:'Calcule: '+a+' + '+b+' × '+c,a:n(a+b*c),s:'Primeiro a multiplicação: '+b+' × '+c+' = '+(b*c)+'. Depois: '+a+' + '+(b*c)+' = '+(a+b*c)+'.'};},
function(){var a=r.i(3,12),b=r.i(3,12),d=r.i(2,9),q=r.i(2,10),c=d*q;var v=a*b-q;return {q:'Calcule: '+a+' × '+b+' − '+c+' ÷ '+d,a:n(v),s:a+' × '+b+' = '+(a*b)+' e '+c+' ÷ '+d+' = '+q+'. Então '+(a*b)+' − '+q+' = '+n(v)+'.'};},
function(){var a=r.i(2,15),b=r.i(2,15),c=r.i(2,9),d=r.i(1,(a+b)*c-1);var v=(a+b)*c-d;return {q:'Calcule: ('+a+' + '+b+') × '+c+' − '+d,a:n(v),s:'Parênteses: '+a+' + '+b+' = '+(a+b)+'. Depois '+(a+b)+' × '+c+' = '+((a+b)*c)+'. Por fim '+((a+b)*c)+' − '+d+' = '+v+'.'};},
function(){var e=r.i(2,6),q=r.i(3,12),inner=e*q,d=r.i(2,5),kmax=Math.min(6,Math.floor((inner-1)/d));if(kmax<1){kmax=1;inner=d+e*Math.ceil((d+1)/e);q=inner/e;}var k=r.i(1,kmax),a=inner-k*d;if(a<1){a=1;inner=a+k*d;}

topic({id:'conjuntos-numericos',nome:'Conjuntos numéricos: naturais, inteiros, racionais, irracionais e reais',ano:'8º ano',area:'Números',

topic({id:'sistemas',nome:'Sistemas de equações do 1º grau',ano:'8º ano',area:'Álgebra',

topic4('4-sistema-decimal','Sistema de numeração decimal até a dezena de milhar','Números','4º ano números naturais unidade dezena centena milhar dezena de milhar','<p>Nosso sistema usa dez algarismos: 0 a 9. Cada posição vale dez vezes a posição que fica à sua direita.</p><p>Da direita para a esquerda: unidades, dezenas, centenas, unidades de milhar e dezenas de milhar.</p><p><b>Exemplo resolvido: qual é o valor do algarismo 3 em 23.418?</b></p><ol><li>Observe a posição do 3: ele está na casa dos milhares.</li><li>Na casa dos milhares, cada unidade vale 1.000.</li><li>Faça 3 × 1.000 = 3.000.</li></ol><p>Portanto, o algarismo 3 vale <b>3.000</b>.','num');
topic4('4-composicao-decomposicao','Composição e decomposição de números','Números','compor decompor valor posicional milhares centenas dezenas unidades','<p>Compor é juntar partes para formar um número. Decompor é separar o número de acordo com o valor de cada algarismo.</p><p><b>Exemplo resolvido: decomponha 4.582.</b></p><ol><li>O 4 está na casa dos milhares: vale 4.000.</li><li>O 5 está na casa das centenas: vale 500.</li><li>O 8 está na casa das dezenas: vale 80.</li><li>O 2 está na casa das unidades: vale 2.</li><li>Junte as partes: 4.000 + 500 + 80 + 2 = 4.582.</li></ol><p>O zero também ocupa uma posição: 3.047 = 3.000 + 40 + 7.</p>','decomp');
topic4('4-adicao-subtracao-reagrupamento','Adição e subtração com reagrupamento','Números','somar subtrair vai um emprestar reagrupamento','<p>Na adição, juntamos quantidades. Na subtração, retiramos ou comparamos. Quando uma coluna não tem unidades suficientes, fazemos uma troca: 10 unidades valem 1 dezena; 1 dezena vale 10 unidades.</p><p><b>Exemplo resolvido: 268 + 157.</b></p><ol><li>Unidades: 8 + 7 = 15. Escreva 5 e reagrupa 1 dezena.</li><li>Dezenas: 6 + 5 + 1 = 12 dezenas. Escreva 2 e reagrupa 1 centena.</li><li>Centenas: 2 + 1 + 1 = 4.</li><li>Resultado: <b>425</b>.</li></ol><p><b>Agora a subtração: 352 − 178.</b> Nas unidades, troque 1 dezena por 10 unidades: 12 − 8 = 4. Nas dezenas, troque 1 centena por 10 dezenas: 14 − 7 = 7. Nas centenas, 2 − 1 = 1. Resultado: <b>174</b>.</p>','add');
topic4('4-multiplicacao','Multiplicação: tabuada, dobro, triplo e algoritmo','Números','multiplicação tabuada dobro triplo algoritmo grupos iguais','<p>Multiplicar é somar grupos iguais. Dobro significa 2 vezes; triplo significa 3 vezes. Para multiplicar números maiores, podemos separar dezenas e unidades.</p><p><b>Exemplo resolvido: 23 × 4.</b></p><ol><li>Separe 23 em 20 + 3.</li><li>Multiplique as dezenas: 20 × 4 = 80.</li><li>Multiplique as unidades: 3 × 4 = 12.</li><li>Some os resultados: 80 + 12 = <b>92</b>.</li></ol><p>Assim, 23 × 4 = 92. O dobro de 23 é 46 e o triplo é 69.</p>','mult');
topic4('4-divisao','Divisão exata e com resto','Números','divisão repartir partes iguais quociente resto','<p>Dividir é repartir em partes iguais ou descobrir quantos grupos cabem. O resultado é o quociente. Se sobrar alguma coisa, ela é o resto.</p><p><b>Exemplo resolvido: repartir 17 balas entre 5 crianças.</b></p><ol><li>Entregue 1 bala para cada criança: foram 5 balas.</li><li>Continue até cada criança receber 3 balas: foram 5 × 3 = 15 balas.</li><li>Das 17 balas, sobraram 17 − 15 = 2.</li></ol><p>Cada criança recebe <b>3 balas</b> e sobram <b>2</b>. Podemos conferir: 17 = 5 × 3 + 2. Na divisão exata, o resto é zero.</p>','div');
topic4('4-fracoes-unitarias','Frações unitárias','Números','frações metade terço quarto quinto décimo centésimo 1/2 1/3 1/4 1/5 1/10 1/100','<p>Uma fração representa partes iguais de um inteiro. Nas frações unitárias, o número de cima é 1: 1/2, 1/3, 1/4, 1/5, 1/10 e 1/100. O número de baixo mostra em quantas partes iguais o inteiro foi dividido.</p><p><b>Exemplo resolvido: uma barra foi dividida em 4 partes iguais. Qual fração representa uma parte?</b></p><ol><li>Conte o total de partes iguais: são 4. Esse número fica embaixo.</li><li>Escolhemos apenas uma parte. O número 1 fica em cima.</li><li>Escreva a fração: <b>1/4</b>.</li></ol><p>Quando o inteiro é dividido em mais partes iguais, cada pedaço fica menor. Por isso, 1/2 é maior que 1/4.</p>','frac');
topic4('4-decimais-dinheiro','Números decimais no sistema monetário','Números','dinheiro reais centavos décimos centésimos vírgula','<p>Um real tem 100 centavos. A vírgula separa os reais dos centavos. A primeira casa depois da vírgula representa décimos; a segunda representa centésimos.</p><p><b>Exemplo resolvido: quanto é R$ 3,25?</b></p><ol><li>Antes da vírgula está a quantidade de reais: 3 reais.</li><li>Depois da vírgula estão os centavos: 25 centavos.</li><li>Separe os centavos: 2 décimos de real e 5 centésimos de real.</li></ol><p>Portanto, R$ 3,25 são <b>3 reais e 25 centavos</b>. Para somar dinheiro, alinhe as vírgulas.</p>','money');
topic4('4-sequencias-igualdade','Sequências, padrões e noção de igualdade','Álgebra','sequências padrões regularidade igualdade sentença matemática','<p>Uma sequência segue uma regra: pode aumentar, diminuir ou repetir. Uma igualdade mostra que os dois lados têm o mesmo valor. O quadradinho pode representar um número que falta.</p><p><b>Exemplo resolvido: complete 5, 10, 15, 20, __.</b></p><ol><li>Compare o segundo número com o primeiro: 10 − 5 = 5.</li><li>Confira: 15 − 10 = 5 e 20 − 15 = 5.</li><li>A regra é somar 5. Então 20 + 5 = <b>25</b>.</li></ol><p><b>Igualdade:</b> em 8 + □ = 13, pense: 13 − 8 = 5. O número que falta é 5.</p>','pattern');
topic4('4-geometria','Figuras planas e espaciais, ângulo reto, retas e simetria','Geometria','figuras planas espaciais prismas pirâmides ângulo reto paralelas perpendiculares simetria','<p>Figuras planas têm comprimento e largura, como quadrado e triângulo. Sólidos têm volume. Prismas têm duas bases iguais; pirâmides têm uma base e faces laterais que se encontram em uma ponta. Ângulo reto mede 90°. Retas paralelas não se cruzam; perpendiculares se encontram formando 90°. Simetria acontece quando as duas metades combinam ao dobrar.</p><p><b>Exemplo resolvido: quantas faces tem um prisma de base triangular?</b></p><ol><li>O prisma tem 2 bases triangulares.</li><li>O triângulo tem 3 lados, então o prisma tem 3 faces laterais.</li><li>Some: 2 + 3 = <b>5 faces</b>.</li></ol><p>O canto de uma folha é um exemplo de ângulo reto. Os lados vizinhos de um quadrado são perpendiculares.</p>','geo');
topic4('4-medidas-area','Medidas de comprimento, massa, capacidade e área','Grandezas e medidas','metro centímetro quilômetro grama quilograma litro mililitro área malha quadriculada','<p>Comprimento mede distâncias (metro e centímetro). Massa mede a quantidade de matéria (grama e quilograma). Capacidade mede quanto cabe em um recipiente (litro e mililitro). Na malha quadriculada, a área pode ser medida contando quadradinhos.</p><p><b>Exemplo resolvido: um retângulo ocupa 4 colunas e 3 linhas de quadradinhos. Qual é a área?</b></p><ol><li>Conte 4 quadradinhos em cada linha.</li><li>Há 3 linhas iguais.</li><li>Multiplique: 4 × 3 = <b>12 quadradinhos</b>.</li></ol><p>Também lembre: 1 metro = 100 centímetros; 1 quilograma = 1.000 gramas; 1 litro = 1.000 mililitros.</p>','measure');
topic4('4-horas-duracao','Horas, minutos e duração de intervalos','Grandezas e medidas','relógio horas minutos duração intervalo tempo','<p>Uma hora tem 60 minutos. Para descobrir quanto tempo passou, avance do horário inicial até o final, separando em partes fáceis.</p><p><b>Exemplo resolvido: quanto tempo passou das 14h20 às 15h05?</b></p><ol><li>De 14h20 até 15h00 faltam 40 minutos.</li><li>De 15h00 até 15h05 passam mais 5 minutos.</li><li>Some: 40 + 5 = <b>45 minutos</b>.</li></ol><p>Se passar de 60 minutos, troque 60 minutos por 1 hora.</p>','time');
topic4('4-tabelas-graficos-probabilidade','Tabelas, gráficos de barras e eventos prováveis','Estatística e probabilidade','tabelas gráficos barras pesquisa mais menos provável chance','<p>Tabelas organizam informações. Gráficos de barras ajudam a comparar quantidades: a barra mais alta representa o maior valor. Um evento pode ser certo, possível ou impossível. Entre eventos possíveis, alguns têm mais chance do que outros.</p><p><b>Exemplo resolvido: uma caixa tem 7 bolas azuis e 2 vermelhas. Qual cor tem mais chance de sair?</b></p><ol><li>Conte as bolas azuis: 7.</li><li>Conte as vermelhas: 2.</li><li>Compare: 7 é maior que 2. Há mais bolas azuis.</li></ol><p>Então retirar uma bola azul é <b>mais provável</b>. Isso não significa que seja garantido.</p>','stats');
