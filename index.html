TEORIA['valor-numerico']=`
<h3>O que é</h3>
<p><b>Expressão algébrica</b> é uma expressão com <b>letras</b> (variáveis) e números: 2x + 5, a² − 3b, {b × h/2}. A letra representa um número que pode mudar.</p>
<p><b>Valor numérico</b> é o resultado quando trocamos as letras por números.</p>
<ul><li>3x significa 3 · x (a multiplicação fica “escondida”).</li><li>xy significa x · y.</li><li>x² significa x · x.</li></ul>
<h3>O passo a passo</h3><ol><li>Reescreva a expressão trocando cada letra pelo número <b>entre parênteses</b>.</li><li>Resolva respeitando a ordem: potências → multiplicações/divisões → somas/subtrações.</li></ol>
<h3>Caso 1 — Valor positivo</h3>
<div class="ex">2x + 5 para x = 4 → 2·(4) + 5 = 8 + 5 = <b>13</b>.</div>
<h3>Caso 2 — Valor negativo (o parêntese salva!)</h3>
<div class="ex">x² − 3x para x = −2 → (−2)² − 3·(−2) = 4 + 6 = <b>10</b>.<br>Sem parêntese o aluno escreveria −2² − 3·−2 e erraria.</div>
<h3>Caso 3 — Duas variáveis</h3>
<div class="ex">3a − 2b para a = 5 e b = −1 → 3·(5) − 2·(−1) = 15 + 2 = <b>17</b>.</div>
<h3>Caso 4 — Com fração</h3>
<div class="ex">{x + y/2} para x = 7 e y = 3 → {7 + 3/2} = {10/2} = <b>5</b>.<br>4x² para x = {1/2} → 4 · {1/4} = <b>1</b>.</div>
<h3>Caso 5 — Fórmulas do dia a dia</h3>
<div class="ex">Área do triângulo A = {b·h/2}, com b = 10 e h = 6 → A = {60/2} = <b>30</b>.<br>Celsius → Fahrenheit: F = 1,8C + 32; C = 25 → F = 45 + 32 = <b>77 °F</b>.<br>Conta de táxi: P = 5 + 2,5k; k = 8 km → P = 5 + 20 = <b>R$ 25</b>.</div>
<h3>Caso 6 — Escrever a expressão a partir do texto</h3>
<table class="t"><tr><td>o dobro de um número</td><td>2x</td></tr><tr><td>a metade de um número mais 3</td><td>{x/2} + 3</td></tr><tr><td>o quadrado de um número</td><td>x²</td></tr><tr><td>a soma de dois números</td><td>x + y</td></tr><tr><td>o triplo da diferença entre x e 4</td><td>3(x − 4)</td></tr></table>`;

TEORIA['polinomios']=`
<h3>Vocabulário</h3>
<ul><li><b>Monômio</b>: número × letras. Em −5x²y, o <b>coeficiente</b> é −5 e a <b>parte literal</b> é x²y.</li><li><b>Grau do monômio</b>: soma dos expoentes das letras (−5x²y tem grau 3).</li><li><b>Polinômio</b>: soma de monômios (3x² − 2x + 7). O grau é o do maior termo.</li><li><b>Termos semelhantes</b>: mesma parte literal (4x² e −x² são; 4x² e 4x não são).</li></ul>
<h3>Caso 1 — Reduzir termos semelhantes</h3>
<div class="ex">5x + 3y − 2x + y − 4 → x: 5 − 2 = 3 · y: 3 + 1 = 4 → <b>3x + 4y − 4</b>.<br>Dica: sublinhe os termos de cada tipo com cores diferentes.</div>
<h3>Caso 2 — Somar polinômios</h3>
<div class="ex">(2x² + 3x − 1) + (x² − 5x + 4) = (2 + 1)x² + (3 − 5)x + (−1 + 4) = <b>3x² − 2x + 3</b>.</div>
<h3>Caso 3 — Subtrair (troque todos os sinais do segundo!)</h3>
<div class="ex">(4x² − x + 2) − (x² + 3x − 5) = 4x² − x + 2 <b>− x² − 3x + 5</b> = <b>3x² − 4x + 7</b>.</div>
<h3>Caso 4 — Multiplicar monômios</h3>
<div class="ex">(3x²) · (−4x³) = (3 · −4) · x<sup>2+3</sup> = <b>−12x⁵</b>. Multiplica os números e soma os expoentes da mesma letra.</div>
<h3>Caso 5 — Monômio × polinômio (distributiva)</h3>
<div class="ex">2x(3x − 5) = 2x · 3x − 2x · 5 = <b>6x² − 10x</b>.<br>−3(x² − 2x + 1) = <b>−3x² + 6x − 3</b> (o sinal de fora entra em todos).</div>
<h3>Caso 6 — Polinômio × polinômio</h3>
<div class="ex">(x + 3)(2x − 5): cada termo do 1º vezes cada do 2º.<br>x·2x = 2x²; x·(−5) = −5x; 3·2x = 6x; 3·(−5) = −15.<br>Junte: 2x² + x − 15.</div>
<h3>Caso 7 — Dividir por monômio</h3>
<div class="ex">(12x⁴ − 8x²) ÷ 4x² = 12x⁴ ÷ 4x² − 8x² ÷ 4x² = <b>3x² − 2</b>. Divide os números e subtrai os expoentes.</div>
<h3>Erros comuns</h3><ul><li>Somar termos não semelhantes: 3x + 2x² ≠ 5x³.</li><li>Na subtração, trocar o sinal só do primeiro termo do segundo polinômio.</li></ul>`;

TEORIA['produtos-notaveis']=`
<h3>Por que existem</h3><p>São multiplicações que aparecem tanto que vale a pena decorar o resultado (e evitar fazer a distributiva toda vez).</p>
<table class="t"><tr><th>Nome</th><th>Fórmula</th><th>Frase para decorar</th></tr>
<tr><td>Quadrado da soma</td><td>(a + b)² = a² + 2ab + b²</td><td>quadrado do 1º, mais 2 vezes o 1º pelo 2º, mais quadrado do 2º</td></tr>
<tr><td>Quadrado da diferença</td><td>(a − b)² = a² − 2ab + b²</td><td>igual, mas o termo do meio é menos</td></tr>
<tr><td>Produto da soma pela diferença</td><td>(a + b)(a − b) = a² − b²</td><td>quadrado do 1º menos quadrado do 2º</td></tr>
<tr><td>Cubo da soma (9º)</td><td>(a + b)³ = a³ + 3a²b + 3ab² + b³</td><td></td></tr></table>
<h3>Caso 1 — Quadrado da soma</h3>
<div class="ex">(x + 5)² = x² + 2·x·5 + 5² = <b>x² + 10x + 25</b>.<br><i>Por quê?</i> (x + 5)(x + 5) = x² + 5x + 5x + 25.</div>
<h3>Caso 2 — Quadrado da diferença</h3>
<div class="ex">(y − 4)² = y² − 8y + 16. O último termo é <b>sempre positivo</b>.</div>
<h3>Caso 3 — Com coeficiente</h3>
<div class="ex">(3x − 2)² = (3x)² − 2·3x·2 + 2² = <b>9x² − 12x + 4</b>. Cuidado: (3x)² = 9x², não 3x².</div>
<h3>Caso 4 — Duas letras</h3>
<div class="ex">(2a + 3b)² = 4a² + 12ab + 9b².</div>
<h3>Caso 5 — Soma pela diferença</h3>
<div class="ex">(x + 7)(x − 7) = <b>x² − 49</b>. &nbsp;(5m − 1)(5m + 1) = 25m² − 1.</div>
<h3>Caso 6 — Cálculo mental</h3>
<div class="ex">31² = (30 + 1)² = 900 + 60 + 1 = <b>961</b>.<br>49 × 51 = (50 − 1)(50 + 1) = 2500 − 1 = <b>2499</b>.</div>
<h3>Caso 7 — Com frações</h3>
<div class="ex">(x + {1/2})² = x² + x + {1/4} (2 · x · {1/2} = x).</div>
<h3>Erro nº 1</h3><p>(a + b)² ≠ a² + b². Mostre com números: (3 + 4)² = 49, mas 3² + 4² = 25. O que falta é o 2ab = 24.</p>`;

TEORIA['fatoracao']=`
<h3>O que é</h3><p>Fatorar é escrever uma soma como <b>multiplicação</b>. É o caminho de volta dos produtos notáveis e é essencial para simplificar frações algébricas e resolver equações.</p>
<p class="tip">Ordem de tentativa: <b>1º fator comum</b> → depois veja quantos termos sobraram: 2 termos (diferença de quadrados?), 3 termos (trinômio quadrado perfeito? soma e produto?), 4 termos (agrupamento?).</p>
<h3>Caso 1 — Fator comum em evidência</h3>
<div class="ex">6x³ + 9x² <ol><li>Maior número que divide 6 e 9: 3. Menor potência de x presente: x².</li><li>Fator comum: 3x².</li><li>Divida cada termo: 6x³ ÷ 3x² = 2x; 9x² ÷ 3x² = 3.</li><li><b>3x²(2x + 3)</b>. Confira fazendo a distributiva.</li></ol></div>
<h3>Caso 2 — Agrupamento (4 termos)</h3>
<div class="ex">ax + ay + 3x + 3y = a(x + y) + 3(x + y) = <b>(x + y)(a + 3)</b>.</div>
<h3>Caso 3 — Diferença de quadrados</h3>
<div class="ex">x² − 36 = (x + 6)(x − 6). &nbsp;49a² − 4 = (7a + 2)(7a − 2).<br>Atenção: x² + 36 (soma) <b>não</b> fatora assim.</div>
<h3>Caso 4 — Trinômio quadrado perfeito</h3>
<div class="ex">x² + 14x + 49<ol><li>Primeiro e último são quadrados? x² = (x)², 49 = 7². ✓</li><li>O do meio é 2 · x · 7 = 14x? ✓</li><li><b>(x + 7)²</b>.</li></ol>
4x² − 12x + 9 = (2x − 3)² (2 · 2x · 3 = 12x ✓, sinal do meio negativo).</div>
<h3>Caso 5 — Trinômio soma e produto (x² + Sx + P)</h3>
<div class="ex">x² + 5x + 6 → dois números que <b>somam 5</b> e <b>multiplicam 6</b>: 2 e 3 → <b>(x + 2)(x + 3)</b>.<br>x² − x − 12 → somam −1 e multiplicam −12: −4 e 3 → <b>(x − 4)(x + 3)</b>.<br>Dica: se o produto é negativo, os números têm sinais diferentes.</div>
<h3>Caso 6 — Combinando (fator comum e depois outro)</h3>
<div class="ex">2x² − 18 = 2(x² − 9) = <b>2(x + 3)(x − 3)</b>.<br>3x² + 12x + 12 = 3(x² + 4x + 4) = <b>3(x + 2)²</b>.</div>
<h3>Caso 7 — Para que serve: simplificar</h3>
<div class="ex">{x² − 25/x + 5} = {(x + 5)(x − 5)/x + 5} = <b>x − 5</b> (x ≠ −5).</div>`;

TEORIA['equacao-1-grau']=`
<h3>O que é</h3>
<p>Uma equação é como uma <b>balança equilibrada</b>: o que está à esquerda do = pesa o mesmo que o da direita. Resolver é descobrir o valor da incógnita (x) que mantém o equilíbrio.</p>
<p>Regra de ouro: <b>o que fizer de um lado, faça do outro</b>. Na prática isso vira o “passa para o outro lado com a operação contrária”:</p>
<table class="t"><tr><td>está somando</td><td>→ passa subtraindo</td></tr><tr><td>está subtraindo</td><td>→ passa somando</td></tr><tr><td>está multiplicando o x</td><td>→ passa dividindo</td></tr><tr><td>está dividindo o x</td><td>→ passa multiplicando</td></tr></table>
<h3>Caso 1 — Básica</h3>
<div class="ex">3x + 7 = 22 → 3x = 22 − 7 → 3x = 15 → x = 15 ÷ 3 → <b>x = 5</b>.<br>Confira: 3·5 + 7 = 22 ✓</div>
<h3>Caso 2 — x dos dois lados</h3>
<div class="ex">5x − 4 = 2x + 11 → 5x − 2x = 11 + 4 → 3x = 15 → <b>x = 5</b>.<br>Letras para um lado, números para o outro.</div>
<h3>Caso 3 — Coeficiente negativo</h3>
<div class="ex">−2x + 5 = 11 → −2x = 6 → x = 6 ÷ (−2) → <b>x = −3</b>.<br>(Ou multiplique tudo por −1: 2x = −6.)</div>
<h3>Caso 4 — Com parênteses</h3>
<div class="ex">3(x − 2) = 2(x + 1) → 3x − 6 = 2x + 2 → 3x − 2x = 2 + 6 → <b>x = 8</b>.</div>
<h3>Caso 5 — Com frações (tire o MMC)</h3>
<div class="ex">{x/2} + {x/3} = 10<ol><li>MMC(2, 3) = 6. Multiplique <b>todos</b> os termos por 6: 3x + 2x = 60.</li><li>5x = 60 → <b>x = 12</b>.</li></ol>
{x − 1/4} = {x + 2/6}: MMC 12 → 3(x − 1) = 2(x + 2) → 3x − 3 = 2x + 4 → <b>x = 7</b>.</div>
<h3>Caso 6 — Com decimais</h3>
<div class="ex">0,5x + 1,2 = 3,7 → 0,5x = 2,5 → x = 2,5 ÷ 0,5 = <b>5</b>.</div>
<h3>Caso 7 — Sem solução e infinitas soluções</h3>
<div class="ex">2x + 3 = 2x + 5 → 0x = 2 → <b>impossível</b> (nenhum x serve).<br>2(x + 1) = 2x + 2 → 0x = 0 → <b>infinitas soluções</b> (qualquer x serve).</div>
<h3>Erros comuns</h3><ul><li>Passar o número que multiplica o x subtraindo (3x = 15 → x = 12 ✗).</li><li>Esquecer de trocar o sinal ao mudar de lado.</li><li>Na fração, multiplicar só alguns termos pelo MMC.</li></ul>`;

TEORIA['problemas-equacao-1-grau']=`
<h3>Método em 5 passos</h3>
<ol><li><b>Ler</b> duas vezes e grifar o que se pede.</li><li><b>Escolher o x</b> (geralmente o valor menor ou o que aparece como referência).</li><li><b>Traduzir</b> as outras quantidades usando x.</li><li><b>Montar e resolver</b> a equação.</li><li><b>Responder</b> o que foi perguntado, com unidade, e conferir no texto.</li></ol>
<h3>Dicionário português → matemática</h3>
<table class="t"><tr><td>um número</td><td>x</td></tr><tr><td>o dobro, o triplo</td><td>2x, 3x</td></tr><tr><td>a metade, a terça parte</td><td>{x/2}, {x/3}</td></tr><tr><td>o sucessor, o antecessor</td><td>x + 1, x − 1</td></tr><tr><td>números consecutivos</td><td>x, x + 1, x + 2</td></tr><tr><td>pares (ou ímpares) consecutivos</td><td>x, x + 2, x + 4</td></tr><tr><td>“a mais que”</td><td>+</td></tr><tr><td>“a menos que”</td><td>−</td></tr><tr><td>“é”, “dá”, “resulta”</td><td>=</td></tr></table>
<h3>Caso 1 — Número desconhecido</h3>
<div class="ex">O triplo de um número, menos 8, é 25. → 3x − 8 = 25 → 3x = 33 → <b>x = 11</b>.</div>
<h3>Caso 2 — Consecutivos</h3>
<div class="ex">A soma de dois números consecutivos é 47. → x + (x + 1) = 47 → 2x = 46 → x = 23 → <b>23 e 24</b>.</div>
<h3>Caso 3 — Idades</h3>
<div class="ex">Maria tem o triplo da idade do filho. Juntos têm 48 anos.<br>Filho: x; Maria: 3x → x + 3x = 48 → 4x = 48 → x = 12 → <b>filho 12, Maria 36</b>.<br><i>Daqui a alguns anos:</i> “Daqui a 5 anos” → some 5 em <b>todas</b> as idades.</div>
<h3>Caso 4 — Dinheiro / compras</h3>
<div class="ex">Comprei 3 cadernos e uma caneta de R$ 4 e paguei R$ 34. Preço do caderno? → 3x + 4 = 34 → <b>x = R$ 10</b>.</div>
<h3>Caso 5 — Geometria</h3>
<div class="ex">Retângulo com comprimento 5 cm maior que a largura e perímetro 50 cm.<br>Largura x, comprimento x + 5 → 2x + 2(x + 5) = 50 → 4x + 10 = 50 → x = 10 → <b>10 cm por 15 cm</b>.</div>
<h3>Caso 6 — Partes de um todo (frações)</h3>
<div class="ex">Gastei {1/3} do salário com aluguel e {1/4} com comida; sobraram R$ 1.000. Qual o salário?<br>x − {x/3} − {x/4} = 1000 → MMC 12: 12x − 4x − 3x = 12000 → 5x = 12000 → <b>x = R$ 2.400</b>.</div>
<h3>Caso 7 — Comparar planos (quando vale a pena)</h3>
<div class="ex">Plano A: R$ 50 fixos + R$ 2 por hora. Plano B: R$ 5 por hora. Com quantas horas os dois custam o mesmo?<br>50 + 2x = 5x → 50 = 3x → x ≈ 16,7 h. Menos que isso, B é mais barato; mais que isso, A.</div>`;

TEORIA['inequacao-1-grau']=`
<h3>O que é</h3>
<p>É como uma equação, mas com sinal de desigualdade: <b>&gt;</b> (maior), <b>&lt;</b> (menor), <b>≥</b> (maior ou igual), <b>≤</b> (menor ou igual). A resposta não é um número só, é um <b>intervalo</b> de valores.</p>
<p>Resolve-se igual à equação, com <b>uma regra extra</b>:</p>
<p class="tip">Se <b>multiplicar ou dividir</b> os dois lados por um número <b>negativo</b>, <b>inverta o sinal</b> da desigualdade. (Ex.: 2 &lt; 5, mas multiplicando por −1: −2 &gt; −5.)</p>
<h3>Caso 1 — Coeficiente positivo</h3>
<div class="ex">3x − 5 &gt; 7 → 3x &gt; 12 → <b>x &gt; 4</b>. (Serve 4,1; 5; 100… não serve 4.)</div>
<h3>Caso 2 — Coeficiente negativo (inverte!)</h3>
<div class="ex">−2x + 1 ≤ 9 → −2x ≤ 8 → divide por −2 e inverte → <b>x ≥ −4</b>.</div>
<h3>Caso 3 — x dos dois lados</h3>
<div class="ex">5x + 2 &lt; 3x + 10 → 2x &lt; 8 → <b>x &lt; 4</b>.</div>
<h3>Caso 4 — Maior/menor inteiro que satisfaz</h3>
<div class="ex">x &gt; 4 → menor inteiro: <b>5</b> (4 não serve!). &nbsp;x ≥ 4 → menor inteiro: <b>4</b>.<br>x &lt; −2,5 → maior inteiro: <b>−3</b>.</div>
<h3>Caso 5 — Dupla desigualdade</h3>
<div class="ex">−3 &lt; 2x + 1 &lt; 7 → subtrai 1 em tudo: −4 &lt; 2x &lt; 6 → divide por 2: <b>−2 &lt; x &lt; 3</b>.</div>
<h3>Caso 6 — Problema</h3>
<div class="ex">Para passar, a média de 3 provas tem que ser pelo menos 6. Tirei 5 e 7. Quanto preciso na 3ª?<br>{5 + 7 + x/3} ≥ 6 → 12 + x ≥ 18 → <b>x ≥ 6</b>.</div>
<h3>Como escrever a resposta</h3><p>Em palavras: “x maior que 4”; na reta: bolinha <b>aberta</b> (○) para &lt; e &gt;, <b>fechada</b> (●) para ≤ e ≥.</p>`;

TEORIA['sistemas']=`
<h3>O que é</h3>
<p>Duas equações com <b>duas incógnitas</b> (x e y) que precisam valer <b>ao mesmo tempo</b>. A solução é um par (x, y).</p>
<h3>Método 1 — Adição (quando um termo já cancela)</h3>
<div class="ex">x + y = 10<br>x − y = 4<ol><li>Some as equações em pé: (x + x) + (y − y) = 10 + 4 → 2x = 14 → x = 7.</li><li>Volte numa delas: 7 + y = 10 → y = 3.</li><li>Solução: <b>(7, 3)</b>. Confira na outra: 7 − 3 = 4 ✓</li></ol></div>
<h3>Método 1b — Adição multiplicando antes</h3>
<div class="ex">2x + 3y = 12<br>3x − y = 7<ol><li>Multiplique a 2ª por 3 para o y cancelar: 9x − 3y = 21.</li><li>Some com a 1ª: 11x = 33 → x = 3.</li><li>3·3 − y = 7 → y = 2. Solução <b>(3, 2)</b>.</li></ol></div>
<h3>Método 2 — Substituição (quando uma letra está fácil de isolar)</h3>
<div class="ex">y = 2x<br>x + y = 15<ol><li>Troque y por 2x na 2ª: x + 2x = 15 → 3x = 15 → x = 5.</li><li>y = 2 · 5 = 10. Solução <b>(5, 10)</b>.</li></ol></div>
<h3>Método 3 — Comparação</h3>
<div class="ex">y = x + 4 e y = 3x − 2 → iguale: x + 4 = 3x − 2 → 6 = 2x → x = 3; y = 7.</div>
<h3>Caso — Problemas</h3>
<div class="ex"><b>Lanchonete:</b> 2 lanches + 1 suco = R$ 19; 1 lanche + 2 sucos = R$ 14.<br>2L + S = 19 e L + 2S = 14 → da 1ª: S = 19 − 2L → L + 2(19 − 2L) = 14 → L + 38 − 4L = 14 → −3L = −24 → <b>L = 8, S = 3</b>.<br><br><b>Galinhas e coelhos:</b> 20 cabeças e 56 pés. G + C = 20; 2G + 4C = 56 → multiplicando a 1ª por 2 e subtraindo: 2C = 16 → <b>C = 8, G = 12</b>.</div>
<h3>Sistemas especiais</h3>
<div class="ex">x + y = 5 e x + y = 7 → impossível (nenhum par). &nbsp;x + y = 5 e 2x + 2y = 10 → infinitas soluções (é a mesma equação).</div>`;

TEORIA['equacao-2-grau-incompleta']=`
<h3>O que é</h3>
<p>Equação do 2º grau: <b>ax² + bx + c = 0</b> (a ≠ 0). É <b>incompleta</b> quando falta o b ou o c. Essas dá para resolver <b>sem Bhaskara</b>.</p>
<h3>Tipo 1 — Falta o b (ax² + c = 0)</h3>
<div class="ex"><b>Caso A:</b> x² − 49 = 0 → x² = 49 → x = ±√49 → <b>x = 7 ou x = −7</b>.<br>Por que dois? Porque 7² = 49 e (−7)² = 49.<br><b>Caso B:</b> 2x² − 18 = 0 → 2x² = 18 → x² = 9 → <b>x = ±3</b>.<br><b>Caso C:</b> x² = 5 → <b>x = ±√5</b> (raiz não exata fica indicada).<br><b>Caso D:</b> x² + 4 = 0 → x² = −4 → <b>sem solução real</b> (nenhum número ao quadrado dá negativo).</div>
<h3>Tipo 2 — Falta o c (ax² + bx = 0)</h3>
<div class="ex"><b>Caso E:</b> x² − 7x = 0<ol><li>Coloque x em evidência: x(x − 7) = 0.</li><li>Se um produto dá zero, um dos fatores é zero: x = 0 <b>ou</b> x − 7 = 0.</li><li><b>x = 0 ou x = 7</b>.</li></ol>
<b>Caso F:</b> 3x² + 12x = 0 → 3x(x + 4) = 0 → <b>x = 0 ou x = −4</b>.<br><b>Atenção:</b> nunca divida os dois lados por x — você perde a raiz x = 0!</div>
<h3>Tipo 3 — Só ax² = 0</h3><div class="ex">5x² = 0 → x² = 0 → <b>x = 0</b>.</div>
<h3>Problema</h3>
<div class="ex">A área de um quadrado é 81 m². Lado? x² = 81 → x = ±9. Como lado não é negativo, <b>9 m</b>.</div>`;

TEORIA['equacao-2-grau']=`
<h3>Fórmula de Bhaskara</h3>
<p>Para resolver <b>ax² + bx + c = 0</b>:</p>
<ol><li>Arrume a equação: tudo de um lado, zero do outro.</li><li>Identifique <b>a</b> (número do x²), <b>b</b> (do x) e <b>c</b> (o número sozinho), <b>com os sinais</b>.</li><li>Calcule <b>Δ = b² − 4ac</b>.</li><li>Use <b>x = {−b ± √Δ/2a}</b>.</li></ol>
<table class="t"><tr><td>Δ &gt; 0</td><td>duas raízes reais diferentes</td></tr><tr><td>Δ = 0</td><td>uma raiz (duas iguais)</td></tr><tr><td>Δ &lt; 0</td><td>nenhuma raiz real</td></tr></table>
<h3>Caso 1 — Δ &gt; 0, a = 1</h3>
<div class="ex">x² − 5x + 6 = 0 → a = 1, b = −5, c = 6.<br>Δ = (−5)² − 4·1·6 = 25 − 24 = 1.<br>x = {5 ± 1/2} → x₁ = {6/2} = <b>3</b>; x₂ = {4/2} = <b>2</b>.</div>
<h3>Caso 2 — a ≠ 1 e raiz fracionária</h3>
<div class="ex">2x² − 3x − 2 = 0 → a = 2, b = −3, c = −2.<br>Δ = 9 − 4·2·(−2) = 9 + 16 = 25.<br>x = {3 ± 5/4} → x₁ = {8/4} = <b>2</b>; x₂ = {−2/4} = <b>−{1/2}</b>.</div>
<h3>Caso 3 — Δ = 0</h3>
<div class="ex">x² − 6x + 9 = 0 → Δ = 36 − 36 = 0 → x = {6/2} = <b>3</b> (raiz dupla).</div>
<h3>Caso 4 — Δ &lt; 0</h3>
<div class="ex">x² + 2x + 5 = 0 → Δ = 4 − 20 = −16 → <b>não há raiz real</b>.</div>
<h3>Caso 5 — a negativo</h3>
<div class="ex">−x² + 4x + 5 = 0 → dica: multiplique tudo por −1: x² − 4x − 5 = 0 → Δ = 16 + 20 = 36 → x = {4 ± 6/2} → <b>5 ou −1</b>.</div>
<h3>Caso 6 — Precisa arrumar antes</h3>
<div class="ex">x(x + 3) = 40 → x² + 3x − 40 = 0 → Δ = 9 + 160 = 169 → x = {−3 ± 13/2} → <b>5 ou −8</b>.<br>Num problema de medida (lado de retângulo), só o 5 serve.</div>
<h3>Atalho — Soma e produto (quando a = 1)</h3>
<div class="ex">x² − Sx + P = 0: as raízes somam <b>S</b> e multiplicam <b>P</b>.<br>x² − 7x + 10 = 0 → somam 7, multiplicam 10 → <b>2 e 5</b>.</div>
<h3>Erros comuns</h3><ul><li>Esquecer o sinal de b: com b = −5, −b = 5 e b² = 25.</li><li>Fazer −5² = −25 no delta (o certo é (−5)² = 25).</li><li>Dividir só o √Δ por 2a, e não o numerador inteiro.</li></ul>`;

TEORIA['funcao-afim']=`
<h3>O que é</h3>
<p>Uma <b>função</b> é uma regra que, para cada x, dá um único y. A <b>função afim</b> tem a forma <b>f(x) = ax + b</b> e seu gráfico é sempre uma <b>reta</b>.</p>
<ul><li><b>a</b> = taxa de variação (quanto y muda quando x aumenta 1). a &gt; 0 → <b>crescente</b>; a &lt; 0 → <b>decrescente</b>.</li><li><b>b</b> = valor inicial, onde a reta corta o eixo y (quando x = 0).</li></ul>
<h3>Caso 1 — Calcular f(x)</h3>
<div class="ex">f(x) = 3x − 2 → f(4) = 3·4 − 2 = <b>10</b>; f(−1) = −3 − 2 = <b>−5</b>.</div>
<h3>Caso 2 — Achar x sabendo f(x)</h3>
<div class="ex">f(x) = 3x − 2. Para qual x temos f(x) = 13? → 3x − 2 = 13 → <b>x = 5</b>.</div>
<h3>Caso 3 — Zero (raiz) da função</h3>
<div class="ex">Onde a reta corta o eixo x (y = 0): 2x − 8 = 0 → <b>x = 4</b>.</div>
<h3>Caso 4 — Lei a partir de dois pontos</h3>
<div class="ex">Pontos (1, 5) e (3, 9).<ol><li>a = {variação de y/variação de x} = {9 − 5/3 − 1} = {4/2} = 2.</li><li>Use um ponto: 5 = 2·1 + b → b = 3.</li><li><b>f(x) = 2x + 3</b>.</li></ol></div>
<h3>Caso 5 — Desenhar o gráfico</h3>
<div class="ex">f(x) = −x + 4: escolha dois valores de x → x = 0 dá y = 4; x = 4 dá y = 0. Marque (0, 4) e (4, 0) e ligue com uma reta. Desce da esquerda para a direita (a = −1, decrescente).</div>
<h3>Caso 6 — Problemas do dia a dia</h3>
<div class="ex"><b>Plano de celular:</b> R$ 30 fixos + R$ 0,50 por minuto → f(x) = 0,5x + 30. 100 minutos: f(100) = <b>R$ 80</b>.<br><b>Salário com comissão:</b> R$ 1.500 + 5% das vendas → S(v) = 0,05v + 1500.<br><b>Função linear (b = 0):</b> pão a R$ 0,80 → P(n) = 0,8n (passa pela origem).</div>`;

TEORIA['funcao-quadratica']=`
<h3>O que é</h3>
<p><b>f(x) = ax² + bx + c</b> (a ≠ 0). O gráfico é uma <b>parábola</b> (curva em forma de U).</p>
<table class="t"><tr><td><b>a &gt; 0</b></td><td>boca para cima (“sorriso”) → tem ponto de <b>mínimo</b></td></tr><tr><td><b>a &lt; 0</b></td><td>boca para baixo → tem ponto de <b>máximo</b></td></tr><tr><td><b>c</b></td><td>onde corta o eixo y: ponto (0, c)</td></tr><tr><td><b>raízes</b></td><td>onde corta o eixo x (resolver ax² + bx + c = 0)</td></tr><tr><td><b>vértice</b></td><td>x<sub>v</sub> = {−b/2a}, y<sub>v</sub> = f(x<sub>v</sub>) ou {−Δ/4a}</td></tr></table>
<h3>Caso 1 — Estudo completo (a &gt; 0)</h3>
<div class="ex">f(x) = x² − 4x + 3<ul><li>a = 1 &gt; 0 → boca para cima, ponto de mínimo.</li><li>Corta o eixo y em (0, 3).</li><li>Raízes: x² − 4x + 3 = 0 → Δ = 16 − 12 = 4 → x = {4 ± 2/2} → <b>1 e 3</b>.</li><li>Vértice: x<sub>v</sub> = {4/2} = 2; y<sub>v</sub> = 4 − 8 + 3 = −1 → <b>V(2, −1)</b>, valor mínimo −1.</li></ul></div>
<h3>Caso 2 — Estudo completo (a &lt; 0)</h3>
<div class="ex">f(x) = −x² + 6x − 5<ul><li>a = −1 &lt; 0 → boca para baixo, ponto de máximo.</li><li>Raízes: x² − 6x + 5 = 0 → <b>1 e 5</b>.</li><li>x<sub>v</sub> = {−6/−2} = 3; y<sub>v</sub> = −9 + 18 − 5 = <b>4</b> → V(3, 4), valor máximo 4.</li></ul></div>
<h3>Caso 3 — Sem raízes reais</h3>
<div class="ex">f(x) = x² + 2x + 3 → Δ = 4 − 12 = −8 &lt; 0 → a parábola <b>não toca</b> o eixo x (fica toda acima dele, pois a &gt; 0).</div>
<h3>Caso 4 — Máximo e mínimo em problemas</h3>
<div class="ex"><b>Lançamento:</b> uma bola segue h(t) = −5t² + 20t (metros, segundos).<br>Altura máxima: t<sub>v</sub> = {−20/−10} = 2 s → h(2) = −20 + 40 = <b>20 m</b>.<br>Volta ao chão: −5t² + 20t = 0 → t(−5t + 20) = 0 → <b>t = 4 s</b>.<br><br><b>Área máxima:</b> com 20 m de cerca, retângulo de lados x e 10 − x: A = x(10 − x) = −x² + 10x → x<sub>v</sub> = 5 → quadrado 5 × 5, área máxima <b>25 m²</b>.</div>
<h3>Simetria</h3><p>A parábola é simétrica em relação à reta vertical que passa pelo vértice: o x<sub>v</sub> fica exatamente no meio das raízes ({1 + 3/2} = 2 no caso 1).</p>`;

TEORIA['sequencias']=`
<h3>O que é</h3><p>Sequência é uma lista ordenada de números (ou figuras) que segue uma <b>regra</b>. Cada elemento é um <b>termo</b>: a₁ (1º), a₂ (2º), …, aₙ (n-ésimo).</p>
<h3>Caso 1 — Descobrir a regra (diferenças)</h3>
<div class="ex">2, 5, 8, 11, … → de um para o outro soma 3 → próximo: <b>14</b>.<br>1, 4, 9, 16, … → são os quadrados (1², 2², 3², 4²) → próximo: <b>25</b>.<br>1, 1, 2, 3, 5, 8, … → cada termo é a soma dos dois anteriores (Fibonacci) → <b>13</b>.</div>
<h3>Caso 2 — Progressão Aritmética (PA)</h3>
<p>Soma sempre a mesma <b>razão r</b>. <b>Termo geral: aₙ = a₁ + (n − 1)·r</b>.</p>
<div class="ex">PA 7, 11, 15, … Qual o 30º termo?<ol><li>a₁ = 7; r = 11 − 7 = 4.</li><li>a₃₀ = 7 + 29 · 4 = 7 + 116 = <b>123</b>.</li></ol>
<i>Por que (n − 1)?</i> Do 1º ao 30º termo há 29 “saltos”.</div>
<h3>Caso 3 — PA decrescente</h3>
<div class="ex">50, 46, 42, … → r = −4. a₁₀ = 50 + 9·(−4) = <b>14</b>.</div>
<h3>Caso 4 — Descobrir a posição de um termo</h3>
<div class="ex">Na PA 3, 7, 11, …, que posição ocupa o 99? → 99 = 3 + (n − 1)·4 → 96 = 4(n − 1) → n − 1 = 24 → <b>n = 25</b>.</div>
<h3>Caso 5 — Progressão Geométrica (PG)</h3>
<p>Multiplica sempre pela mesma <b>razão q</b>. Termo geral: aₙ = a₁ · q<sup>n−1</sup>.</p>
<div class="ex">3, 6, 12, 24, … → q = 2 → a₆ = 3 · 2⁵ = <b>96</b>.<br>81, 27, 9, … → q = {1/3} → próximo: <b>3</b>.</div>
<h3>Caso 6 — Padrões de figuras</h3>
<div class="ex">Quadradinhos feitos de palitos lado a lado: 1 quadrado usa 4 palitos, 2 usam 7, 3 usam 10.<ol><li>A cada quadrado novo, +3 palitos (PA de razão 3).</li><li>Regra: P = 3n + 1 (confira: n = 1 → 4 ✓).</li><li>Para 20 quadrados: 3·20 + 1 = <b>61 palitos</b>.</li></ol></div>`;

TEORIA['angulos']=`
<h3>O que é</h3><p>Ângulo é a “abertura” entre duas semirretas que saem do mesmo ponto (o <b>vértice</b>). Medimos em <b>graus (°)</b>; uma volta completa tem 360°.</p>
<table class="t"><tr><td><b>Agudo</b></td><td>menor que 90°</td></tr><tr><td><b>Reto</b></td><td>exatamente 90° (o “cantinho” do quadrado)</td></tr><tr><td><b>Obtuso</b></td><td>entre 90° e 180°</td></tr><tr><td><b>Raso</b></td><td>180° (uma linha reta)</td></tr></table>
<h3>Caso 1 — Complemento (soma 90°)</h3>
<div class="ex">Complemento de 35° = 90° − 35° = <b>55°</b>.</div>
<h3>Caso 2 — Suplemento (soma 180°)</h3>
<div class="ex">Suplemento de 35° = 180° − 35° = <b>145°</b>.</div>
<h3>Caso 3 — Opostos pelo vértice (são iguais)</h3>
<div class="ex">Duas retas se cruzam formando ângulos de (3x + 10)° e (5x − 30)°, opostos pelo vértice.<br>3x + 10 = 5x − 30 → 40 = 2x → x = 20 → cada ângulo: 3·20 + 10 = <b>70°</b>.<br>Os outros dois ângulos do cruzamento são suplementares: 180 − 70 = <b>110°</b>.</div>
<h3>Caso 4 — Adjacentes complementares/suplementares com equação</h3>
<div class="ex">Dois ângulos suplementares medem 2x e 3x + 30. → 2x + 3x + 30 = 180 → 5x = 150 → x = 30 → <b>60° e 120°</b>.</div>
<h3>Caso 5 — “O complemento de um ângulo é o dobro dele”</h3>
<div class="ex">Ângulo x; complemento 90 − x. → 90 − x = 2x → 90 = 3x → <b>x = 30°</b>.<br>“O suplemento é o triplo do complemento”: 180 − x = 3(90 − x) → 180 − x = 270 − 3x → 2x = 90 → <b>x = 45°</b>.</div>
<h3>Caso 6 — Ângulos em volta de um ponto</h3>
<div class="ex">Somam 360°. Três ângulos: 100°, 150° e x → x = 360 − 250 = <b>110°</b>.</div>
<h3>Caso 7 — Ângulo entre os ponteiros do relógio</h3>
<div class="ex">Cada “hora” no relógio vale 360 ÷ 12 = 30°. Às 3h em ponto: 3 × 30 = <b>90°</b>. Às 4h: 120°.</div>`;

TEORIA['retas-paralelas-transversal']=`
<h3>O cenário</h3>
<p>Duas retas paralelas (r e s) cortadas por uma transversal formam 8 ângulos. Truque principal: <b>só existem duas medidas</b> — um ângulo agudo e um obtuso, que somam 180°.</p>
${SVG_PAR}
<table class="t"><tr><th>Par</th><th>Exemplo na figura</th><th>Relação</th></tr>
<tr><td>Correspondentes (mesma posição)</td><td>1 e 5, 2 e 6, 4 e 8, 3 e 7</td><td><b>iguais</b></td></tr>
<tr><td>Alternos internos (dentro, lados opostos)</td><td>3 e 5, 4 e 6</td><td><b>iguais</b></td></tr>
<tr><td>Alternos externos (fora, lados opostos)</td><td>1 e 7, 2 e 8</td><td><b>iguais</b></td></tr>
<tr><td>Colaterais internos (dentro, mesmo lado)</td><td>3 e 6, 4 e 5</td><td><b>somam 180°</b></td></tr>
<tr><td>Colaterais externos (fora, mesmo lado)</td><td>2 e 7, 1 e 8</td><td><b>somam 180°</b></td></tr></table>
<p class="tip">Regra rápida: ângulos com a “mesma cara” (os dois agudos ou os dois obtusos) são iguais; um agudo com um obtuso somam 180°.</p>
<h3>Caso 1 — Iguais (alternos, correspondentes)</h3>
<div class="ex">Alternos internos: 3x + 20 e 5x − 20 → 3x + 20 = 5x − 20 → 40 = 2x → x = 20 → <b>80°</b>.</div>
<h3>Caso 2 — Somam 180° (colaterais)</h3>
<div class="ex">Colaterais internos: 3x + 10 e 2x + 20 → 5x + 30 = 180 → x = 30 → <b>100° e 80°</b>.</div>
<h3>Caso 3 — Achar os 8 ângulos a partir de um</h3>
<div class="ex">Se o ângulo 1 mede 65°: os agudos (1, 3, 5, 7) medem 65° e os obtusos (2, 4, 6, 8) medem 180 − 65 = <b>115°</b>.</div>
<h3>Caso 4 — O “bico” entre paralelas (regra do zigue-zague)</h3>
<div class="ex">Quando há um ponto entre as paralelas formando um “bico”, o ângulo do bico é a <b>soma</b> dos ângulos que as paralelas fazem com os segmentos. Ex.: 30° e 45° → bico de <b>75°</b>.</div>`;

TEORIA['triangulos']=`
<h3>Fatos principais</h3>
<ul><li>A soma dos ângulos internos de <b>qualquer</b> triângulo é <b>180°</b>.</li><li>O <b>ângulo externo</b> é igual à <b>soma dos dois internos não vizinhos</b> a ele.</li><li>Maior lado fica em frente ao maior ângulo.</li></ul>
<h3>Classificação</h3>
<table class="t"><tr><th>Pelos lados</th><th>Pelos ângulos</th></tr><tr><td><b>Equilátero</b>: 3 lados iguais (ângulos de 60°)</td><td><b>Acutângulo</b>: 3 ângulos agudos</td></tr><tr><td><b>Isósceles</b>: 2 lados iguais (2 ângulos da base iguais)</td><td><b>Retângulo</b>: um ângulo de 90°</td></tr><tr><td><b>Escaleno</b>: 3 lados diferentes</td><td><b>Obtusângulo</b>: um ângulo obtuso</td></tr></table>
<h3>Caso 1 — Terceiro ângulo</h3><div class="ex">Ângulos 50° e 70° → 180 − 120 = <b>60°</b>.</div>
<h3>Caso 2 — Ângulos em função de x</h3>
<div class="ex">x, 2x e 3x → 6x = 180 → x = 30 → <b>30°, 60°, 90°</b> (triângulo retângulo).<br>(x + 10), (2x − 20), (x + 30) → 4x + 20 = 180 → x = 40 → <b>50°, 60°, 70°</b>.</div>
<h3>Caso 3 — Isósceles</h3>
<div class="ex">Ângulo do vértice 40° → os da base: (180 − 40) ÷ 2 = <b>70°</b> cada.<br>Ângulo da base 65° → vértice: 180 − 2·65 = <b>50°</b>.</div>
<h3>Caso 4 — Ângulo externo</h3>
<div class="ex">Internos 45° e 60° → externo do terceiro vértice: 45 + 60 = <b>105°</b> (e o interno ali é 75°; 75 + 105 = 180 ✓).</div>
<h3>Caso 5 — Condição de existência</h3>
<div class="ex">Cada lado tem que ser <b>menor que a soma dos outros dois</b>. Basta testar o maior.<br>3, 4, 8 → 8 &lt; 3 + 4 = 7? Não → <b>não existe</b>.<br>5, 7, 10 → 10 &lt; 12 → <b>existe</b>.<br>Intervalo do 3º lado com lados 4 e 9: 9 − 4 &lt; x &lt; 9 + 4 → <b>5 &lt; x &lt; 13</b>.</div>
<h3>Caso 6 — Classificar pelos ângulos</h3>
<div class="ex">Ângulos 30°, 50°, 100° → tem um obtuso → <b>obtusângulo</b>.</div>`;

TEORIA['poligonos']=`
<h3>O que é</h3><p>Polígono é uma figura plana fechada formada por segmentos (lados). <b>Regular</b>: todos os lados e todos os ângulos iguais.</p>
<table class="t"><tr><td>3 triângulo</td><td>4 quadrilátero</td><td>5 pentágono</td><td>6 hexágono</td></tr><tr><td>7 heptágono</td><td>8 octógono</td><td>9 eneágono</td><td>10 decágono</td></tr><tr><td>11 undecágono</td><td>12 dodecágono</td><td>15 pentadecágono</td><td>20 icoságono</td></tr></table>
<h3>Fórmulas</h3>
<table class="t"><tr><td>Soma dos ângulos internos</td><td><b>S = (n − 2) × 180°</b></td></tr><tr><td>Cada ângulo interno (regular)</td><td><b>{S/n}</b></td></tr><tr><td>Soma dos externos</td><td><b>360°</b> (sempre)</td></tr><tr><td>Cada ângulo externo (regular)</td><td><b>{360°/n}</b></td></tr><tr><td>Diagonais</td><td><b>d = {n(n − 3)/2}</b></td></tr></table>
<p><i>De onde vem (n − 2)?</i> De um vértice, as diagonais dividem o polígono em (n − 2) triângulos, cada um com 180°.</p>
<h3>Caso 1 — Soma dos internos</h3><div class="ex">Hexágono: (6 − 2) × 180 = <b>720°</b>.</div>
<h3>Caso 2 — Ângulo interno do regular</h3><div class="ex">Octógono regular: (8 − 2) × 180 = 1080 → 1080 ÷ 8 = <b>135°</b>.</div>
<h3>Caso 3 — Ângulo externo e o caminho de volta</h3>
<div class="ex">Pentágono regular: externo = 360 ÷ 5 = 72°, interno = 180 − 72 = <b>108°</b>.<br><b>Volta:</b> o interno de um regular mede 140°. Quantos lados? Externo = 40° → n = 360 ÷ 40 = <b>9 lados</b>.</div>
<h3>Caso 4 — Lados a partir da soma</h3><div class="ex">S = 1.440° → (n − 2) = 1440 ÷ 180 = 8 → <b>n = 10</b>.</div>
<h3>Caso 5 — Diagonais</h3>
<div class="ex">Decágono: {10 × 7/2} = <b>35 diagonais</b>.<br>Diagonais que saem de <b>um</b> vértice: n − 3 (no decágono, 7).</div>
<h3>Caso 6 — Ângulo desconhecido num polígono qualquer</h3>
<div class="ex">Quadrilátero com ângulos 80°, 95°, 110° e x → soma 360 → x = <b>75°</b>.</div>`;

TEORIA['perimetro']=`
<h3>O que é</h3><p><b>Perímetro</b> é o comprimento do <b>contorno</b>: some todos os lados. É medido em unidades de comprimento (cm, m, km).</p>
<table class="t"><tr><td>Quadrado de lado L</td><td>P = 4L</td></tr><tr><td>Retângulo de lados a e b</td><td>P = 2a + 2b</td></tr><tr><td>Triângulo</td><td>P = a + b + c</td></tr><tr><td>Polígono regular de n lados</td><td>P = n × L</td></tr><tr><td>Circunferência</td><td>C = 2πr</td></tr></table>
<h3>Caso 1 — Retângulo</h3><div class="ex">8 m por 5 m → P = 2·8 + 2·5 = <b>26 m</b>.</div>
<h3>Caso 2 — Lado a partir do perímetro</h3>
<div class="ex">Quadrado de perímetro 36 cm → lado 36 ÷ 4 = <b>9 cm</b>.<br>Retângulo de perímetro 30 cm com um lado de 9 cm → 2·9 + 2b = 30 → b = <b>6 cm</b>.</div>
<h3>Caso 3 — Figura em “L” ou recortada</h3>
<div class="ex">Some <b>todos</b> os lados do contorno, descobrindo os que faltam pelas diferenças. Dica: num “L” feito de retângulos, o perímetro é igual ao do retângulo que o envolve.</div>
<h3>Caso 4 — Unidades misturadas</h3><div class="ex">Lados de 1,5 m e 80 cm → passe tudo para cm: 150 e 80 → P = 2·150 + 2·80 = <b>460 cm = 4,6 m</b>.</div>
<h3>Caso 5 — Problemas</h3>
<div class="ex">Cercar um terreno 20 m × 15 m com 4 voltas de arame: P = 70 m → 4 × 70 = <b>280 m</b>.<br>Rodapé de uma sala 5 m × 4 m com porta de 1 m: 18 − 1 = <b>17 m</b>.</div>`;

TEORIA['areas']=`
<h3>O que é</h3><p><b>Área</b> é a medida da <b>superfície</b> (o “tamanho por dentro”). Unidade: quadrados (cm², m²). 1 m² é um quadrado de 1 m de lado.</p>
<table class="t"><tr><td><b>Retângulo</b></td><td>A = b × h</td></tr><tr><td><b>Quadrado</b></td><td>A = L²</td></tr><tr><td><b>Paralelogramo</b></td><td>A = b × h (h é a altura, não o lado inclinado)</td></tr><tr><td><b>Triângulo</b></td><td>A = {b × h/2}</td></tr><tr><td><b>Trapézio</b></td><td>A = {(B + b) × h/2}</td></tr><tr><td><b>Losango</b></td><td>A = {D × d/2}</td></tr><tr><td><b>Círculo</b></td><td>A = πr²</td></tr></table>
<p><i>Por que o triângulo divide por 2?</i> Dois triângulos iguais formam um paralelogramo.</p>
<h3>Caso 1 — Retângulo e quadrado</h3><div class="ex">Sala 6 m × 4 m → <b>24 m²</b>. Quadrado de lado 7 cm → <b>49 cm²</b>.</div>
<h3>Caso 2 — Triângulo</h3><div class="ex">Base 10 cm, altura 7 cm → {70/2} = <b>35 cm²</b>.<br>Triângulo retângulo: a base e a altura são os <b>catetos</b>: 6 e 8 → {48/2} = <b>24</b>.</div>
<h3>Caso 3 — Trapézio</h3><div class="ex">B = 10, b = 6, h = 4 → {(10 + 6) × 4/2} = {64/2} = <b>32</b>.</div>
<h3>Caso 4 — Losango</h3><div class="ex">Diagonais 12 e 8 → {96/2} = <b>48</b>.</div>
<h3>Caso 5 — Figura composta (dividir ou subtrair)</h3>
<div class="ex">Um terreno em “L”: retângulo 10 × 8 do qual foi tirado um canto 4 × 3.<br><b>Subtraindo:</b> 80 − 12 = <b>68 m²</b>.<br>(Ou divida em dois retângulos e some.)</div>
<h3>Caso 6 — Achar uma medida a partir da área</h3><div class="ex">Retângulo de área 54 m² e base 9 m → altura 54 ÷ 9 = <b>6 m</b>. Quadrado de área 64 → lado √64 = <b>8</b>.</div>
<h3>Caso 7 — Custo por m²</h3><div class="ex">Piso a R$ 45/m² numa sala 5 × 4 → 20 m² × 45 = <b>R$ 900</b>.</div>
<h3>Caso 8 — O que acontece ao dobrar os lados</h3><div class="ex">Dobrou os lados → a área fica <b>4 vezes</b> maior (2 × 2). Triplicou → 9 vezes.</div>`;

TEORIA['circunferencia-circulo']=`
<h3>Vocabulário</h3>
<ul><li><b>Circunferência</b>: só a linha da borda. <b>Círculo</b>: a região toda (borda + interior).</li><li><b>Raio (r)</b>: centro até a borda. <b>Diâmetro (d)</b>: atravessa pelo centro, d = 2r.</li><li><b>π (pi)</b>: razão entre o comprimento e o diâmetro de qualquer circunferência ≈ 3,14.</li></ul>
<table class="t"><tr><td>Comprimento (contorno)</td><td><b>C = 2πr</b> = πd</td></tr><tr><td>Área</td><td><b>A = πr²</b></td></tr></table>
<h3>Caso 1 — Comprimento</h3><div class="ex">r = 5 cm → C = 2 × 3,14 × 5 = <b>31,4 cm</b>.</div>
<h3>Caso 2 — Área</h3><div class="ex">r = 5 cm → A = 3,14 × 5² = 3,14 × 25 = <b>78,5 cm²</b>.</div>
<h3>Caso 3 — Dado o diâmetro (cuidado!)</h3><div class="ex">d = 10 m → r = 5 m. Área = 3,14 × 25 = 78,5 m². (Erro comum: usar 10² = 100.)</div>
<h3>Caso 4 — Caminho de volta</h3><div class="ex">Uma praça circular tem 62,8 m de contorno. Raio? 62,8 = 2 × 3,14 × r → 6,28r = 62,8 → <b>r = 10 m</b>.</div>
<h3>Caso 5 — Voltas de uma roda</h3><div class="ex">Roda de raio 30 cm: uma volta = 2 × 3,14 × 30 = 188,4 cm. Em 500 voltas: 94.200 cm = <b>942 m</b>.</div>
<h3>Caso 6 — Coroa circular (anel)</h3><div class="ex">Raio externo 5, interno 3 → A = π(5² − 3²) = 3,14 × 16 = <b>50,24</b>.</div>
<h3>Caso 7 — Setor circular (fatia)</h3><div class="ex">Fatia de 90° de uma pizza de raio 4: é {90/360} = {1/4} do círculo → {1/4} × 3,14 × 16 = <b>12,56</b>.</div>
<h3>Caso 8 — Resposta “em função de π”</h3><div class="ex">r = 3 → A = 9π (sem substituir o π). Muitas provas pedem assim.</div>`;

TEORIA['pitagoras']=`
<h3>O teorema</h3>
<p>Vale só em <b>triângulo retângulo</b> (que tem um ângulo de 90°):</p>
${SVG_RET}
<p class="big"><b>a² = b² + c²</b></p>
<p>“O quadrado da hipotenusa é igual à soma dos quadrados dos catetos.” A <b>hipotenusa</b> é o maior lado, de frente para o ângulo reto.</p>
<h3>Caso 1 — Achar a hipotenusa (soma)</h3>
<div class="ex">Catetos 6 e 8 → a² = 36 + 64 = 100 → a = <b>10</b>.</div>
<h3>Caso 2 — Achar um cateto (subtração)</h3>
<div class="ex">Hipotenusa 13, cateto 5 → 13² = 5² + c² → 169 = 25 + c² → c² = 144 → c = <b>12</b>.</div>
<h3>Caso 3 — Resultado com raiz</h3>
<div class="ex">Catetos 2 e 4 → a² = 4 + 16 = 20 → a = √20 = <b>2√5</b> ≈ 4,47.</div>
<h3>Caso 4 — Diagonal do quadrado e do retângulo</h3>
<div class="ex">Quadrado de lado L: d² = L² + L² → <b>d = L√2</b>. Lado 5 → 5√2 ≈ 7,07.<br>Retângulo 9 × 12 → d² = 81 + 144 = 225 → <b>d = 15</b>.</div>
<h3>Caso 5 — Altura do triângulo equilátero</h3>
<div class="ex">Lado 6: a altura divide a base ao meio (3) → h² + 3² = 6² → h² = 27 → <b>h = 3√3</b>. Fórmula: h = {L√3/2}.</div>
<h3>Caso 6 — Problemas (escada, rampa, TV)</h3>
<div class="ex"><b>Escada:</b> 5 m de escada, pé a 3 m da parede → altura: 25 − 9 = 16 → <b>4 m</b>.<br><b>TV:</b> a “polegada” é a diagonal. Tela 48 × 36 → d² = 2304 + 1296 = 3600 → <b>60</b>.</div>
<h3>Caso 7 — Verificar se é retângulo</h3>
<div class="ex">Lados 7, 24, 25: 7² + 24² = 49 + 576 = 625 = 25² → <b>é retângulo</b>.</div>
<h3>Ternos pitagóricos para decorar</h3><p>3-4-5 · 5-12-13 · 8-15-17 · 7-24-25 e seus múltiplos (6-8-10, 9-12-15, 10-24-26…).</p>`;

TEORIA['tales-semelhanca']=`
<h3>Teorema de Tales</h3>
<p>Se um <b>feixe de retas paralelas</b> é cortado por duas transversais, os segmentos formados são <b>proporcionais</b>.</p>
<div class="ex">Numa transversal os segmentos medem 4 e 6; na outra, 10 e x.<br>{4/6} = {10/x} → 4x = 60 → <b>x = 15</b>.<br><b>Com x nos dois:</b> {x/3} = {x + 4/5} → 5x = 3x + 12 → <b>x = 6</b>.</div>
<h3>Semelhança de triângulos</h3>
<p>Dois triângulos são <b>semelhantes</b> quando têm os <b>mesmos ângulos</b>. Aí os lados correspondentes são <b>proporcionais</b> (um é uma “ampliação” do outro). A razão entre lados correspondentes é a <b>razão de semelhança k</b>.</p>
<p>Basta ter <b>dois ângulos iguais</b> para garantir a semelhança (critério AA).</p>
<h3>Caso 1 — Lados de triângulos semelhantes</h3>
<div class="ex">Triângulo de lados 3, 4, 5 e um semelhante com lado menor 9 → k = 3 → <b>9, 12, 15</b>.</div>
<h3>Caso 2 — Sombra (o clássico)</h3>
<div class="ex">Um poste de 2 m faz sombra de 3 m; no mesmo instante um prédio faz sombra de 18 m.<br>Os raios de sol são paralelos → triângulos semelhantes: {h/18} = {2/3} → 3h = 36 → <b>h = 12 m</b>.</div>
<h3>Caso 3 — Triângulo “dentro” de outro (reta paralela a um lado)</h3>
<div class="ex">Num triângulo, uma reta paralela à base corta os lados formando um triângulo menor de base 6 e altura 4. Se a base do grande é 15, a altura do grande: {4/H} = {6/15} → 6H = 60 → <b>H = 10</b>.</div>
<h3>Caso 4 — Perímetro e área</h3>
<div class="ex">Razão de semelhança k → perímetros na razão <b>k</b>, áreas na razão <b>k²</b>.<br>k = 3 e área menor 10 cm² → área maior 10 × 9 = <b>90 cm²</b>.</div>
<h3>Caso 5 — Mapas e maquetes</h3><div class="ex">Maquete na escala 1 : 50; altura real 15 m = 1.500 cm → maquete 1500 ÷ 50 = <b>30 cm</b>.</div>`;

TEORIA['relacoes-metricas']=`
<h3>Os elementos</h3>
<p>No triângulo retângulo, traçando a <b>altura h</b> relativa à hipotenusa, ela divide a hipotenusa <b>a</b> em duas partes: <b>m</b> (projeção do cateto c) e <b>n</b> (projeção do cateto b).</p>
<table class="t"><tr><td><b>a = m + n</b></td><td>a hipotenusa é a soma das projeções</td></tr><tr><td><b>h² = m · n</b></td><td>altura ao quadrado = produto das projeções</td></tr><tr><td><b>b² = a · n</b></td><td>cateto² = hipotenusa × sua projeção</td></tr><tr><td><b>c² = a · m</b></td><td>(mesma ideia, outro cateto)</td></tr><tr><td><b>a · h = b · c</b></td><td>vem da área calculada de dois jeitos</td></tr><tr><td><b>a² = b² + c²</b></td><td>Pitágoras</td></tr></table>
<h3>Caso 1 — Altura a partir das projeções</h3><div class="ex">m = 9, n = 16 → h² = 144 → <b>h = 12</b>.</div>
<h3>Caso 2 — Cateto a partir da hipotenusa e projeção</h3><div class="ex">a = 25, m = 9 → c² = 25 · 9 = 225 → <b>c = 15</b>.</div>
<h3>Caso 3 — Projeção a partir do cateto</h3><div class="ex">a = 10, b = 8 → 64 = 10 · n → <b>n = 6,4</b>; m = 10 − 6,4 = 3,6.</div>
<h3>Caso 4 — Altura a partir dos catetos</h3><div class="ex">b = 6, c = 8 → a = 10 (Pitágoras) → 10h = 48 → <b>h = 4,8</b>.</div>
<h3>Caso 5 — Resolver tudo a partir de duas medidas</h3>
<div class="ex">Dados m = 4 e n = 9: a = 13; h² = 36 → h = 6; b² = 13 · 9 = 117 → b = 3√13; c² = 13 · 4 = 52 → c = 2√13.</div>
<p class="tip">Dica para escolher a fórmula: veja quais 2 medidas você tem e qual quer; procure a fórmula que tem exatamente essas três letras.</p>`;

TEORIA['trigonometria']=`
<h3>As três razões</h3>
${SVG_RET}
<p>Para um ângulo agudo α de um triângulo retângulo:</p>
<table class="t"><tr><td><b>sen α</b></td><td>{cateto oposto/hipotenusa}</td></tr><tr><td><b>cos α</b></td><td>{cateto adjacente/hipotenusa}</td></tr><tr><td><b>tg α</b></td><td>{cateto oposto/cateto adjacente}</td></tr></table>
<p><b>Oposto</b> = o cateto de frente para o ângulo. <b>Adjacente</b> = o cateto “encostado” no ângulo (que não é a hipotenusa). Macete: <b>SOH-CAH-TOA</b>.</p>
<h3>Ângulos notáveis</h3>
<table class="t"><tr><th></th><th>30°</th><th>45°</th><th>60°</th></tr><tr><td>sen</td><td>{1/2}</td><td>{√2/2}</td><td>{√3/2}</td></tr><tr><td>cos</td><td>{√3/2}</td><td>{√2/2}</td><td>{1/2}</td></tr><tr><td>tg</td><td>{√3/3}</td><td>1</td><td>√3</td></tr></table>
<h3>Caso 1 — Calcular as razões com os lados</h3>
<div class="ex">Triângulo 3-4-5, ângulo α oposto ao lado 3: sen α = {3/5}; cos α = {4/5}; tg α = {3/4}.</div>
<h3>Caso 2 — Achar o cateto oposto (seno)</h3>
<div class="ex">Hipotenusa 20, ângulo 30° → sen 30° = {x/20} → {1/2} = {x/20} → <b>x = 10</b>.</div>
<h3>Caso 3 — Achar o cateto adjacente (cosseno)</h3>
<div class="ex">Hipotenusa 10, ângulo 60° → cos 60° = {x/10} → x = <b>5</b>.</div>
<h3>Caso 4 — Achar a hipotenusa</h3>
<div class="ex">Cateto oposto ao ângulo de 30° mede 7 → sen 30° = {7/H} → {1/2} = {7/H} → <b>H = 14</b>.</div>
<h3>Caso 5 — Tangente (altura de prédio/árvore)</h3>
<div class="ex">A 30 m de um prédio, vejo o topo a 60°. Altura: tg 60° = {h/30} → h = 30√3 ≈ <b>51,96 m</b>.</div>
<h3>Caso 6 — Descobrir o ângulo</h3>
<div class="ex">Catetos iguais (5 e 5) → tg α = 1 → <b>α = 45°</b>.<br>Cateto oposto 4 e hipotenusa 8 → sen α = {1/2} → <b>α = 30°</b>.</div>
<h3>Caso 7 — Ângulo não notável (usar tabela)</h3>
<div class="ex">Rampa de 10 m com 20° de inclinação; sen 20° ≈ 0,34 → altura ≈ 10 × 0,34 = <b>3,4 m</b>.</div>`;

TEORIA['volume']=`
<h3>O que é</h3><p><b>Volume</b> é o espaço que um sólido ocupa. Unidade: <b>cúbicas</b> (cm³, m³). <b>Capacidade</b> é quanto cabe dentro (litros).</p>
<table class="t"><tr><td><b>Cubo</b> (aresta a)</td><td>V = a³</td></tr><tr><td><b>Paralelepípedo</b> (caixa)</td><td>V = c × l × h</td></tr><tr><td><b>Prisma</b> qualquer</td><td>V = área da base × altura</td></tr><tr><td><b>Cilindro</b></td><td>V = πr² × h</td></tr><tr><td><b>Pirâmide e cone</b></td><td>V = {área da base × altura/3}</td></tr></table>
<table class="t"><tr><td>1 dm³ = <b>1 L</b></td><td>1 m³ = <b>1.000 L</b></td><td>1 cm³ = <b>1 mL</b></td></tr></table>
<h3>Caso 1 — Cubo</h3><div class="ex">a = 4 cm → 4 × 4 × 4 = <b>64 cm³</b>.</div>
<h3>Caso 2 — Caixa e litros</h3><div class="ex">Aquário 50 cm × 30 cm × 40 cm → 60.000 cm³ = 60.000 mL = <b>60 L</b>.</div>
<h3>Caso 3 — Caixa-d’água em metros</h3><div class="ex">2 m × 1,5 m × 1 m = 3 m³ = <b>3.000 L</b>.</div>
<h3>Caso 4 — Prisma triangular</h3><div class="ex">Base triângulo (b = 6, h = 4) → área 12; altura do prisma 10 → V = <b>120</b>.</div>
<h3>Caso 5 — Cilindro</h3><div class="ex">Lata com r = 5 cm e h = 12 cm → 3,14 × 25 × 12 = <b>942 cm³</b> ≈ 0,94 L.</div>
<h3>Caso 6 — Cone e pirâmide (um terço!)</h3><div class="ex">Cone com r = 3 e h = 10 → {3,14 × 9 × 10/3} = <b>94,2</b>.</div>
<h3>Caso 7 — Achar uma medida a partir do volume</h3><div class="ex">Caixa de 240 cm³ com base 8 × 6 → altura 240 ÷ 48 = <b>5 cm</b>.</div>
<h3>Caso 8 — Nível de água</h3><div class="ex">Piscina 10 m × 5 m; quantos litros para subir 10 cm? 10 × 5 × 0,1 = 5 m³ = <b>5.000 L</b>.</div>`;

TEORIA['unidades-medida']=`
<h3>A escadinha (comprimento, massa, capacidade)</h3>
<table class="t"><tr><th>km</th><th>hm</th><th>dam</th><th><b>m</b></th><th>dm</th><th>cm</th><th>mm</th></tr><tr><td>kg</td><td>hg</td><td>dag</td><td><b>g</b></td><td>dg</td><td>cg</td><td>mg</td></tr><tr><td>kL</td><td>hL</td><td>daL</td><td><b>L</b></td><td>dL</td><td>cL</td><td>mL</td></tr></table>
<p>Cada degrau para a <b>direita</b>: × 10 (a unidade ficou menor, o número fica maior). Para a <b>esquerda</b>: ÷ 10.</p>
<h3>Caso 1 — Comprimento</h3><div class="ex">2,5 km → m: 3 degraus à direita → × 1.000 → <b>2.500 m</b>.<br>350 cm → m: 2 degraus à esquerda → ÷ 100 → <b>3,5 m</b>.</div>
<h3>Caso 2 — Massa</h3><div class="ex">1,2 kg → g = <b>1.200 g</b>. &nbsp;750 g → kg = 0,75 kg. &nbsp;1 tonelada = 1.000 kg.</div>
<h3>Caso 3 — Capacidade</h3><div class="ex">2 L = <b>2.000 mL</b>. &nbsp;350 mL = 0,35 L.</div>
<h3>Caso 4 — Área (cada degrau × 100!)</h3><div class="ex">1 m² = 100 dm² = 10.000 cm². &nbsp;3 m² → <b>30.000 cm²</b>.<br>1 km² = 1.000.000 m². &nbsp;1 hectare = 10.000 m².</div>
<h3>Caso 5 — Volume (cada degrau × 1.000!)</h3><div class="ex">1 m³ = 1.000 dm³ = 1.000.000 cm³. &nbsp;2 m³ = <b>2.000 L</b>.</div>
<h3>Caso 6 — Tempo (base 60, não 10!)</h3><div class="ex">1 h = 60 min; 1 min = 60 s; 1 dia = 24 h.<br>2 h 15 min = <b>135 min</b>. &nbsp;200 min = 3 h 20 min. &nbsp;1,5 h = <b>1 h 30 min</b> (e não 1 h 50!).</div>
<h3>Caso 7 — Somar medidas diferentes</h3><div class="ex">1,2 m + 35 cm + 400 mm → tudo em cm: 120 + 35 + 40 = <b>195 cm</b>.</div>`;

TEORIA['plano-cartesiano']=`
<h3>O que é</h3>
<p>Dois eixos perpendiculares: o <b>eixo x</b> (horizontal, das abscissas) e o <b>eixo y</b> (vertical, das ordenadas). Eles se cruzam na <b>origem (0, 0)</b>. Cada ponto é um <b>par ordenado (x, y)</b>: primeiro anda na horizontal, depois na vertical.</p>
<table class="t"><tr><td>1º quadrante: (+, +)</td><td>2º quadrante: (−, +)</td></tr><tr><td>3º quadrante: (−, −)</td><td>4º quadrante: (+, −)</td></tr></table>
<p>Pontos em cima dos eixos (como (3, 0) ou (0, −2)) <b>não</b> pertencem a quadrante.</p>
<h3>Caso 1 — Localizar e dar o quadrante</h3><div class="ex">(−3, 5): anda 3 para a esquerda e 5 para cima → <b>2º quadrante</b>.</div>
<h3>Caso 2 — Simétricos</h3><div class="ex">P(4, −2). Em relação ao eixo x: (4, 2). Ao eixo y: (−4, −2). À origem: (−4, 2).</div>
<h3>Caso 3 — Ponto médio</h3><div class="ex">A(2, 8) e B(6, −4) → M = ({2 + 6/2}, {8 + (−4)/2}) = <b>(4, 2)</b>. É a média das coordenadas.</div>
<h3>Caso 4 — Distância entre dois pontos</h3>
<div class="ex">A(1, 2) e B(7, 10)<ol><li>Δx = 7 − 1 = 6; Δy = 10 − 2 = 8.</li><li>Pitágoras: d² = 6² + 8² = 100 → <b>d = 10</b>.</li></ol>
Fórmula: d = √[(x₂ − x₁)² + (y₂ − y₁)²].</div>
<h3>Caso 5 — Distância em reta horizontal/vertical</h3><div class="ex">(2, 3) e (2, −5): mesmo x → d = |3 − (−5)| = <b>8</b>.</div>
<h3>Caso 6 — Área de figura no plano</h3><div class="ex">Retângulo de vértices (1, 1), (5, 1), (5, 4), (1, 4): base 4, altura 3 → <b>12</b>.</div>`;

TEORIA['media-moda-mediana']=`
<h3>Medidas de tendência central</h3>
<p>São números que <b>resumem</b> um conjunto de dados.</p>
<h3>Média aritmética</h3>
<div class="ex">Some tudo e divida pela quantidade. Notas 6, 8, 7, 9 → {30/4} = <b>7,5</b>.</div>
<h3>Média ponderada</h3>
<div class="ex">Cada valor tem um <b>peso</b>. Prova (peso 3) nota 6, trabalho (peso 1) nota 10 → {6·3 + 10·1/3 + 1} = {28/4} = <b>7</b>.</div>
<h3>Média com tabela de frequência</h3>
<div class="ex"><table class="t"><tr><th>Nota</th><th>Alunos</th></tr><tr><td>5</td><td>2</td></tr><tr><td>7</td><td>3</td></tr><tr><td>8</td><td>5</td></tr></table>Média = {5·2 + 7·3 + 8·5/10} = {71/10} = <b>7,1</b>. (A frequência funciona como peso.)</div>
<h3>Moda</h3>
<div class="ex">O valor que <b>mais aparece</b>.<br>2, 3, 3, 5, 7 → moda <b>3</b>. &nbsp;1, 1, 4, 4, 6 → <b>bimodal</b> (1 e 4). &nbsp;1, 2, 3, 4 → <b>amodal</b> (sem moda).<br>Serve também para dados não numéricos: cor preferida, tamanho de camiseta.</div>
<h3>Mediana</h3>
<div class="ex">Coloque em <b>ordem</b> e pegue o do <b>meio</b>.<br><b>Quantidade ímpar:</b> 9, 2, 7, 4, 5 → ordenado 2, 4, <b>5</b>, 7, 9 → mediana 5.<br><b>Quantidade par:</b> 3, 8, 1, 6 → 1, <b>3, 6</b>, 8 → média dos dois do meio: {3 + 6/2} = <b>4,5</b>.</div>
<h3>Amplitude</h3><div class="ex">Maior − menor: 2, 4, 5, 7, 9 → 9 − 2 = <b>7</b>. Mostra o quanto os dados são espalhados.</div>
<h3>Caso — Descobrir um valor que falta</h3>
<div class="ex">A média de 4 notas é 7; três delas são 6, 8 e 5. A quarta? Total precisa ser 4 × 7 = 28 → 28 − 19 = <b>9</b>.</div>
<h3>Qual usar?</h3><p>A média é puxada por valores extremos (ex.: salários com um milionário). Nesses casos a <b>mediana</b> representa melhor o “típico”.</p>`;

TEORIA['probabilidade']=`
<h3>O que é</h3>
<p class="big">P(evento) = {casos favoráveis/casos possíveis}</p>
<ul><li>Vai de <b>0</b> (impossível) a <b>1</b> (certo). Em % de 0% a 100%.</li><li><b>Espaço amostral</b>: todos os resultados possíveis. Moeda: {cara, coroa}. Dado: {1, 2, 3, 4, 5, 6}.</li><li>Vale quando todos os resultados são <b>igualmente prováveis</b>.</li></ul>
<h3>Caso 1 — Um dado</h3><div class="ex">P(sair múltiplo de 3) = {2/6} = <b>{1/3}</b> (3 e 6).</div>
<h3>Caso 2 — Urna</h3><div class="ex">4 bolas azuis e 6 vermelhas. P(azul) = {4/10} = <b>{2/5}</b> = 40%.</div>
<h3>Caso 3 — Evento complementar (“não”)</h3><div class="ex">P(não sair 6 num dado) = 1 − {1/6} = <b>{5/6}</b>.<br>Útil para “pelo menos um”: P(pelo menos uma cara em 3 moedas) = 1 − P(nenhuma) = 1 − {1/8} = <b>{7/8}</b>.</div>
<h3>Caso 4 — Dois eventos independentes (“e” → multiplica)</h3><div class="ex">Moeda dar cara <b>e</b> dado dar 6: {1/2} × {1/6} = <b>{1/12}</b>.</div>
<h3>Caso 5 — Dois dados (tabela 6 × 6)</h3><div class="ex">36 resultados. Soma 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) → {6/36} = <b>{1/6}</b>.</div>
<h3>Caso 6 — “Ou” (some, sem contar duas vezes)</h3><div class="ex">Dado: par <b>ou</b> maior que 4 → {2, 4, 6} ∪ {5, 6} = {2, 4, 5, 6} → <b>{4/6} = {2/3}</b>.</div>
<h3>Caso 7 — Sem reposição</h3><div class="ex">3 azuis e 2 vermelhas; tiro duas, sem devolver. P(duas azuis) = {3/5} × {2/4} = {6/20} = <b>{3/10}</b>. Na 2ª retirada há uma bola a menos!</div>
<h3>Caso 8 — Baralho/objetos</h3><div class="ex">Num baralho de 52 cartas, P(ás) = {4/52} = {1/13}.</div>`;

TEORIA['contagem']=`
<h3>Princípio multiplicativo (PFC)</h3>
<p>Se uma decisão tem <b>m</b> opções e outra, independente, tem <b>n</b>, as duas juntas têm <b>m × n</b> possibilidades. Desenhe um <b>tracinho por etapa</b>, escreva as opções em cada um e multiplique.</p>
<h3>Caso 1 — Combinações de roupa/cardápio</h3><div class="ex">3 camisas, 2 calças, 2 tênis → 3 × 2 × 2 = <b>12</b> maneiras. (Faça a árvore de possibilidades com o aluno para ver os 12.)</div>
<h3>Caso 2 — Com repetição permitida</h3><div class="ex">Senhas de 4 dígitos (0–9): 10 × 10 × 10 × 10 = <b>10.000</b>.</div>
<h3>Caso 3 — Sem repetição</h3><div class="ex">Números de 3 algarismos <b>distintos</b> usando 1, 2, 3, 4, 5: 5 × 4 × 3 = <b>60</b>.</div>
<h3>Caso 4 — Com restrição (comece pela posição exigente!)</h3><div class="ex">Números <b>pares</b> de 3 algarismos distintos com 1, 2, 3, 4, 5.<ol><li>Última casa (par): 2 opções (2 ou 4).</li><li>Primeira: 4 opções (sobrou). Do meio: 3.</li><li>2 × 4 × 3 = <b>24</b>.</li></ol>Restrição do zero: números de 3 algarismos distintos com 0–9: 1ª casa não pode ser 0 → 9 × 9 × 8 = <b>648</b>.</div>
<h3>Caso 5 — Permutação (arrumar todos em fila)</h3><div class="ex">5 pessoas numa fila: 5 × 4 × 3 × 2 × 1 = 5! = <b>120</b>.<br>Anagramas de AMOR: 4! = <b>24</b>.</div>
<h3>Caso 6 — Anagramas com letras repetidas</h3><div class="ex">ARARA: 5 letras, A aparece 3 vezes, R 2 vezes → {5!/3! · 2!} = {120/12} = <b>10</b>.</div>
<h3>Caso 7 — Quando a ordem não importa (grupos)</h3><div class="ex">Escolher 2 alunos de 5 para uma comissão: 5 × 4 = 20 pares ordenados, mas “Ana e Bia” = “Bia e Ana” → ÷ 2 = <b>10</b>.<br>Apertos de mão entre 6 pessoas: {6 × 5/2} = <b>15</b>.</div>
<p class="tip">Pergunta-chave: <b>trocar a ordem muda o resultado?</b> Senha, fila, pódio → muda (não divide). Grupo, comissão, aperto de mão → não muda (divide).</p>`;

TEORIA['elementos-notaveis']=`
<h3>Primeiro: o que é um “elemento notável”?</h3>
<p>São <b>linhas especiais</b> que a gente traça dentro de um triângulo. Cada uma tem uma “missão” diferente. Quando traçamos as três linhas do mesmo tipo (uma de cada vértice ou de cada lado), elas se encontram num <b>ponto especial</b>: são os <b>pontos notáveis</b>.</p>
<p>São <b>4 linhas</b> e <b>4 pontos</b>. Olhe a figura com calma, uma de cada vez:</p>
${SVG_CEV}
<h3>As 4 linhas, uma de cada vez</h3>
<table class="t"><tr><th>Linha</th><th>De onde sai → até onde vai</th><th>Missão (o que ela garante)</th></tr>
<tr><td><b>Altura</b></td><td>de um vértice → até o lado oposto</td><td>chega fazendo <b>90°</b> (é a “distância em pé” do vértice ao lado)</td></tr>
<tr><td><b>Mediana</b></td><td>de um vértice → até o <b>ponto médio</b> do lado oposto</td><td>divide o lado oposto em <b>duas metades iguais</b></td></tr>
<tr><td><b>Bissetriz</b></td><td>de um vértice → até o lado oposto</td><td>divide o <b>ângulo</b> do vértice em <b>dois ângulos iguais</b></td></tr>
<tr><td><b>Mediatriz</b></td><td>não sai de vértice! É uma reta que passa no meio de um lado</td><td>corta o lado no <b>meio</b> e fazendo <b>90°</b></td></tr></table>
<p class="tip"><b>Truque das palavras:</b> me<b>DIA</b>na → <b>meio</b> do lado · <b>BI</b>ssetriz → <b>bi</b> = dois, corta o ângulo em 2 · <b>ALTURA</b> → é como medir a altura de uma pessoa: régua em pé, 90° com o chão · <b>MEDIATRIZ</b> → <b>meio</b> + 90° (junta a mediana com a altura, mas não precisa passar por vértice).</p>
<h3>Os 4 pontos notáveis</h3>
<table class="t"><tr><th>Encontro das…</th><th>Ponto</th><th>Para que serve</th></tr>
<tr><td>3 <b>M</b>edianas</td><td><b>B</b>aricentro (G)</td><td>centro de <b>equilíbrio</b>: um triângulo de papelão fica equilibrado na ponta do lápis nesse ponto</td></tr>
<tr><td>3 <b>B</b>issetrizes</td><td><b>I</b>ncentro (I)</td><td>centro da circunferência <b>inscrita</b> (desenhada <b>dentro</b>, encostando nos 3 lados)</td></tr>
<tr><td>3 <b>M</b>ediatrizes</td><td><b>C</b>ircuncentro (O)</td><td>centro da circunferência <b>circunscrita</b> (passa pelos 3 <b>vértices</b>); fica à mesma distância dos 3 vértices</td></tr>
<tr><td>3 <b>A</b>lturas</td><td><b>O</b>rtocentro (H)</td><td>“orto” quer dizer reto (90°)</td></tr></table>
<p class="tip"><b>Macete para decorar:</b> <span class="big" style="font-size:18px">MB · BI · MC · AO</span><br>Medianas–Baricentro, Bissetrizes–Incentro, Mediatrizes–Circuncentro, Alturas–Ortocentro.</p>
<h3>Caso 1 — O baricentro divide a mediana em 2 + 1</h3>
${SVG_BAR}
<p>Esta é a propriedade que mais cai. O baricentro corta cada mediana em <b>3 partes iguais</b>: <b>2 partes</b> ficam do lado do <b>vértice</b> e <b>1 parte</b> do lado do <b>ponto médio</b>.</p>
<div class="ex"><b>Exemplo A (tenho a mediana inteira):</b> AM = 18 cm. Quanto mede AG e GM?<ol><li>Mediana inteira = 3 partes → 1 parte = 18 ÷ 3 = 6 cm.</li><li>AG (lado do vértice) = 2 partes = <b>12 cm</b>.</li><li>GM (lado do ponto médio) = 1 parte = <b>6 cm</b>. Confere: 12 + 6 = 18 ✓</li></ol>
<b>Exemplo B (tenho o pedaço pequeno):</b> GM = 5 cm → AG = 2 × 5 = <b>10 cm</b> e AM = 3 × 5 = <b>15 cm</b>.<br>
<b>Exemplo C (tenho o pedaço grande):</b> AG = 14 cm → 1 parte = 14 ÷ 2 = 7 → AM = 3 × 7 = <b>21 cm</b>.</div>
<p class="tip">Pense sempre em <b>“partes”</b>: descubra quanto vale 1 parte e o resto sai fácil.</p>
<h3>Caso 2 — Mediana e ponto médio</h3>
<div class="ex">AM é mediana relativa a BC e BM = 7 cm. Como M é o <b>meio</b>, MC também é 7 cm → BC = 7 + 7 = <b>14 cm</b>.</div>
<h3>Caso 3 — Bissetriz: metade do ângulo</h3>
<div class="ex"><b>Exemplo A:</b> Â = 70° e AD é bissetriz → BAD = DAC = 70 ÷ 2 = <b>35°</b>.<br>
<b>Exemplo B (mais completo):</b> Â = 80°, B = 60°. AD é bissetriz. Quanto mede o ângulo ADB?<ol><li>Bissetriz: BAD = 80 ÷ 2 = 40°.</li><li>No triângulo ABD: ADB + 40° + 60° = 180°.</li><li>ADB = <b>80°</b>.</li></ol></div>
<h3>Caso 4 — Altura: aparece um ângulo de 90°</h3>
<div class="ex">B = 50° e AH é altura relativa a BC. Quanto mede BAH?<ol><li>A altura faz 90° com BC: AHB = 90°.</li><li>No triângulo ABH: BAH + 50° + 90° = 180°.</li><li>BAH = <b>40°</b>.</li></ol>
<i>Repare:</i> sempre que aparecer altura, procure o <b>triângulo retângulo pequeno</b> que ela formou.</div>
<h3>Caso 5 — Mediatriz e circuncentro: mesma distância</h3>
<p>Qualquer ponto da mediatriz de AB está à <b>mesma distância de A e de B</b>. Por isso o circuncentro (encontro das 3 mediatrizes) está à mesma distância dos <b>3 vértices</b>.</p>
<div class="ex">P está na mediatriz de AB e PA = 9 cm → <b>PB = 9 cm</b>.<br>O é o circuncentro e OA = 6 cm → <b>OB = OC = 6 cm</b> (é o raio do círculo que passa pelos vértices).</div>
<h3>Caso 6 — Incentro: o atalho do ângulo BIC</h3>
<div class="ex">I é o incentro e Â = 60°. Quanto mede BIC?<ol><li>B + C = 180° − 60° = 120°.</li><li>As bissetrizes pegam a metade: (B + C) ÷ 2 = 60°.</li><li>No triângulo BIC: BIC = 180° − 60° = <b>120°</b>.</li></ol>
<b>Atalho:</b> BIC = 90° + Â ÷ 2 = 90° + 30° = 120° ✓</div>
<h3>Caso 7 — Onde fica cada ponto? (depende do tipo de triângulo)</h3>
<table class="t"><tr><th></th><th>Acutângulo</th><th>Retângulo</th><th>Obtusângulo</th></tr>
<tr><td>Baricentro</td><td>dentro</td><td>dentro</td><td>dentro</td></tr>
<tr><td>Incentro</td><td>dentro</td><td>dentro</td><td>dentro</td></tr>
<tr><td>Circuncentro</td><td>dentro</td><td><b>no meio da hipotenusa</b></td><td>fora</td></tr>
<tr><td>Ortocentro</td><td>dentro</td><td><b>no vértice do ângulo reto</b></td><td>fora</td></tr></table>
<p class="tip">Baricentro e incentro estão <b>sempre dentro</b>. Os “rebeldes” que podem sair são o circuncentro e o ortocentro.</p>
<h3>Caso 8 — Triângulo retângulo: mediana da hipotenusa = metade dela</h3>
<div class="ex">A hipotenusa mede 10 cm. Como o circuncentro é o meio da hipotenusa e fica à mesma distância dos 3 vértices, a mediana que sai do ângulo reto mede <b>10 ÷ 2 = 5 cm</b>.</div>
<h3>Caso 9 — Isósceles e equilátero: as linhas se juntam</h3>
<ul><li><b>Isósceles:</b> a linha que sai do vértice de cima até a base é, <b>ao mesmo tempo</b>, altura, mediana e bissetriz. Então ela cai no meio da base e faz 90°.</li><li><b>Equilátero:</b> isso vale para os 3 lados. As 4 linhas coincidem e os <b>4 pontos são o mesmo ponto</b> (o centro do triângulo).</li></ul>
<div class="ex"><b>Exemplo:</b> isósceles com base 12 cm e lados iguais de 10 cm. Quanto mede a altura da base?<ol><li>A altura cai no meio da base: 12 ÷ 2 = 6 cm de cada lado.</li><li>Formou um triângulo retângulo: hipotenusa 10 e cateto 6.</li><li>h² = 10² − 6² = 100 − 36 = 64 → h = <b>8 cm</b>.</li></ol>
<b>Equilátero com altura 12 cm:</b> o baricentro está nessa altura (que também é mediana) → distância até o vértice = 2 partes de 12 ÷ 3 = <b>8 cm</b>; até a base = <b>4 cm</b>.</div>
<h3>Erros comuns</h3><ul><li>Achar que a mediana faz 90° (quem faz 90° é a altura; a mediana só vai no meio).</li><li>Achar que a bissetriz cai no meio do lado (ela divide o <b>ângulo</b>, não o lado).</li><li>No baricentro, colocar o pedaço grande do lado do ponto médio. O grande (2 partes) fica <b>sempre do lado do vértice</b>.</li><li>Trocar incentro (bissetrizes, círculo de dentro) com circuncentro (mediatrizes, círculo que passa pelos vértices).</li></ul>
<p class="tip"><b>Resumo:</b> altura → 90° · mediana → meio do lado · bissetriz → metade do ângulo · mediatriz → meio + 90° · <b>MB · BI · MC · AO</b> · baricentro: 2 partes para o vértice, 1 para o lado.</p>`;

TEORIA['semelhanca-triangulos']=`
<h3>A ideia: “mesma forma, tamanho diferente”</h3>
<p>Pense numa foto no celular. Quando você dá zoom, a imagem fica <b>maior</b>, mas não fica <b>torta</b>: tudo cresce na mesma proporção. Dois triângulos assim, um sendo o “zoom” do outro, são <b>semelhantes</b> (símbolo <b>~</b>).</p>
${SVG_SEM}
<p>Na figura, o grande é o pequeno ampliado. O que acontece:</p>
<ul><li>Os <b>ângulos são iguais</b> (α continua α, β continua β). O zoom não muda ângulo.</li><li>Os <b>lados são proporcionais</b>: todos ficam multiplicados pelo mesmo número. Aqui: 9 ÷ 6 = 1,5. Então x = 4 × 1,5 = <b>6</b>.</li></ul>
<p>Esse número que multiplica todos os lados é a <b>razão de semelhança</b>, chamada <b>k</b>.</p>
<h3>Passo 0 — Saber quem corresponde a quem</h3>
<p>O erro número 1 é comparar lados errados. <b>Lados correspondentes</b> são os que ficam <b>de frente para ângulos iguais</b>.</p>
<div class="ex"><b>Como fazer:</b><ol><li>Marque os ângulos iguais com a mesma cor ou símbolo.</li><li>O lado em frente ao ângulo α no pequeno corresponde ao lado em frente ao ângulo α no grande.</li><li>Se o enunciado escreve ABC ~ DEF, a <b>ordem das letras</b> já diz: A↔D, B↔E, C↔F, e então AB↔DE, BC↔EF, AC↔DF.</li></ol></div>
<p class="tip">Atalho quando não tem figura: o <b>menor</b> lado corresponde ao <b>menor</b>, o médio ao médio e o maior ao maior.</p>
<h3>Os 3 casos (como provar que são semelhantes)</h3>
<table class="t"><tr><th>Caso</th><th>O que basta saber</th><th>Exemplo</th></tr>
<tr><td><b>AA</b> (ângulo-ângulo)</td><td><b>2 ângulos iguais</b> (o 3º fica igual automaticamente, pois a soma é 180°)</td><td>um tem 40° e 60°; o outro também → semelhantes</td></tr>
<tr><td><b>LAL</b></td><td>2 lados proporcionais e o <b>ângulo entre eles</b> igual</td><td>lados 3 e 5 com 50° entre eles; outro com 6 e 10 e 50° entre eles (razão 2)</td></tr>
<tr><td><b>LLL</b></td><td>os <b>3 lados</b> proporcionais (mesma razão)</td><td>3, 4, 5 e 6, 8, 10 → todas as razões dão 2</td></tr></table>
<p class="tip">Na prática, <b>AA é o que mais aparece</b>: retas paralelas, ângulo reto em comum, ângulos opostos pelo vértice… tudo isso dá ângulos iguais de graça.</p>
<h3>A receita para achar um lado</h3>
<ol><li>Descubra que os triângulos são semelhantes (normalmente por AA).</li><li>Combine quem corresponde a quem.</li><li>Monte a proporção: {lado do grande/lado do pequeno} = {outro lado do grande/outro lado do pequeno}.</li><li>Multiplique cruzado e resolva.</li></ol>
<h3>Caso 1 — Triângulos já separados</h3>
<div class="ex">ABC ~ DEF com AB = 4, BC = 6, DE = 10. Quanto mede EF?<ol><li>Corresponde: AB↔DE e BC↔EF.</li><li>{DE/AB} = {EF/BC} → {10/4} = {x/6}.</li><li>4x = 60 → x = <b>15</b>.</li></ol>
<b>Outro jeito (pela razão k):</b> k = 10 ÷ 4 = 2,5 → EF = 6 × 2,5 = 15 ✓</div>
<h3>Caso 2 — Sombra (o clássico das provas)</h3>
<div class="ex">Uma pessoa de 1,8 m faz sombra de 2 m. No mesmo instante, um prédio faz sombra de 30 m. Qual a altura do prédio?<ol><li>Por que são semelhantes? O sol bate com a <b>mesma inclinação</b> nos dois (raios paralelos) e os dois estão em pé (90°): AA.</li><li>Altura com altura, sombra com sombra: {h/30} = {1,8/2}.</li><li>2h = 54 → h = <b>27 m</b>.</li></ol></div>
<h3>Caso 3 — Triângulo dentro de triângulo (reta paralela a um lado)</h3>
${SVG_ENC}
<p>Se DE é paralelo a BC, o triângulo pequeno ADE é semelhante ao grande ABC (o ângulo A é comum e as paralelas dão ângulos iguais).</p>
<div class="ex">AD = 3, DB = 6, DE = 4. Quanto mede BC?<ol><li><b>Atenção:</b> o lado do grande é o lado <b>inteiro</b> AB = 3 + 6 = 9 (e não só DB!).</li><li>{BC/DE} = {AB/AD} → {x/4} = {9/3}.</li><li>3x = 36 → x = <b>12</b>.</li></ol></div>
<h3>Caso 4 — Ampulheta (triângulos “de cabeça para baixo”)</h3>
${SVG_AMP}
<p>AB ∥ DC e as linhas se cruzam em E. Os ângulos em E são <b>opostos pelo vértice</b> (iguais) e as paralelas dão outro par igual: AA.</p>
<div class="ex">AB = 4, DC = 10 e AE = 6. Quanto mede EC?<ol><li>Corresponde: AB↔CD, AE↔CE (cada lado do pequeno com o lado “espelhado” do grande).</li><li>k = 10 ÷ 4 = 2,5.</li><li>EC = 6 × 2,5 = <b>15</b>.</li></ol></div>
<h3>Caso 5 — Ângulos de triângulos semelhantes</h3>
<div class="ex">ABC ~ DEF, Â = 50° e B = 70°. Quanto mede F?<ol><li>C = 180° − 50° − 70° = 60°.</li><li>C corresponde a F → F = <b>60°</b>. (Zoom não muda ângulo!)</li></ol></div>
<h3>Caso 6 — São semelhantes ou não? (LLL)</h3>
<div class="ex"><b>Triângulos 4, 6, 8 e 6, 9, 12:</b> 6÷4 = 1,5; 9÷6 = 1,5; 12÷8 = 1,5 → <b>sim</b>, k = 1,5.<br><b>Triângulos 3, 4, 5 e 6, 8, 11:</b> 6÷3 = 2; 8÷4 = 2; 11÷5 = 2,2 → <b>não</b> (uma razão é diferente).</div>
<h3>Caso 7 — Perímetro e área</h3>
<p>Se os lados ficam multiplicados por <b>k</b>:</p>
<ul><li>o <b>perímetro</b> (soma de lados) também fica multiplicado por <b>k</b>;</li><li>a <b>área</b> fica multiplicada por <b>k²</b>, porque área é “comprimento × comprimento” (base × altura, e as duas cresceram k vezes).</li></ul>
<div class="ex">k = 3, perímetro do menor 12 cm, área do menor 5 cm².<br>Perímetro do maior = 12 × 3 = <b>36 cm</b>.<br>Área do maior = 5 × 3² = 5 × 9 = <b>45 cm²</b> (e não 15!).<br><b>Ao contrário:</b> áreas 8 e 72 → razão 72 ÷ 8 = 9 = k² → <b>k = 3</b>.</div>
<h3>Caso 8 — Escala, mapas e maquetes</h3>
<div class="ex">Maquete na escala 1 : 100 e uma parede de 7 cm na maquete → real: 7 × 100 = 700 cm = <b>7 m</b>.<br>É semelhança com k = 100.</div>
<h3>Erros comuns</h3><ul><li>Comparar lados que <b>não</b> correspondem (sempre ache os ângulos iguais primeiro).</li><li>No triângulo dentro do outro, usar DB em vez do lado inteiro AB.</li><li>Achar que a área cresce k vezes (cresce <b>k²</b>).</li><li>Achar que iguais ângulos implicam lados iguais. Não: lados <b>proporcionais</b>.</li></ul>
<p class="tip"><b>Resumo:</b> semelhança = zoom · ângulos iguais, lados × k · casos AA, LAL, LLL · perímetro × k, área × k² · sempre ache “quem corresponde a quem” antes de montar a proporção.</p>`;

TEORIA['tales-semelhanca']=`
<h3>A ideia</h3>
<p>Imagine as <b>linhas de um caderno</b> (retas paralelas) e duas réguas atravessando essas linhas, uma mais deitada que a outra. As réguas cortam as linhas em pedaços. O Teorema de Tales diz: <b>os pedaços de uma régua são proporcionais aos da outra</b>. Se numa régua o 2º pedaço é o dobro do 1º, na outra também será.</p>
${SVG_TALES}
<p class="big">{a/b} = {c/d}</p>
<p>As retas paralelas (r, s, t) formam um <b>feixe</b>. As duas retas que cortam são as <b>transversais</b>.</p>
<h3>A receita</h3>
<ol><li>Identifique as paralelas e as duas transversais.</li><li>Monte a proporção <b>na mesma ordem</b> nas duas transversais: {de cima/de baixo} = {de cima/de baixo}.</li><li>Multiplique cruzado e resolva a equação.</li></ol>
<h3>Caso 1 — Achar um segmento</h3>
<div class="ex">a = 4, b = 6, c = 10 e d = x.<ol><li>{4/6} = {10/x}.</li><li>4x = 60 → x = <b>15</b>.</li></ol>
<b>Confere pelo “quantas vezes”:</b> de 4 para 10 multiplicou por 2,5; de 6 para 15 também ✓</div>
<h3>Caso 2 — Com x nos dois segmentos</h3>
<div class="ex">Numa transversal 3 e 5; na outra x e x + 4.<ol><li>{3/5} = {x/x + 4}.</li><li>Multiplique cruzado: 3(x + 4) = 5x → 3x + 12 = 5x.</li><li>12 = 2x → x = <b>6</b> (os segmentos são 6 e 10).</li></ol></div>
<h3>Caso 3 — Dividir um total na mesma proporção</h3>
<div class="ex">Numa transversal os pedaços são 2 e 3. Na outra, o total é 20. Quanto mede cada pedaço?<ol><li>Total da 1ª: 2 + 3 = 5.</li><li>Quantas vezes maior: 20 ÷ 5 = 4.</li><li>Pedaços: 2 × 4 = <b>8</b> e 3 × 4 = <b>12</b>.</li></ol></div>
<h3>Caso 4 — Tales dentro do triângulo</h3>
${SVG_ENC}
<p>Uma reta paralela a um lado divide os outros dois lados na <b>mesma proporção</b>: {AD/DB} = {AE/EC}.</p>
<div class="ex">AD = 4, DB = 6, AE = 6. Quanto mede EC?<ol><li>{4/6} = {6/x}.</li><li>4x = 36 → x = <b>9</b>.</li></ol></div>
<h3>Caso 5 — Problema com terrenos</h3>
<div class="ex">Dois lotes têm frentes de 20 m e 30 m para a Rua A; as divisas laterais são paralelas. Para a Rua B, a frente total é 75 m.<ol><li>Total na Rua A: 50 m. Razão: 75 ÷ 50 = 1,5.</li><li>Frentes na Rua B: 20 × 1,5 = <b>30 m</b> e 30 × 1,5 = <b>45 m</b>.</li></ol></div>
<h3>Erros comuns</h3><ul><li>Inverter a ordem na proporção ({cima/baixo} numa e {baixo/cima} na outra).</li><li>Usar Tales quando as retas <b>não</b> são paralelas (aí não vale).</li><li>Esquecer os parênteses ao multiplicar cruzado com x + algo.</li></ul>
<p class="tip"><b>Ligação:</b> Tales é a base da <b>semelhança de triângulos</b> (veja o assunto “Semelhança de triângulos”, logo depois deste).</p>`;
