<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
:root{--navy:#0E1B3D;--navy2:#1A2C5C;--line:#DDE3F0;--bg:#F5F7FC;--card:#FFFFFF;--ink:#14213D;--muted:#55627F;--accent:#FFC93C;--accent2:#FFE7A3;--ok:#128C4A;--okbg:#E6F5EC}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;font-size:17px;line-height:1.55}
button{font:inherit;cursor:pointer}
a{color:inherit}
header{background:var(--navy);color:#fff;padding:22px 20px 26px;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:36px 36px}
.wrap{max-width:980px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}

.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{padding:7px 14px;border-radius:999px;border:2px solid rgba(255,255,255,.25);background:transparent;color:#fff;font-size:14px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--navy)}

.area{margin-top:26px}

.tcard{display:flex;flex-direction:column;gap:6px;padding:16px 18px;background:var(--card);border:2px solid var(--line);border-radius:18px;text-decoration:none;min-height:88px;transition:border-color .15s,transform .15s}

.big{font-size:22px;text-align:center}

.btn.gold{background:var(--accent);border-color:var(--accent);color:var(--navy)}
.btn:disabled{opacity:.4;cursor:default}

.qnum{font-weight:900;color:var(--muted);font-size:15px;letter-spacing:.08em}

.qtext{font-size:22px;font-weight:700;line-height:1.5}
.answer{margin-top:20px;border-radius:16px;background:var(--okbg);padding:18px}

.steps{margin:12px 0 0;padding-left:22px}
.steps li{margin:6px 0;font-size:17px}
.qnav{display:flex;gap:10px;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.qitem{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 20px}
.qitem .qtext{font-size:19px}

.qitem .answer .ans{font-size:19px}

footer{text-align:center;color:var(--muted);font-size:13px;padding:20px}
@media (max-width:600px){.panel{padding:18px}.qtext{font-size:19px}main{padding:18px 14px 50px}}

<script>
/* ===== núcleo: aleatório com semente, formatação e frações ===== */
var TOPICS = [];
var MINUS = '−';
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){var h=2166136261;for(var k=0;k<s.length;k++){h^=s.charCodeAt(k);h=Math.imul(h,16777619);}return h>>>0;}
function R(seed){
  var f=mulberry32(seed);
  var o={f:f};
  o.i=function(a,b){return a+Math.floor(f()*(b-a+1));};
  o.p=function(arr){return arr[Math.floor(f()*arr.length)];};
  o.nz=function(a,b){var x;do{x=o.i(a,b);}while(x===0);return x;};
  o.sh=function(arr){var c=arr.slice();for(var k=c.length-1;k>0;k--){var j=Math.floor(f()*(k+1));var t=c[k];c[k]=c[j];c[j]=t;}return c;};
  o.s=function(){return f()<0.5?-1:1;};
  return o;
}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function rnd(x,dp){var m=Math.pow(10,dp===undefined?6:dp);return Math.round(x*m)/m;}
/* número no formato brasileiro (vírgula decimal) */
function n(x,dp){
  if(dp===undefined) dp=4;
  x=rnd(x,dp); if(Object.is(x,-0)) x=0;
  var a=Math.abs(x), parts=String(a).split('.');
  var ip=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  if(parts[0].length<=4) ip=parts[0];
  var s=ip+(parts[1]?','+parts[1]:'');
  return (x<0?MINUS:'')+s;
}
function p(x){return x<0?'('+n(x)+')':n(x);}
function money(x){var s=rnd(x,2).toFixed(2).split('.');var ip=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return 'R$ '+ip+','+s[1];}
/* frações */
function Q(a,b){if(b===undefined)b=1;if(b<0){a=-a;b=-b;}var g=gcd(a,b)||1;return {n:a/g,d:b/g};}
function qa(x,y){return Q(x.n*y.d+y.n*x.d,x.d*y.d);}
function qs(x,y){return Q(x.n*y.d-y.n*x.d,x.d*y.d);}
function qm(x,y){return Q(x.n*y.n,x.d*y.d);}
function qd(x,y){return Q(x.n*y.d,x.d*y.n);}
function F(a,b){if(typeof a!=='number'||typeof b!=='number')return '<span class="fr"><span>'+a+'</span><span>'+b+'</span></span>';var neg=(a<0)!==(b<0);a=Math.abs(a);b=Math.abs(b);return (neg&&a!==0?MINUS:'')+'<span class="fr"><span>'+a+'</span><span>'+b+'</span></span>';}
function FQ(q){return q.d===1?n(q.n):F(q.n,q.d);}
function pFQ(q){return q.n<0?'('+FQ(q)+')':FQ(q);}
/* polinômio: [[coef,'x²'],[coef,'x'],[coef,'']] */
function poly(terms){
  var s='';
  terms.forEach(function(t){
    var c=t[0],v=t[1];if(c===0)return;
    var a=Math.abs(c);var cs=(a===1&&v)?'':n(a);
    if(s===''){s=(c<0?MINUS:'')+cs+v;}else{s+=(c<0?' − ':' + ')+cs+v;}
  });
  return s||'0';
}
function sup(e){return '<sup>'+e+'</sup>';}
function raiz(x){return '√<span class="ov">'+x+'</span>';}
function mix(i,fns){return fns[i%fns.length]();}
function topic(t){TOPICS.push(t);}
function lista(t,seed){
  var r=R(hashStr(t.id)+(seed||0)*7919);var out=[],seen={},tries=0;
  while(out.length<20&&tries<600){tries++;var g=t.gen(r,tries-1);if(seen[g.q])continue;seen[g.q]=1;out.push(g);}
  return out;
}

/* ===== NÚMEROS ===== */
function fact(x){var f=[],d=2;while(x>1){var e=0;while(x%d===0){x/=d;e++;}if(e)f.push([d,e]);d++;}return f;}
function factStr(x){return fact(x).map(function(t){return t[0]+(t[1]>1?sup(t[1]):'');}).join(' × ');}
function divisores(x){var d=[];for(var k=1;k<=x;k++)if(x%k===0)d.push(k);return d;}
function isPrime(x){if(x<2)return false;for(var k=2;k*k<=x;k++)if(x%k===0)return false;return true;}
function moneyS(x){return (x<0?MINUS:'')+money(Math.abs(x));}
function ps(x){return x>0?'(+'+x+')':'('+n(x)+')';}
var ORDENS=['unidades','dezenas','centenas','unidades de milhar','dezenas de milhar','centenas de milhar','unidades de milhão'];

topic({id:'sistema-numeracao',nome:'Sistema de numeração decimal',ano:'6º ano',area:'Números',
tags:'valor posicional ordem classe decomposição arredondamento algarismo',
teoria:'<p>Usamos 10 algarismos (0 a 9). O <b>valor de um algarismo depende da posição</b> que ele ocupa: cada posição vale 10 vezes a posição à sua direita.</p><table class="t"><tr><th>Classe dos milhões</th><th colspan="3">Classe dos milhares</th><th colspan="3">Classe das unidades simples</th></tr><tr><td>U. milhão</td><td>C. milhar</td><td>D. milhar</td><td>U. milhar</td><td>Centena</td><td>Dezena</td><td>Unidade</td></tr></table><ul><li><b>Valor absoluto</b>: o próprio algarismo. <b>Valor posicional (relativo)</b>: algarismo × valor da posição.</li><li><b>Decompor</b> é escrever o número como soma dos valores posicionais: 4.705 = 4 × 1000 + 7 × 100 + 5.</li><li><b>Arredondar</b>: olhe o algarismo logo à direita da ordem pedida. Se for 5 ou mais, aumenta 1; se for menor que 5, mantém. O resto vira zero.</li></ul><div class="ex"><b>Exemplo:</b> em 36.482, o 6 está nas unidades de milhar e vale 6.000. Arredondando para a centena: 36.500 (porque o 8 ≥ 5).</div>',
gen:function(r,i){return mix(i,[
function(){var len=r.i(5,7),N=r.i(Math.pow(10,len-1),Math.pow(10,len)-1);var s=String(N);var pos;do{pos=r.i(0,len-1);}while(s[len-1-pos]==='0');var d=+s[len-1-pos];
 var shown=n(N);var cnt=-1,html='';for(var k=shown.length-1;k>=0;k--){var ch=shown[k];if(ch!=='.')cnt++;html=((ch!=='.'&&cnt===pos)?'<b class="hl">'+ch+'</b>':ch)+html;}
 return {q:'No número '+html+', qual é o valor posicional do algarismo destacado?',a:n(d*Math.pow(10,pos)),s:'O '+d+' está na ordem das '+ORDENS[pos]+', então vale '+d+' × '+n(Math.pow(10,pos))+' = '+n(d*Math.pow(10,pos))+'.'};},
function(){var parts=[],N=0;var ex=r.sh([0,1,2,3,4,5]).slice(0,r.i(3,4)).sort(function(a,b){return b-a;});ex.forEach(function(e){var d=r.i(1,9);N+=d*Math.pow(10,e);parts.push(d+' × '+n(Math.pow(10,e)));});
 return {q:'Qual número é representado por '+parts.join(' + ')+'?',a:n(N),s:'Somando os valores posicionais: '+ex.map(function(e,k){return n(+parts[k].split(' × ')[0]*Math.pow(10,e));}).join(' + ')+' = '+n(N)+'.'};},
function(){var N=r.i(1000,99999);var ord=r.p([[10,'dezena'],[100,'centena'],[1000,'unidade de milhar']]);var R_=Math.round(N/ord[0])*ord[0];var dig=Math.floor(N/(ord[0]/10))%10;
 return {q:'Arredonde '+n(N)+' para a '+ord[1]+' mais próxima.',a:n(R_),s:'O algarismo à direita da '+ord[1]+' é '+dig+(dig>=5?' (≥ 5), então aumentamos 1':' (< 5), então mantemos')+'. Resultado: '+n(R_)+'.'};},
function(){var N=r.i(1001,99999);var s=String(N),parts=[];for(var k=0;k<s.length;k++){var d=+s[k],e=s.length-1-k;if(d)parts.push(e===0?String(d):d+' × '+n(Math.pow(10,e)));}
 return {q:'Decomponha o número '+n(N)+' usando potências de 10 (ex.: 3 × 100).',a:parts.join(' + '),s:'Cada algarismo diferente de zero vezes o valor da sua posição.'};}
]);}});

topic({id:'expressoes-numericas',nome:'Expressões numéricas',ano:'6º ano',area:'Números',
tags:'ordem das operações parênteses colchetes chaves prioridade',
teoria:'<p>Para resolver uma expressão numérica siga sempre esta ordem:</p><ol><li>Resolva o que está dentro de <b>( )</b>, depois <b>[ ]</b>, depois <b>{ }</b>.</li><li>Dentro de cada um: primeiro <b>potências e raízes</b>;</li><li>depois <b>multiplicações e divisões</b>, na ordem em que aparecem (da esquerda para a direita);</li><li>por último <b>adições e subtrações</b>, também da esquerda para a direita.</li></ol><div class="ex"><b>Exemplo:</b> 20 − 3 × 4 + 8 ÷ 2 = 20 − 12 + 4 = 12.<br>[10 + (6 − 2) × 3] ÷ 2 = [10 + 4 × 3] ÷ 2 = [10 + 12] ÷ 2 = 22 ÷ 2 = 11.</div><p class="tip">Erro comum: fazer 20 − 3 = 17 antes da multiplicação. Multiplicação vem antes!</p>',
gen:function(r,i){return mix(i,[
function(){var a=r.i(2,30),b=r.i(2,12),c=r.i(2,12);return {q:'Calcule: '+a+' + '+b+' × '+c,a:n(a+b*c),s:'Primeiro a multiplicação: '+b+' × '+c+' = '+(b*c)+'. Depois: '+a+' + '+(b*c)+' = '+(a+b*c)+'.'};},
function(){var a=r.i(3,12),b=r.i(3,12),d=r.i(2,9),q=r.i(2,10),c=d*q;var v=a*b-q;return {q:'Calcule: '+a+' × '+b+' − '+c+' ÷ '+d,a:n(v),s:a+' × '+b+' = '+(a*b)+' e '+c+' ÷ '+d+' = '+q+'. Então '+(a*b)+' − '+q+' = '+n(v)+'.'};},
function(){var a=r.i(2,15),b=r.i(2,15),c=r.i(2,9),d=r.i(1,(a+b)*c-1);var v=(a+b)*c-d;return {q:'Calcule: ('+a+' + '+b+') × '+c+' − '+d,a:n(v),s:'Parênteses: '+a+' + '+b+' = '+(a+b)+'. Depois '+(a+b)+' × '+c+' = '+((a+b)*c)+'. Por fim '+((a+b)*c)+' − '+d+' = '+v+'.'};},
function(){var e=r.i(2,6),q=r.i(3,12),inner=e*q,d=r.i(2,5),kmax=Math.min(6,Math.floor((inner-1)/d));if(kmax<1){kmax=1;inner=d+e*Math.ceil((d+1)/e);q=inner/e;}var k=r.i(1,kmax),a=inner-k*d;if(a<1){a=1;inner=a+k*d;}
 var c=r.i(1,9),b=c+k;if(inner%e!==0){e=1;q=inner;}
 return {q:'Calcule: ['+a+' + ('+b+' − '+c+') × '+d+'] ÷ '+e,a:n(inner/e),s:'('+b+' − '+c+') = '+k+'; '+k+' × '+d+' = '+(k*d)+'; ['+a+' + '+(k*d)+'] = '+inner+'; '+inner+' ÷ '+e+' = '+n(inner/e)+'.'};},
function(){var a=r.i(2,5),b=r.i(2,3),c=r.i(2,9),d=r.i(1,20);var v=Math.pow(a,b)+c*d;return {q:'Calcule: '+a+sup(b)+' + '+c+' × '+d,a:n(v),s:'Potência primeiro: '+a+sup(b)+' = '+Math.pow(a,b)+'. Multiplicação: '+c+' × '+d+' = '+(c*d)+'. Soma: '+v+'.'};}
]);}});

topic({id:'potenciacao',nome:'Potenciação',ano:'6º ano',area:'Números',
tags:'potência expoente base quadrado cubo potências de 10',
teoria:'<p>Potência é uma multiplicação de fatores iguais: <b>a<sup>n</sup> = a × a × … × a</b> (n vezes). <i>a</i> é a <b>base</b> e <i>n</i> o <b>expoente</b>.</p><ul><li>a<sup>1</sup> = a &nbsp;&nbsp; a<sup>0</sup> = 1 (a ≠ 0)</li><li>Quadrado: a<sup>2</sup>; cubo: a<sup>3</sup>.</li><li>10<sup>n</sup> = 1 seguido de n zeros.</li></ul><p><b>Propriedades</b> (mesma base):</p><ul><li>a<sup>m</sup> × a<sup>n</sup> = a<sup>m+n</sup> (conserva a base, soma expoentes)</li><li>a<sup>m</sup> ÷ a<sup>n</sup> = a<sup>m−n</sup> (subtrai expoentes)</li><li>(a<sup>m</sup>)<sup>n</sup> = a<sup>m×n</sup></li></ul><div class="ex"><b>Exemplo:</b> 2<sup>5</sup> = 2×2×2×2×2 = 32. &nbsp; 3<sup>4</sup> × 3<sup>2</sup> = 3<sup>6</sup>.</div><p class="tip">Cuidado: 2<sup>3</sup> não é 2 × 3! É 2 × 2 × 2 = 8.</p>',
gen:function(r,i){return mix(i,[

teoria:'<p><b>Número racional</b> (ℚ) é todo número que pode ser escrito como fração <span class="fr"><span>a</span><span>b</span></span> com a e b inteiros e b ≠ 0: inteiros, frações, decimais exatos e dízimas periódicas.</p><ul><li>As regras de frações (MMC, multiplicar em linha, inverter na divisão) valem junto com a <b>regra de sinais</b> dos inteiros.</li><li><span class="fr"><span>−a</span><span>b</span></span> = <span class="fr"><span>a</span><span>−b</span></span> = −<span class="fr"><span>a</span><span>b</span></span>.</li></ul><div class="ex"><b>Exemplo:</b> −<span class="fr"><span>2</span><span>3</span></span> + <span class="fr"><span>1</span><span>4</span></span> = −<span class="fr"><span>8</span><span>12</span></span> + <span class="fr"><span>3</span><span>12</span></span> = −<span class="fr"><span>5</span><span>12</span></span>.</div>',
gen:function(r,i){function rf(){var b=r.i(2,9),a=r.nz(-9,9);return Q(a,b);}return mix(i,[
function(){var x=rf(),y=rf();var m=lcm(x.d,y.d),A=x.n*m/x.d,B=y.n*m/y.d;return {q:'Calcule: '+FQ(x)+' + '+pFQ(y),a:FQ(qa(x,y)),s:['Ache o denominador comum (MMC de '+x.d+' e '+y.d+'): '+m+'.','Reescreva as frações com denominador '+m+': '+F(A,m)+' e '+F(B,m)+'.','Some os numeradores com a regra de sinais: '+n(A)+' + '+p(B)+' = '+n(A+B)+' → '+F(A+B,m)+'.'].concat(qa(x,y).d!==m?['Simplifique: '+FQ(qa(x,y))+'.']:[])};},
function(){var x=rf(),y=rf();return {q:'Calcule: '+pFQ(x)+' × '+pFQ(y),a:FQ(qm(x,y)),s:'Multiplica em linha e aplica a regra de sinais: '+FQ(qm(x,y))+'.'};},
function(){var x=rf(),y=rf();return {q:'Calcule: '+pFQ(x)+' ÷ '+pFQ(y),a:FQ(qd(x,y)),s:'Inverte a segunda: '+pFQ(x)+' × '+pFQ(Q(y.d,y.n))+' = '+FQ(qd(x,y))+'.'};},
function(){var a=r.nz(-99,99)/10,b=r.nz(-999,999)/100;return {q:'Calcule: '+n(a)+' + '+p(b),a:n(rnd(a+b,2)),s:'Regra de sinais da adição com vírgula alinhada: '+n(rnd(a+b,2))+'.'};},
function(){var x=Q(-r.i(1,8),r.i(2,9)),y;do{y=Q(-r.i(1,8),r.i(2,9));}while(y.n*x.d===x.n*y.d);var big=(x.n/x.d>y.n/y.d)?x:y;return {q:'Qual é maior: '+FQ(x)+' ou '+FQ(y)+'?',a:FQ(big),s:'Entre negativos, é maior o de menor módulo: '+n(Math.abs(x.n/x.d),3)+' e '+n(Math.abs(y.n/y.d),3)+'.'};}
]);}});

/* ===== NÚMEROS (8º e 9º) + PROPORCIONALIDADE ===== */
function simpRad(x){var k=1,b=x;for(var d=2;d*d<=b;d++){while(b%(d*d)===0){b/=d*d;k*=d;}}return [k,b];}
function rad(k,b){if(b===1)return n(k);return (k===1?'':(k===-1?MINUS:n(k)))+'√'+b;}

topic({id:'potencias-propriedades',nome:'Potências: expoente negativo e propriedades',ano:'8º ano',area:'Números',
tags:'potência expoente negativo expoente zero propriedades base fracionária',
teoria:'<ul><li><b>Expoente negativo</b>: inverte a base e troca o sinal do expoente. a<sup>−n</sup> = <span class="fr"><span>1</span><span>a<sup>n</sup></span></span>. Ex.: 2<sup>−3</sup> = <span class="fr"><span>1</span><span>8</span></span>.</li><li><b>Fração com expoente negativo</b>: (<span class="fr"><span>a</span><span>b</span></span>)<sup>−n</sup> = (<span class="fr"><span>b</span><span>a</span></span>)<sup>n</sup>.</li><li><b>Fração elevada</b>: eleva numerador e denominador. (<span class="fr"><span>2</span><span>3</span></span>)<sup>2</sup> = <span class="fr"><span>4</span><span>9</span></span>.</li><li>Propriedades (mesma base): a<sup>m</sup>·a<sup>n</sup> = a<sup>m+n</sup>; a<sup>m</sup> ÷ a<sup>n</sup> = a<sup>m−n</sup>; (a<sup>m</sup>)<sup>n</sup> = a<sup>m·n</sup>. Valem também com expoentes negativos.</li><li>Produto com mesmo expoente: a<sup>n</sup>·b<sup>n</sup> = (a·b)<sup>n</sup>.</li></ul>',
gen:function(r,i){return mix(i,[
function(){var a=r.i(2,10),e=r.i(1,3);if(a>5)e=r.i(1,2);var v=Math.pow(a,e);return {q:'Calcule '+a+sup(MINUS+e)+'.',a:F(1,v),s:['Expoente negativo: viramos a base de cabeça para baixo e o expoente fica positivo.',a+sup(MINUS+e)+' = '+F(1,a+sup(e)),a+sup(e)+' = '+v+', então a resposta é '+F(1,v)+'.']};},
function(){var a=r.i(1,5),b;do{b=r.i(2,6);}while(gcd(a,b)!==1||a===b);var e=r.i(1,3);var res=Q(Math.pow(b,e),Math.pow(a,e));return {q:'Calcule ('+F(a,b)+')'+sup(MINUS+e)+'.',a:FQ(res),s:['Inverte a fração e o expoente fica positivo: ('+F(b,a)+')'+sup(e)+'.','Eleva em cima e embaixo: '+F(b+sup(e),a+sup(e))+' = '+FQ(res)+'.']};},
function(){var a=r.i(1,5),b;do{b=r.i(2,7);}while(gcd(a,b)!==1);var e=r.i(2,3);return {q:'Calcule ('+F(a,b)+')'+sup(e)+'.',a:F(Math.pow(a,e),Math.pow(b,e)),s:['Eleva o numerador: '+a+sup(e)+' = '+Math.pow(a,e)+'.','Eleva o denominador: '+b+sup(e)+' = '+Math.pow(b,e)+'.','Resultado: '+F(Math.pow(a,e),Math.pow(b,e))+'.']};},
function(){var a=r.i(2,9),m=r.nz(-6,6),k=r.nz(-6,6);return {q:'Escreva como uma única potência: '+a+sup(m<0?MINUS+(-m):m)+' × '+a+sup(k<0?MINUS+(-k):k),a:a+sup((m+k)<0?MINUS+(-(m+k)):(m+k)),s:['Mesma base multiplicando: conserva a base e <b>soma</b> os expoentes.',n(m)+' + '+p(k)+' = '+n(m+k)+'.']};},
function(){var a=r.i(2,9),m=r.nz(-5,8),k=r.nz(-5,8);return {q:'Escreva como uma única potência: '+a+sup(n(m))+' ÷ '+a+sup(n(k)),a:a+sup(n(m-k)),s:['Mesma base dividindo: conserva a base e <b>subtrai</b> os expoentes.',n(m)+' − '+p(k)+' = '+n(m-k)+'.']};},
function(){var a=r.i(2,7),m=r.nz(-4,5),k=r.nz(-3,4);return {q:'Escreva como uma única potência: ('+a+sup(n(m))+')'+sup(n(k)),a:a+sup(n(m*k)),s:['Potência de potência: <b>multiplica</b> os expoentes.',n(m)+' × '+p(k)+' = '+n(m*k)+'.']};}
]);}});

topic({id:'notacao-cientifica',nome:'Notação científica',ano:'8º ano',area:'Números',
tags:'notação científica potência de 10 números muito grandes muito pequenos',
teoria:'<p>Um número está em <b>notação científica</b> quando escrito como <b>a × 10<sup>n</sup></b>, com <b>1 ≤ a &lt; 10</b> (um único algarismo diferente de zero antes da vírgula) e n inteiro.</p><ul><li><b>Número grande</b>: a vírgula anda para a esquerda → expoente positivo. 45.000.000 = 4,5 × 10<sup>7</sup>.</li><li><b>Número pequeno</b>: a vírgula anda para a direita → expoente negativo. 0,00032 = 3,2 × 10<sup>−4</sup>.</li><li>O expoente é <b>quantas casas a vírgula andou</b>.</li><li><b>Multiplicar</b>: multiplica os números e soma os expoentes; se passar de 10, ajusta.</li></ul><div class="ex"><b>Exemplo:</b> (3 × 10<sup>4</sup>) × (5 × 10<sup>2</sup>) = 15 × 10<sup>6</sup> = 1,5 × 10<sup>7</sup>.</div>',
gen:function(r,i){function mant(){var M=r.f()<0.4?r.i(1,9):r.i(11,99);if(M%10===0)M+=1;return M;}function ms(M){return M<10?String(M):String(M)[0]+','+String(M)[1];}
return mix(i,[
function(){var M=mant(),k=r.i(3,9);var N=M<10?M*Math.pow(10,k):M*Math.pow(10,k-1);return {q:'Escreva '+n(N,0)+' em notação científica.',a:ms(M)+' × 10'+sup(k),s:['Coloque a vírgula logo depois do primeiro algarismo: '+ms(M)+'.','Conte quantas casas a vírgula andou para a esquerda: '+k+'.','Número grande → expoente positivo: '+ms(M)+' × 10'+sup(k)+'.']};},
function(){var M=mant(),k=r.i(2,7);var str='0,'+Array(k).join('0')+String(M);return {q:'Escreva '+str+' em notação científica.',a:ms(M)+' × 10'+sup(MINUS+k),s:['Ande com a vírgula para a direita até ficar um algarismo (diferente de zero) antes dela: '+ms(M)+'.','Ela andou '+k+' casas.','Número pequeno → expoente negativo: '+ms(M)+' × 10'+sup(MINUS+k)+'.']};},
function(){var M=mant(),k=r.i(2,6),neg=r.f()<0.5;var str=neg?'0,'+Array(k).join('0')+String(M):n(M<10?M*Math.pow(10,k):M*Math.pow(10,k-1),0);return {q:'Escreva na forma decimal: '+ms(M)+' × 10'+sup(neg?MINUS+k:k),a:str,s:['Expoente '+(neg?'negativo → a vírgula anda '+k+' casas para a esquerda.':'positivo → a vírgula anda '+k+' casas para a direita.'),'Complete com zeros: '+str+'.']};},
function(){var a=r.i(2,9),b=r.i(2,9),m=r.i(2,8),k=r.i(2,8);var pr=a*b,e=m+k;var ans=pr>=10?ms(pr)+' × 10'+sup(e+1):pr+' × 10'+sup(e);return {q:'Calcule em notação científica: ('+a+' × 10'+sup(m)+') × ('+b+' × 10'+sup(k)+')',a:ans,s:['Multiplique os números: '+a+' × '+b+' = '+pr+'.','Some os expoentes: '+m+' + '+k+' = '+e+' → '+pr+' × 10'+sup(e)+'.'].concat(pr>=10?['Como '+pr+' ≥ 10, ajuste: '+pr+' = '+ms(pr)+' × 10, então fica '+ms(pr)+' × 10'+sup(e+1)+'.']:[])};}
]);}});

topic({id:'dizimas',nome:'Dízimas periódicas e fração geratriz',ano:'8º ano',area:'Números',
tags:'dízima periódica fração geratriz período 0,333 decimal infinito',
teoria:'<p><b>Dízima periódica</b> é um decimal infinito em que um grupo de algarismos (o <b>período</b>) se repete. Ex.: 0,333…; 0,1515…; 2,777…</p><p><b>Fração geratriz</b> (a fração que gera a dízima):</p><ul><li><b>Simples</b> (o período começa logo após a vírgula): período sobre tantos <b>9</b> quantos algarismos tiver o período. 0,777… = <span class="fr"><span>7</span><span>9</span></span>; 0,2323… = <span class="fr"><span>23</span><span>99</span></span>.</li><li><b>Composta</b> (tem um pedaço que não repete, o anteperíodo): (anteperíodo e período juntos − anteperíodo) sobre (um 9 por algarismo do período e um 0 por algarismo do anteperíodo). 0,1666… = <span class="fr"><span>16 − 1</span><span>90</span></span> = <span class="fr"><span>15</span><span>90</span></span> = <span class="fr"><span>1</span><span>6</span></span>.</li><li>Com parte inteira: some a parte inteira à fração. 2,333… = 2 + <span class="fr"><span>3</span><span>9</span></span> = <span class="fr"><span>7</span><span>3</span></span>.</li></ul>',
gen:function(r,i){return mix(i,[
function(){var a=r.i(1,8);var res=Q(a,9);return {q:'Encontre a fração geratriz de 0,'+a+a+a+'…',a:FQ(res),s:['É uma dízima simples com período '+a+' (1 algarismo).','Coloca o período sobre um 9: '+F(a,9)+'.'].concat(res.d!==9?['Simplifica: '+FQ(res)+'.']:[])};},
function(){var ab;do{ab=r.i(10,98);}while(ab%11===0);var res=Q(ab,99);return {q:'Encontre a fração geratriz de 0,'+ab+ab+'…',a:FQ(res),s:['Período '+ab+' (2 algarismos) → denominador 99.',F(ab,99)+(res.d!==99?' = '+FQ(res)+' (simplificando)':'')+'.']};},
function(){var k=r.i(1,5),a=r.i(1,8);var res=Q(9*k+a,9);return {q:'Encontre a fração geratriz de '+k+','+a+a+a+'…',a:FQ(res),s:['Separe a parte inteira: '+k+' + 0,'+a+a+a+'…','0,'+a+a+a+'… = '+F(a,9)+'.',k+' + '+F(a,9)+' = '+F(9*k,9)+' + '+F(a,9)+' = '+F(9*k+a,9)+(res.d!==9?' = '+FQ(res):'')+'.']};},
function(){var b=r.i(1,9),a;do{a=r.i(1,9);}while(a===b);var num=10*b+a-b;var res=Q(num,90);return {q:'Encontre a fração geratriz de 0,'+b+a+a+a+'…',a:FQ(res),s:['Dízima composta: anteperíodo '+b+', período '+a+'.','Numerador: '+b+a+' − '+b+' = '+num+'.','Denominador: um 9 (período) e um 0 (anteperíodo) → 90.',F(num,90)+(res.d!==90?' = '+FQ(res):'')+'.']};}
]);}});

topic({id:'conjuntos-numericos',nome:'Conjuntos numéricos: naturais, inteiros, racionais, irracionais e reais',ano:'8º ano',area:'Números',
tags:'conjuntos numéricos naturais inteiros racionais irracionais reais ℕ ℤ ℚ 𝕀 ℝ',
teoria:'<ul><li><b>ℕ (naturais)</b>: 0, 1, 2, 3, …</li><li><b>ℤ (inteiros)</b>: naturais e seus negativos: …, −2, −1, 0, 1, 2, …</li><li><b>ℚ (racionais)</b>: podem ser escritos como fração de inteiros: inteiros, frações, decimais exatos e dízimas periódicas.</li><li><b>𝕀 (irracionais)</b>: decimais <b>infinitos e não periódicos</b>; não viram fração. Ex.: √2, √3, √5, π.</li><li><b>ℝ (reais)</b>: racionais e irracionais juntos.</li></ul><p>ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ e 𝕀 ⊂ ℝ.</p><p class="tip">√ de quadrado perfeito é racional (√16 = 4). √ de não-quadrado-perfeito é irracional.</p>',
gen:function(r,i){var pool=[['7','ℕ (natural)','7 é um número natural (e também inteiro, racional e real).'],['0','ℕ (natural)','0 é natural.'],['−5','ℤ (inteiro)','Negativo sem parte decimal: inteiro, não natural.'],['−12','ℤ (inteiro)','Inteiro negativo.'],[F(3,4),'ℚ (racional)','É uma fração de inteiros.'],[MINUS+F(2,5),'ℚ (racional)','Fração de inteiros, negativa.'],['0,25','ℚ (racional)','Decimal exato: 0,25 = 1/4.'],['0,333…','ℚ (racional)','Dízima periódica: 0,333… = 1/3.'],['√2','𝕀 (irracional)','2 não é quadrado perfeito; o decimal é infinito e não periódico.'],['√5','𝕀 (irracional)','5 não é quadrado perfeito.'],['π','𝕀 (irracional)','π = 3,14159… não tem período.'],['√16','ℕ (natural)','√16 = 4, que é natural.'],['−√9','ℤ (inteiro)','−√9 = −3.'],['√'+F(4,9),'ℚ (racional)','√(4/9) = 2/3.'],['2,5','ℚ (racional)','2,5 = 5/2.'],['1,4142135…(sem período)','𝕀 (irracional)','Infinito e não periódico.'],['−0,7','ℚ (racional)','Decimal exato.'],['√7','𝕀 (irracional)','7 não é quadrado perfeito.'],['√100','ℕ (natural)','√100 = 10.'],[F(10,2),'ℕ (natural)','10/2 = 5.'],['3√2','𝕀 (irracional)','Número vezes irracional continua irracional.'],['−'+F(8,4),'ℤ (inteiro)','−8/4 = −2.']];
return mix(i,[
function(){var it=r.p(pool);return {q:'Qual é o menor conjunto numérico ao qual '+it[0]+' pertence? (ℕ, ℤ, ℚ ou 𝕀)',a:it[1],s:[it[2]]};},
function(){var x=r.i(2,80);var sq=Math.sqrt(x)%1===0;return {q:raiz(x)+' é racional ou irracional?',a:sq?'Racional ('+raiz(x)+' = '+Math.sqrt(x)+')':'Irracional',s:[sq?x+' é quadrado perfeito ('+Math.sqrt(x)+sup(2)+' = '+x+').':x+' não é quadrado perfeito (fica entre '+Math.pow(Math.floor(Math.sqrt(x)),2)+' e '+Math.pow(Math.floor(Math.sqrt(x))+1,2)+'), então a raiz é um decimal infinito sem período.']};}
]);}});

topic({id:'radicais',nome:'Radicais: simplificação e operações',ano:'9º ano',area:'Números',
tags:'radical raiz simplificar soma de radicais multiplicar raízes racionalizar',
teoria:'<ul><li><b>Simplificar</b>: fatore o número e tire da raiz os fatores que formam quadrado. √50 = √(25 × 2) = 5√2.</li><li><b>Somar/subtrair</b>: só junta radicais <b>iguais</b> (mesmo índice e mesmo número dentro). 3√2 + 5√2 = 8√2. Às vezes é preciso simplificar antes: √8 + √2 = 2√2 + √2 = 3√2.</li><li><b>Multiplicar</b>: √a × √b = √(a·b). <b>Dividir</b>: √a ÷ √b = √(a/b).</li><li><b>Racionalizar</b>: tirar a raiz do denominador multiplicando em cima e embaixo pela raiz. <span class="fr"><span>6</span><span>√3</span></span> = <span class="fr"><span>6√3</span><span>3</span></span> = 2√3.</li></ul>',
gen:function(r,i){return mix(i,[
function(){var k=r.i(2,7),b=r.p([2,3,5,6,7,10]);var x=k*k*b;return {q:'Simplifique '+raiz(x)+'.',a:rad(k,b),s:['Procure o maior quadrado perfeito que divide '+x+': '+(k*k)+'.',raiz(x)+' = '+raiz((k*k)+' × '+b)+' = '+raiz(k*k)+' × '+raiz(b)+'.',raiz(k*k)+' = '+k+', então fica '+rad(k,b)+'.']};},
function(){var b=r.p([2,3,5,7]),a=r.i(1,9),c=r.i(1,9),d=r.i(1,9);var t=a+c-d;return {q:'Calcule: '+rad(a,b)+' + '+rad(c,b)+' − '+rad(d,b),a:t===0?'0':rad(t,b),s:['Todos têm √'+b+': é como somar "coisas iguais".','Some só os números da frente: '+a+' + '+c+' − '+d+' = '+t+'.','Resultado: '+(t===0?'0':rad(t,b))+'.']};},
function(){var b=r.p([2,3,5]),k=r.i(2,4),c=r.i(1,5);var x=k*k*b;return {q:'Calcule: '+raiz(x)+' + '+rad(c,b),a:rad(k+c,b),s:['Simplifique primeiro: '+raiz(x)+' = '+rad(k,b)+'.','Agora são radicais iguais: '+rad(k,b)+' + '+rad(c,b)+' = '+rad(k+c,b)+'.']};},
function(){var b=r.p([2,3,5,6,7]),m=r.i(1,4),k=r.i(1,4);var A=b*m*m,B=b*k*k;var res=simpRad(A*B);return {q:'Calcule: '+raiz(A)+' × '+raiz(B),a:rad(res[0],res[1]),s:['Junte numa raiz só: '+raiz(A+' × '+B)+' = '+raiz(A*B)+'.',A*B+' = '+(res[0]*res[0])+(res[1]>1?' × '+res[1]:'')+', então '+raiz(A*B)+' = '+rad(res[0],res[1])+'.']};},
function(){var b=r.p([2,3,5,6,7]),a=r.i(1,6)*(r.f()<0.6?b:1);var g=gcd(a,b);var num=a/g,den=b/g;var ans=den===1?rad(num,b):F(rad(num,b),den);return {q:'Racionalize: '+F(a,'√'+b),a:ans,s:['Multiplique em cima e embaixo por √'+b+'.',F(a+'√'+b,'√'+b+' × √'+b)+' = '+F(a+'√'+b,b)+'.'].concat(g>1?['Simplifique '+a+' com '+b+' (divide por '+g+'): '+ans+'.']:[])};}
]);}});

topic({id:'razao-proporcao',nome:'Razão e proporção',ano:'7º ano',area:'Números',
tags:'razão proporção escala divisão proporcional quarta proporcional propriedade fundamental',
teoria:'<ul><li><b>Razão</b> entre a e b é a divisão <span class="fr"><span>a</span><span>b</span></span> (ou a : b). Compara duas grandezas.</li><li><b>Proporção</b> é a igualdade entre duas razões: <span class="fr"><span>a</span><span>b</span></span> = <span class="fr"><span>c</span><span>d</span></span>.</li><li><b>Propriedade fundamental</b>: o produto dos meios é igual ao produto dos extremos: <b>a × d = b × c</b> ("multiplica cruzado").</li><li><b>Escala</b> = <span class="fr"><span>medida no desenho</span><span>medida real</span></span>. Escala 1 : 100.000 → 1 cm no mapa = 100.000 cm = 1 km.</li><li><b>Divisão proporcional</b>: some as partes, divida o total por essa soma e multiplique por cada parte.</li></ul>',

topic({id:'equacao-2-grau-incompleta',nome:'Equação do 2º grau incompleta',ano:'9º ano',area:'Álgebra',

teoria:'<p>Equação do 2º grau: <b>ax² + bx + c = 0</b> (a ≠ 0). É <b>incompleta</b> quando b = 0 ou c = 0.</p><ul><li><b>b = 0</b> (ax² + c = 0): isole x² e tire a raiz. Não esqueça do <b>±</b>! x² = 25 → x = 5 ou x = −5. Se x² der negativo, não há solução real.</li><li><b>c = 0</b> (ax² + bx = 0): coloque x em evidência: x(ax + b) = 0. Um produto é zero quando um dos fatores é zero: <b>x = 0</b> ou ax + b = 0.</li></ul><div class="ex"><b>Exemplo:</b> 3x² − 12x = 0 → 3x(x − 4) = 0 → x = 0 ou x = 4.</div>',
gen:function(r,i){return mix(i,[
function(){var a=r.p([1,1,2,3,4,5]),k=r.i(1,12);var c=a*k*k;return {q:'Resolva: '+(a===1?'':a)+'x² − '+c+' = 0',a:'x = '+k+' ou x = '+MINUS+k,s:['Isole o x²: '+(a===1?'':a)+'x² = '+c+(a>1?' → x² = '+c+' ÷ '+a+' = '+(k*k):'')+'.','Tire a raiz dos dois lados (com ±): x = ±'+raiz(k*k)+' = ±'+k+'.']};},
function(){var a=r.p([1,2,3,4,6]),b=r.nz(-12,12)*a;var x2=-b/a;return {q:'Resolva: '+quad(a,b,0)+' = 0',a:'x = 0 ou x = '+n(x2),s:['Coloque x em evidência: x('+lin(a,b)+') = 0.','Primeiro fator: x = 0.','Segundo fator: '+lin(a,b)+' = 0 → '+(a===1?'x = '+n(-b):a+'x = '+n(-b)+' → x = '+n(x2))+'.']};},
function(){var a=r.i(1,5),c=r.i(1,30)*a;return {q:'Resolva em ℝ: '+(a===1?'':a)+'x² + '+c+' = 0',a:'Não tem solução real',s:['Isole: '+(a===1?'':a)+'x² = −'+c+(a>1?' → x² = −'+(c/a):'')+'.','Nenhum número real elevado ao quadrado dá negativo. Solução: conjunto vazio.']};}
]);}});

topic({id:'equacao-2-grau',nome:'Equação do 2º grau completa (Bhaskara)',ano:'9º ano',area:'Álgebra',
tags:'equação segundo grau bhaskara delta discriminante raízes soma e produto',
teoria:'<p>Para <b>ax² + bx + c = 0</b>:</p><ol><li>Identifique <b>a</b>, <b>b</b> e <b>c</b> (com os sinais!).</li><li>Calcule o <b>delta</b>: <b>Δ = b² − 4ac</b>.<ul><li>Δ &gt; 0: duas raízes reais diferentes.</li><li>Δ = 0: duas raízes iguais (uma só).</li><li>Δ &lt; 0: não há raiz real.</li></ul></li><li>Aplique <b>Bhaskara</b>: <b>x = <span class="fr"><span>−b ± √Δ</span><span>2a</span></span></b></li></ol><div class="ex"><b>Exemplo:</b> x² − 5x + 6 = 0 → a = 1, b = −5, c = 6.<br>Δ = 25 − 24 = 1 → x = (5 ± 1)/2 → x = 3 ou x = 2.</div><p><b>Atalho (soma e produto)</b>: se a = 1, as raízes somam −b e multiplicam c.</p>',
gen:function(r,i){return mix(i,[
function(){var a=r.p([1,1,1,2,-1,3]),r1=r.i(-9,9),r2=r.i(-9,9);var b=-a*(r1+r2),c=a*r1*r2;var D=b*b-4*a*c,sq=Math.sqrt(D);var hi=Math.max(r1,r2),lo=Math.min(r1,r2);
 var st=['a = '+n(a)+', b = '+n(b)+', c = '+n(c)+'.','Δ = b² − 4ac = '+p(b)+'² − 4·'+p(a)+'·'+p(c)+' = '+(b*b)+' '+(4*a*c<0?'+ '+(-4*a*c):'− '+(4*a*c))+' = '+D+'.'];
 if(D===0){st.push('Δ = 0: uma raiz só. x = −b ÷ 2a = '+n(-b)+' ÷ '+p(2*a)+' = '+n(r1)+'.');return {q:'Resolva: '+quad(a,b,c)+' = 0',a:'x = '+n(r1)+' (raiz dupla)',s:st};}
 st.push('√Δ = '+sq+'.');st.push('x = ('+n(-b)+' ± '+sq+') ÷ '+p(2*a)+'.');st.push('x₁ = ('+n(-b)+' + '+sq+') ÷ '+p(2*a)+' = '+n((-b+sq)/(2*a))+'; x₂ = ('+n(-b)+' − '+sq+') ÷ '+p(2*a)+' = '+n((-b-sq)/(2*a))+'.');
 return {q:'Resolva: '+quad(a,b,c)+' = 0',a:'x = '+n(hi)+' ou x = '+n(lo),s:st};},
function(){var b=r.nz(-4,4),c;do{c=r.i(1,15);}while(b*b-4*c>=0);var D=b*b-4*c;return {q:'Resolva em ℝ: '+quad(1,b,c)+' = 0',a:'Não tem raízes reais (Δ = '+n(D)+')',s:['a = 1, b = '+n(b)+', c = '+c+'.','Δ = '+p(b)+'² − 4·1·'+c+' = '+(b*b)+' − '+(4*c)+' = '+n(D)+'.','Δ negativo: não existe raiz quadrada real de número negativo. Não há solução real.']};},
function(){var r1=r.i(-9,9),r2=r.i(-9,9);if(r1===r2)r2++;var S=r1+r2,P=r1*r2;return {q:'Usando soma e produto, encontre as raízes de '+quad(1,-S,P)+' = 0.',a:'x = '+n(Math.max(r1,r2))+' e x = '+n(Math.min(r1,r2)),s:['Com a = 1: soma das raízes = −b = '+n(S)+'; produto = c = '+n(P)+'.','Quais dois números somam '+n(S)+' e multiplicam '+n(P)+'? '+n(r1)+' e '+n(r2)+'.']};},
function(){var a=r.p([1,2]),r1=r.i(-6,6),r2=r.i(-6,6);var b=-a*(r1+r2),c=a*r1*r2;var D=b*b-4*a*c;return {q:'Calcule o Δ de '+quad(a,b,c)+' = 0 e diga quantas raízes reais a equação tem.',a:'Δ = '+D+'; '+(D>0?'duas raízes reais diferentes':'uma raiz real (dupla)'),s:['a = '+a+', b = '+n(b)+', c = '+n(c)+'.','Δ = '+p(b)+'² − 4·'+a+'·'+p(c)+' = '+D+'.',D>0?'Δ &gt; 0 → duas raízes.':'Δ = 0 → raízes iguais.']};}
]);}});

topic({id:'funcao-afim',nome:'Função afim (1º grau)',ano:'9º ano',area:'Álgebra',
tags:'função afim função do primeiro grau reta coeficiente angular linear zero da função crescente decrescente',
teoria:'<p><b>Função afim</b>: <b>f(x) = ax + b</b>, com a ≠ 0. O gráfico é uma <b>reta</b>.</p><ul><li><b>a</b> (coeficiente angular / taxa de variação): quanto y muda quando x aumenta 1. a &gt; 0 → <b>crescente</b>; a &lt; 0 → <b>decrescente</b>.</li><li><b>b</b> (coeficiente linear): onde a reta corta o eixo y (f(0) = b).</li><li><b>Zero (raiz)</b>: valor de x em que f(x) = 0. Resolve ax + b = 0 → x = −b/a.</li><li>Dados dois pontos: a = <span class="fr"><span>y₂ − y₁</span><span>x₂ − x₁</span></span>; depois b = y₁ − a·x₁.</li></ul><div class="ex"><b>Exemplo:</b> táxi cobra R$ 5 fixo + R$ 2 por km → f(x) = 2x + 5. Para 10 km: f(10) = 25.</div>',
gen:function(r,i){return mix(i,[
function(){var a=r.nz(-8,8),b=r.i(-10,10),x=r.i(-6,8);return {q:'Dada f(x) = '+lin(a,b)+', calcule f('+n(x)+').',a:n(a*x+b),s:['Troque x por '+n(x)+': f('+n(x)+') = '+n(a)+'·'+p(x)+(b?(b<0?' − '+(-b):' + '+b):'')+'.','= '+n(a*x)+(b?' + '+p(b):'')+' = '+n(a*x+b)+'.']};},
function(){var a=r.nz(-8,8),b=r.nz(-12,12);var z=Q(-b,a);return {q:'Qual é o zero (raiz) da função f(x) = '+lin(a,b)+'?',a:'x = '+FQ(z),s:['Faça f(x) = 0: '+lin(a,b)+' = 0.',poly([[a,'x']])+' = '+n(-b)+'.','x = '+n(-b)+' ÷ '+p(a)+' = '+FQ(z)+'.']};},
function(){var a=r.nz(-5,5),b=r.i(-8,8),x1=r.i(-4,3),x2=x1+r.i(1,4);var y1=a*x1+b,y2=a*x2+b;return {q:'Uma função afim passa pelos pontos ('+n(x1)+', '+n(y1)+') e ('+n(x2)+', '+n(y2)+'). Encontre a lei f(x) = ax + b.',a:'f(x) = '+lin(a,b),s:['a = (y₂ − y₁) ÷ (x₂ − x₁) = ('+n(y2)+' − '+p(y1)+') ÷ ('+n(x2)+' − '+p(x1)+') = '+n(y2-y1)+' ÷ '+(x2-x1)+' = '+n(a)+'.','b = y₁ − a·x₁ = '+n(y1)+' − '+p(a)+'·'+p(x1)+' = '+n(b)+'.']};},
function(){var a=r.nz(-9,9),b=r.i(-9,9);return {q:'A função f(x) = '+lin(a,b)+' é crescente ou decrescente?',a:a>0?'Crescente':'Decrescente',s:['Olhe o número que multiplica o x: a = '+n(a)+'.',a>0?'a positivo → quando x aumenta, y aumenta: crescente.':'a negativo → quando x aumenta, y diminui: decrescente.']};},
function(){var fx=r.i(3,8),pk=r.i(2,5),km=r.i(3,25);return {q:'Um táxi cobra '+money(fx)+' de bandeirada mais '+money(pk)+' por km rodado. Escreva a função e calcule o valor de uma corrida de '+km+' km.',a:'f(x) = '+pk+'x + '+fx+'; '+money(pk*km+fx),s:['Parte fixa (b) = '+fx+'; parte que depende do km (a) = '+pk+'.','f(x) = '+pk+'x + '+fx+'.','f('+km+') = '+pk+' × '+km+' + '+fx+' = '+(pk*km)+' + '+fx+' = '+money(pk*km+fx)+'.']};}
]);}});

topic({id:'funcao-quadratica',nome:'Função quadrática (2º grau)',ano:'9º ano',area:'Álgebra',
tags:'função quadrática segundo grau parábola vértice concavidade máximo mínimo',
teoria:'<p><b>Função quadrática</b>: <b>f(x) = ax² + bx + c</b>, a ≠ 0. O gráfico é uma <b>parábola</b>.</p><ul><li><b>a &gt; 0</b>: concavidade para cima (“sorriso”) → tem ponto de <b>mínimo</b>.</li><li><b>a &lt; 0</b>: concavidade para baixo → tem ponto de <b>máximo</b>.</li><li><b>Vértice</b>: x<sub>v</sub> = <span class="fr"><span>−b</span><span>2a</span></span> e y<sub>v</sub> = f(x<sub>v</sub>) (ou −Δ/4a).</li><li>Corta o eixo y em (0, c).</li><li>Corta o eixo x nas raízes (Bhaskara).</li></ul><div class="ex"><b>Exemplo:</b> f(x) = x² − 4x + 3: x<sub>v</sub> = 4/2 = 2; y<sub>v</sub> = 4 − 8 + 3 = −1. Vértice (2, −1), ponto de mínimo.</div>',
gen:function(r,i){return mix(i,[
function(){var a=r.p([1,1,-1,2,-2]),xv=r.i(-5,5),c=r.i(-9,9);var b=-2*a*xv;var yv=a*xv*xv+b*xv+c;return {q:'Encontre o vértice da parábola f(x) = '+quad(a,b,c)+'.',a:'V('+n(xv)+', '+n(yv)+')',s:['a = '+n(a)+', b = '+n(b)+', c = '+n(c)+'.','x<sub>v</sub> = −b ÷ 2a = '+n(-b)+' ÷ '+p(2*a)+' = '+n(xv)+'.','y<sub>v</sub> = f('+n(xv)+') = '+n(a)+'·'+p(xv)+'² '+(b<0?'− ':'+ ')+Math.abs(b)+'·'+p(xv)+' '+(c<0?'− '+(-c):'+ '+c)+' = '+n(yv)+'.']};},
function(){var a=r.nz(-5,5),b=r.i(-9,9),c=r.i(-9,9);return {q:'A parábola de f(x) = '+quad(a,b,c)+' tem concavidade para cima ou para baixo? Tem ponto de máximo ou de mínimo?',a:a>0?'Para cima; ponto de mínimo':'Para baixo; ponto de máximo',s:['Olhe o a (número do x²): '+n(a)+'.',a>0?'a &gt; 0 → “sorriso”, o vértice é o ponto mais baixo (mínimo).':'a &lt; 0 → “boca para baixo”, o vértice é o ponto mais alto (máximo).']};},
function(){var a=r.nz(-3,3),b=r.i(-6,6),c=r.i(-9,9),x=r.i(-4,4);var v=a*x*x+b*x+c;return {q:'Dada f(x) = '+quad(a,b,c)+', calcule f('+n(x)+').',a:n(v),s:['Substitua x por '+n(x)+' (entre parênteses).',n(a)+'·'+p(x)+'² = '+n(a*x*x)+'; '+n(b)+'·'+p(x)+' = '+n(b*x)+'.','Soma: '+n(a*x*x)+' + '+p(b*x)+' + '+p(c)+' = '+n(v)+'.']};},
function(){var a=r.nz(-4,4),b=r.i(-9,9),c=r.i(-15,15);return {q:'Em que ponto a parábola f(x) = '+quad(a,b,c)+' corta o eixo y?',a:'(0, '+n(c)+')',s:['No eixo y, x = 0.','f(0) = '+n(a)+'·0² + '+p(b)+'·0 + '+p(c)+' = '+n(c)+'.']};}
]);}});

topic({id:'sequencias',nome:'Sequências e padrões (progressões)',ano:'7º ano',area:'Álgebra',
tags:'sequência padrão regularidade termo geral progressão aritmética geométrica PA PG',
teoria:'<ul><li><b>Sequência</b>: lista ordenada que segue uma regra.</li><li><b>Progressão aritmética (PA)</b>: soma sempre o mesmo número (a <b>razão r</b>). 3, 7, 11, 15… (r = 4).<br>Termo geral: <b>a<sub>n</sub> = a<sub>1</sub> + (n − 1)·r</b>.</li><li><b>Progressão geométrica (PG)</b>: multiplica sempre pelo mesmo número (a razão q). 2, 6, 18, 54… (q = 3).</li><li>Em padrões de figuras, monte uma tabela (figura × quantidade) e descubra quanto aumenta de uma para a outra.</li></ul><div class="ex"><b>Exemplo:</b> 5, 8, 11, … qual o 20º termo? a<sub>20</sub> = 5 + 19 × 3 = 62.</div>',
gen:function(r,i){return mix(i,[
function(){var a=r.i(-10,20),d=r.nz(-7,9);var t=[0,1,2,3].map(function(k){return a+k*d;});return {q:'Qual é o próximo termo da sequência '+t.map(n).join(', ')+', …?',a:n(a+4*d),s:['De um termo para o outro soma-se '+n(d)+' (razão).',n(t[3])+' + '+p(d)+' = '+n(a+4*d)+'.']};},
function(){var a=r.i(-5,15),d=r.nz(-5,8),N=r.p([10,15,20,25,30,50,100]);return {q:'Na PA '+[0,1,2].map(function(k){return n(a+k*d);}).join(', ')+', …, qual é o '+N+'º termo?',a:n(a+(N-1)*d),s:['a₁ = '+n(a)+' e r = '+n(d)+'.','a<sub>'+N+'</sub> = a₁ + ('+N+' − 1)·r = '+n(a)+' + '+(N-1)+'·'+p(d)+'.','= '+n(a)+' + '+p((N-1)*d)+' = '+n(a+(N-1)*d)+'.']};},
function(){var a=r.i(1,5),q=r.p([2,3,-2,4]);var t=[0,1,2,3].map(function(k){return a*Math.pow(q,k);});return {q:'Qual é o próximo termo da sequência '+t.map(n).join(', ')+', …?',a:n(a*Math.pow(q,4)),s:['Cada termo é o anterior multiplicado por '+n(q)+' (PG).',n(t[3])+' × '+p(q)+' = '+n(a*Math.pow(q,4))+'.']};},
function(){var d=r.i(2,6),c=r.i(1,6),N=r.i(10,30);var t=[1,2,3].map(function(k){return d*k+c;});return {q:'Num padrão de palitos, a figura 1 tem '+t[0]+' palitos, a figura 2 tem '+t[1]+' e a figura 3 tem '+t[2]+'. Quantos palitos terá a figura '+N+'?',a:(d*N+c)+' palitos',s:['De uma figura para a outra aumentam '+d+' palitos.','Regra: palitos = '+d+' × (nº da figura) + '+c+' (confira: '+d+'·1 + '+c+' = '+t[0]+').','Figura '+N+': '+d+' × '+N+' + '+c+' = '+(d*N+c)+'.']};}
]);}});

var PI='3,14';
function solveX(k,v,x){return k===1?'x = '+n(v):poly([[k,'x']])+' = '+n(v)+' → x = '+n(v)+' ÷ '+p(k)+' = '+n(x);}
function plus(v){return v===0?'':v<0?' − '+(-v):' + '+v;}
function grau(x){return n(x)+'°';}
var POL={3:'triângulo',4:'quadrilátero',5:'pentágono',6:'hexágono',7:'heptágono',8:'octógono',9:'eneágono',10:'decágono',11:'undecágono',12:'dodecágono',15:'pentadecágono',20:'icoságono'};

topic({id:'angulos',nome:'Ângulos: complementares, suplementares e opostos pelo vértice',ano:'7º ano',area:'Geometria',
tags:'ângulo complementar suplementar opostos pelo vértice reto raso agudo obtuso adjacentes',
teoria:'<ul><li><b>Agudo</b>: menor que 90°. <b>Reto</b>: 90°. <b>Obtuso</b>: entre 90° e 180°. <b>Raso</b>: 180°.</li><li><b>Complementares</b>: somam <b>90°</b>. Complemento de x = 90° − x.</li><li><b>Suplementares</b>: somam <b>180°</b>. Suplemento de x = 180° − x.</li><li><b>Opostos pelo vértice</b> (formados por duas retas que se cruzam): são <b>iguais</b>.</li><li>Ângulos em volta de um ponto somam 360°.</li></ul><div class="ex"><b>Exemplo:</b> dois ângulos opostos pelo vértice medem 3x + 10° e 5x − 30°. Iguale: 3x + 10 = 5x − 30 → 40 = 2x → x = 20 → cada ângulo mede 70°.</div>',
gen:function(r,i){return mix(i,[
function(){var x=r.i(5,85);return {q:'Qual é o complemento de um ângulo de '+grau(x)+'?',a:grau(90-x),s:['Complementares somam 90°.','90° − '+x+'° = '+(90-x)+'°.']};},
function(){var x=r.i(5,175);return {q:'Qual é o suplemento de um ângulo de '+grau(x)+'?',a:grau(180-x),s:['Suplementares somam 180°.','180° − '+x+'° = '+(180-x)+'°.']};},
function(){var x=r.i(5,40),a,c;do{a=r.i(1,6);c=r.i(1,6);}while(a===c);var ang=r.i(30,150);var b=ang-a*x,d=ang-c*x;return {q:'Dois ângulos opostos pelo vértice medem ('+lin(a,b)+')° e ('+lin(c,d)+')°. Quanto vale x e quanto mede cada ângulo?',a:'x = '+x+'; cada ângulo mede '+ang+'°',s:['Opostos pelo vértice são iguais: '+lin(a,b)+' = '+lin(c,d)+'.',solveX(a-c,d-b,x)+'.','Ângulo: '+a+'·'+x+' '+(b<0?'− '+(-b):'+ '+b)+' = '+ang+'°.']};},
function(){var x=r.i(5,25),a=r.i(1,4),c=r.i(1,4);var b=r.i(-10,20),tot=r.p([90,180]);var d=tot-(a+c)*x-b;return {q:'Dois ângulos '+(tot===90?'complementares':'suplementares')+' medem ('+lin(a,b)+')° e ('+lin(c,d)+')°. Encontre x.',a:'x = '+x,s:['Eles somam '+tot+'°: '+lin(a,b)+' + '+lin(c,d)+' = '+tot+'.',poly([[a+c,'x']])+plus(b+d)+' = '+tot+'.',poly([[a+c,'x']])+' = '+(tot-b-d)+' → x = '+x+'.']};},
function(){var x=r.i(1,179);var t=x<90?'agudo':x===90?'reto':'obtuso';if(r.f()<0.15){x=90;t='reto';}return {q:'Classifique o ângulo de '+grau(x)+'.',a:t.charAt(0).toUpperCase()+t.slice(1),s:[x<90?'É menor que 90°.':x===90?'É exatamente 90°.':'Está entre 90° e 180°.']};}
]);}});

topic({id:'retas-paralelas-transversal',nome:'Retas paralelas cortadas por uma transversal',ano:'8º ano',area:'Geometria',
tags:'retas paralelas transversal alternos internos correspondentes colaterais',
teoria:'<p>Quando duas retas <b>paralelas</b> são cortadas por uma <b>transversal</b>, formam-se 8 ângulos, que só têm <b>duas medidas</b> (agudo e obtuso, que somam 180°).</p><ul><li><b>Correspondentes</b> (mesma posição em cada cruzamento): iguais.</li><li><b>Alternos internos</b> (entre as paralelas, lados opostos da transversal): iguais.</li><li><b>Alternos externos</b>: iguais.</li><li><b>Colaterais internos/externos</b> (mesmo lado da transversal): <b>somam 180°</b>.</li></ul><p class="tip">Resumo: "parecidos" (ambos agudos ou ambos obtusos) são iguais; um agudo com um obtuso somam 180°.</p>',

topic({id:'media-moda-mediana',nome:'Estatística: média, moda e mediana',ano:'8º ano',area:'Estatística e probabilidade',

function(){var mo=r.i(1,15),d=[mo,mo,mo];while(d.length<7){var x=r.i(1,15);if(x!==mo&&d.filter(function(y){return y===x;}).length<2)d.push(x);}d=r.sh(d);return {q:'Qual é a moda de: '+d.join(', ')+'?',a:n(mo),s:['O '+mo+' aparece 3 vezes, mais que qualquer outro.']};},
function(){var ns=[r.i(3,10),r.i(3,10),r.i(3,10)],ws=r.p([[1,2,3],[2,3,5],[1,1,2],[3,3,4]]);var s=ns[0]*ws[0]+ns[1]*ws[1]+ns[2]*ws[2],W=ws[0]+ws[1]+ws[2];return {q:'Um aluno tirou '+ns.join(', ')+' em provas com pesos '+ws.join(', ')+'. Qual a média ponderada?',a:n(rnd(s/W,2)),s:['Multiplique cada nota pelo peso: '+ns.map(function(x,k){return x+'×'+ws[k];}).join(' + ')+' = '+s+'.','Some os pesos: '+W+'.','Média: '+s+' ÷ '+W+' = '+n(rnd(s/W,2))+'.']};},
function(){var k=r.i(5,8),d=data(k);var mx=Math.max.apply(null,d),mn=Math.min.apply(null,d);return {q:'Qual a amplitude dos dados: '+d.join(', ')+'?',a:n(mx-mn),s:['Maior valor: '+mx+'; menor: '+mn+'.','Amplitude: '+mx+' − '+mn+' = '+(mx-mn)+'.']};}
]);}});

topic({id:'probabilidade',nome:'Probabilidade',ano:'8º ano',area:'Estatística e probabilidade',
tags:'probabilidade chance dado moeda urna evento espaço amostral',
teoria:'<p><b>Probabilidade</b> de um evento:</p><p class="big">P = <span class="fr"><span>casos favoráveis</span><span>casos possíveis</span></span></p><ul><li>Vai de 0 (impossível) a 1 (certo). Em porcentagem: de 0% a 100%.</li><li><b>Espaço amostral</b>: todos os resultados possíveis. Dado: {1, 2, 3, 4, 5, 6}.</li><li>Eventos independentes (um não interfere no outro), "e": <b>multiplique</b> as probabilidades.</li><li>Probabilidade de <b>não</b> acontecer: 1 − P.</li></ul><div class="ex"><b>Exemplo:</b> tirar número par num dado: {2, 4, 6} → <span class="fr"><span>3</span><span>6</span></span> = <span class="fr"><span>1</span><span>2</span></span> = 50%.</div>',
gen:function(r,i){function pct(q){var v=q.n/q.d*100;return Math.abs(v-rnd(v,1))<1e-9?' = '+n(rnd(v,1))+'%':'';}return mix(i,[
function(){var evs=[['um número par',[2,4,6]],['um número ímpar',[1,3,5]],['um número primo',[2,3,5]],['um número maior que 4',[5,6]],['um número menor que 3',[1,2]],['um múltiplo de 3',[3,6]],['o número 6',[6]],['um número maior que 1',[2,3,4,5,6]]];var e=r.p(evs);var q=Q(e[1].length,6);return {q:'Ao lançar um dado comum, qual a probabilidade de sair '+e[0]+'?',a:FQ(q)+pct(q),s:['Casos possíveis: {1, 2, 3, 4, 5, 6} → 6.','Casos favoráveis: {'+e[1].join(', ')+'} → '+e[1].length+'.','P = '+F(e[1].length,6)+(q.d!==6?' = '+FQ(q):'')+pct(q)+'.']};},
function(){var b=r.i(1,10),v=r.i(1,10),g=r.i(0,6);var T=b+v+g;var c=r.p(['azul','vermelha']);var cp=c==='azul'?'azuis':'vermelhas';var fav=c==='azul'?b:v;var q=Q(fav,T);return {q:'Numa urna há '+b+' bolas azuis, '+v+' vermelhas'+(g?' e '+g+' verdes':'')+'. Tirando uma bola ao acaso, qual a probabilidade de ser '+c+'?',a:FQ(q)+pct(q),s:['Total de bolas: '+b+' + '+v+(g?' + '+g:'')+' = '+T+'.','Bolas '+cp+': '+fav+'.','P = '+F(fav,T)+(q.d!==T?' = '+FQ(q):'')+pct(q)+'.']};},
function(){var k=r.i(2,3);var q=Q(1,Math.pow(2,k));return {q:'Lançando '+k+' moedas, qual a probabilidade de saírem '+k+' caras?',a:FQ(q)+pct(q),s:['Cada moeda: P(cara) = '+F(1,2)+'.','As moedas são independentes: multiplique. '+Array(k).fill(F(1,2)).join(' × ')+' = '+FQ(q)+pct(q)+'.']};},
function(){var s=r.i(2,12);var c=0;for(var a=1;a<=6;a++)for(var b=1;b<=6;b++)if(a+b===s)c++;var q=Q(c,36);return {q:'Lançando dois dados, qual a probabilidade de a soma ser '+s+'?',a:FQ(q),s:['Casos possíveis: 6 × 6 = 36.','Pares que somam '+s+': '+(function(){var L=[];for(var a=1;a<=6;a++)for(var b=1;b<=6;b++)if(a+b===s)L.push('('+a+','+b+')');return L.join(', ');})()+' → '+c+'.','P = '+F(c,36)+(q.d!==36?' = '+FQ(q):'')+'.']};},
function(){var pp=r.p([10,20,25,30,40,60,70,75,80,90]);return {q:'A probabilidade de chover amanhã é de '+pp+'%. Qual a probabilidade de não chover?',a:(100-pp)+'%',s:['P(não acontecer) = 100% − P(acontecer).','100% − '+pp+'% = '+(100-pp)+'%.']};}
]);}});

topic({id:'contagem',nome:'Contagem: princípio multiplicativo',ano:'8º ano',area:'Estatística e probabilidade',
tags:'contagem princípio fundamental da contagem combinações possibilidades anagramas senhas árvore de possibilidades',
teoria:'<p><b>Princípio multiplicativo</b>: se uma escolha pode ser feita de <b>m</b> maneiras e outra, independente, de <b>n</b> maneiras, as duas juntas podem ser feitas de <b>m × n</b> maneiras.</p><ul><li>Desenhe “tracinhos” para cada etapa e escreva quantas opções há em cada uma; depois multiplique.</li><li><b>Sem repetição</b>: a cada etapa sobra uma opção a menos.</li><li><b>Anagramas</b> de palavra com letras diferentes: n × (n − 1) × … × 1 = n! (fatorial).</li></ul><div class="ex"><b>Exemplo:</b> 3 camisetas e 4 bermudas → 3 × 4 = 12 combinações de roupa.<br>Senhas de 3 algarismos distintos: 10 × 9 × 8 = 720.</div>',
gen:function(r,i){var words=['AMOR','GATO','LIVRO','PRATO','MESA','CASA','BOLA','LUZ','CAFE','SOL','PERNA','NUVEM'];function fat(k){var f=1;for(var t=2;t<=k;t++)f*=t;return f;}return mix(i,[
function(){var a=r.i(2,8),b=r.i(2,8),c=r.i(1,5);return {q:'Tenho '+a+' camisetas, '+b+' calças e '+c+' par(es) de tênis. De quantas maneiras diferentes posso me vestir?',a:n(a*b*c),s:['Cada peça é uma etapa independente.','Multiplique: '+a+' × '+b+' × '+c+' = '+(a*b*c)+'.']};},
function(){var k=r.i(2,4),rep=r.f()<0.5;var t=1,parts=[];for(var j=0;j<k;j++){var o=rep?10:10-j;t*=o;parts.push(o);}return {q:'Quantas senhas de '+k+' algarismos podem ser formadas '+(rep?'(podendo repetir algarismos)':'com algarismos todos diferentes')+'?',a:n(t),s:['Há 10 algarismos (0 a 9).',rep?'Cada posição tem 10 opções.':'A cada posição sobra uma opção a menos: '+parts.join(', ')+'.',parts.join(' × ')+' = '+n(t)+'.']};},
function(){var w=r.p(words);var L=w.length;return {q:'Quantos anagramas tem a palavra '+w+'?',a:n(fat(L)),s:['A palavra tem '+L+' letras, todas diferentes.','1ª posição: '+L+' opções, 2ª: '+(L-1)+', e assim por diante.',Array.from({length:L},function(_,t){return L-t;}).join(' × ')+' = '+n(fat(L))+'.']};},
function(){var e=r.i(2,5),p_=r.i(2,6),s=r.i(2,4);return {q:'Um restaurante oferece '+e+' entradas, '+p_+' pratos principais e '+s+' sobremesas. Quantas refeições diferentes (entrada + prato + sobremesa) posso montar?',a:n(e*p_*s),s:['Uma escolha de cada: '+e+' × '+p_+' × '+s+' = '+(e*p_*s)+'.']};},
function(){var k=r.i(4,12);return {q:'Numa reunião com '+k+' pessoas, cada uma aperta a mão de todas as outras uma única vez. Quantos apertos de mão acontecem?',a:n(k*(k-1)/2),s:['Cada pessoa aperta a mão de '+(k-1)+' outras: '+k+' × '+(k-1)+' = '+(k*(k-1))+'.','Mas assim cada aperto foi contado duas vezes (A com B e B com A): ÷ 2.',(k*(k-1))+' ÷ 2 = '+(k*(k-1)/2)+'.']};}
]);}});

</script>
<script>
(function(){
var view=document.getElementById('view'),qInput=document.getElementById('q'),chips=document.getElementById('chips');
var ANOS=['Todos','6º ano','7º ano','8º ano','9º ano'],anoSel='Todos';
var AREAS=['Números','Álgebra','Geometria','Grandezas e medidas','Estatística e probabilidade'];
var state={id:null,tab:'teoria',mode:'quiz',seed:0,idx:0,shown:{},seen:{}};
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/<[^>]+>/g,' ');}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function steps(s){if(!s)return [];if(Array.isArray(s))return s;return String(s).split(/(?<=\.)\s+(?=[A-ZÀ-Ú0-9(√−\[])/);}
ANOS.forEach(function(a){var b=document.createElement('button');b.className='chip';b.textContent=a;b.setAttribute('aria-pressed',a===anoSel);b.onclick=function(){anoSel=a;[].forEach.call(chips.children,function(c){c.setAttribute('aria-pressed',c.textContent===a);});if(state.id){location.hash='';}else renderHome();};chips.appendChild(b);});
qInput.addEventListener('input',function(){if(state.id){history.replaceState(null,'',location.pathname);state.id=null;}renderHome();});
qInput.addEventListener('keydown',function(e){if(e.key==='Enter'){var f=filtered();if(f.length===1)location.hash=f[0].id;}});
function filtered(){var q=norm(qInput.value.trim());var words=q.split(/\s+/).filter(Boolean);
 return TOPICS.filter(function(t){if(anoSel!=='Todos'&&t.ano!==anoSel)return false;if(!words.length)return true;var hay=norm(t.nome+' '+t.tags+' '+t.area+' '+t.ano);return words.every(function(w){return hay.indexOf(w)>=0;});});}
function renderHome(){
 state.id=null;var f=filtered();
 if(!f.length){view.innerHTML='<p class="empty">Nenhum assunto encontrado para “'+esc(qInput.value)+'”. Tente outra palavra (ex.: fração, equação, área).</p>';return;}
 var html='';AREAS.forEach(function(a){var L=f.filter(function(t){return t.area===a;});if(!L.length)return;
  html+='<section class="area"><h2>'+a+' <span style="font-weight:600">('+L.length+')</span></h2><div class="grid">'+L.map(function(t){return '<a class="tcard" href="#'+t.id+'"><span class="badge">'+t.ano+'</span><b>'+t.nome+'</b></a>';}).join('')+'</div></section>';});
 view.innerHTML='<p style="margin:0;color:var(--muted);font-weight:600">'+f.length+' assunto(s)'+(qInput.value?' para “'+esc(qInput.value)+'”':'')+'. Toque em um para ver a teoria e os exercícios.</p>'+html;
}
var cache={};
function getList(t,seed){var k=t.id+'|'+seed;if(!cache[k])cache[k]=lista(t,seed);return cache[k];}
function renderTopic(){
 var t=TOPICS.filter(function(x){return x.id===state.id;})[0];if(!t){location.hash='';return;}
 var L=getList(t,state.seed);
 var h='<a class="back noprint" href="#">← Todos os assuntos</a><div class="thead"><span class="badge">'+t.ano+'</span> <span class="badge" style="background:#E8ECF6">'+t.area+'</span><h1>'+t.nome+'</h1></div>';
 h+='<div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="teoria" aria-selected="'+(state.tab==='teoria')+'">1. Teoria</button><button class="tab" role="tab" data-tab="ex" aria-selected="'+(state.tab==='ex')+'">2. Exercícios (20)</button></div>';
 if(state.tab==='teoria'){
  h+='<div class="panel teoria">'+t.teoria+'</div><div class="toolbar"><span></span><button class="btn primary" data-go="ex">Ir para os exercícios →</button></div>';
 }else{
  h+='<div class="toolbar"><div class="seg" role="group" aria-label="Modo"><button data-mode="quiz" aria-pressed="'+(state.mode==='quiz')+'">Quiz</button><button data-mode="gab" aria-pressed="'+(state.mode==='gab')+'">Com gabarito</button></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="listinfo">Lista '+(state.seed+1)+'</span>'+(state.seed>0?'<button class="btn" data-seed="-1">← Anterior</button>':'')+'<button class="btn gold" data-seed="1">Nova lista ↻</button>'+(state.mode==='gab'?'<button class="btn" data-print="1">Imprimir</button>':'')+'</div></div>';
  if(state.mode==='quiz'){
   var i=state.idx,g=L[i],shown=!!state.shown[i];state.seen[i]=1;
   h+='<div class="panel quiz"><div class="qnum">QUESTÃO '+(i+1)+' DE '+L.length+'</div><div class="progress"><i style="width:'+((i+1)/L.length*100)+'%"></i></div><div class="qtext">'+g.q+'</div>';
   h+=shown?ansHTML(g):'<div style="margin-top:22px"><button class="btn primary" data-reveal="1">Mostrar resposta</button></div>';
   h+='<div class="qnav"><button class="btn" data-nav="-1" '+(i===0?'disabled':'')+'>← Anterior</button><button class="btn '+(shown?'primary':'')+'" data-nav="1" '+(i===L.length-1?'disabled':'')+'>Próxima →</button></div>';
   h+='<div class="dots" aria-label="Ir para a questão">'+L.map(function(_,k){return '<button data-jump="'+k+'" class="'+(k===i?'cur ':'')+(state.seen[k]?'seen':'')+'" aria-label="Questão '+(k+1)+'">'+(k+1)+'</button>';}).join('')+'</div><p class="hint">Atalhos: espaço mostra a resposta; setas ← → trocam de questão.</p></div>';
  }else{
   h+='<ol class="qlist">'+L.map(function(g,k){return '<li class="qitem"><div class="qnum">QUESTÃO '+(k+1)+'</div><div class="qtext">'+g.q+'</div>'+ansHTML(g)+'</li>';}).join('')+'</ol>';
  }
 }
 view.innerHTML=h;
}
function ansHTML(g){var st=steps(g.s);return '<div class="answer"><div><span style="font-weight:800;color:var(--muted);font-size:14px;letter-spacing:.08em">RESPOSTA</span></div><div class="ans">'+g.a+'</div>'+(st.length?'<div style="margin-top:10px;font-weight:800">Passo a passo:</div><ol class="steps">'+st.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ol>':'')+'</div>';}
view.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){state.tab=b.dataset.tab;renderTopic();}
 else if(b.dataset.go){state.tab='ex';renderTopic();window.scrollTo(0,0);}
 else if(b.dataset.mode){state.mode=b.dataset.mode;renderTopic();}
 else if(b.dataset.seed){state.seed=Math.max(0,state.seed+ +b.dataset.seed);state.idx=0;state.shown={};state.seen={};renderTopic();}
 else if(b.dataset.reveal){state.shown[state.idx]=1;renderTopic();}
 else if(b.dataset.nav){go(+b.dataset.nav);}
 else if(b.dataset.jump){state.idx=+b.dataset.jump;renderTopic();}
 else if(b.dataset.print){try{window.print();}catch(err){}}
});
function go(d){var t=TOPICS.filter(function(x){return x.id===state.id;})[0];var L=getList(t,state.seed);var ni=state.idx+d;if(ni<0||ni>=L.length)return;state.idx=ni;renderTopic();}
document.addEventListener('keydown',function(e){if(!state.id||state.tab!=='ex'||state.mode!=='quiz')return;if(e.target.tagName==='INPUT')return;
 if(e.key==='ArrowRight'){go(1);}else if(e.key==='ArrowLeft'){go(-1);}else if(e.key===' '){e.preventDefault();state.shown[state.idx]=1;renderTopic();}});
function route(){var id=location.hash.replace('#','');
 if(id&&TOPICS.some(function(t){return t.id===id;})){if(state.id!==id){state={id:id,tab:'teoria',mode:state.mode||'quiz',seed:0,idx:0,shown:{},seen:{}};}renderTopic();window.scrollTo(0,0);}
 else{state.id=null;renderHome();}}
window.addEventListener('hashchange',route);route();
})();
</script>
