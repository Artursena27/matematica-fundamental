<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matemática Academy · Teoria e Exercícios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap">
<style>
:root{--navy:#0E1B3D;--navy2:#1A2C5C;--line:#DDE3F0;--bg:#F5F7FC;--card:#FFFFFF;--ink:#14213D;--muted:#55627F;--accent:#FFC93C;--accent2:#FFE7A3;--ok:#128C4A;--okbg:#E6F5EC}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;font-size:17px;line-height:1.55}
button{font:inherit;cursor:pointer}
a{color:inherit}
header{background:var(--navy);color:#fff;padding:22px 20px 26px;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:36px 36px}
.wrap{max-width:980px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}
.brand b{font-size:20px;font-weight:900;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{color:#C9D3EC;font-size:13px;font-weight:600}
.search{margin-top:20px;position:relative}
.search input{width:100%;padding:16px 18px 16px 52px;border-radius:16px;border:2px solid transparent;font:inherit;font-size:18px;background:#fff;color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{padding:7px 14px;border-radius:999px;border:2px solid rgba(255,255,255,.25);background:transparent;color:#fff;font-size:14px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--navy)}
main{padding:24px 20px 60px}
.area{margin-top:26px}
.area h2{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:6px;padding:16px 18px;background:var(--card);border:2px solid var(--line);border-radius:18px;text-decoration:none;min-height:88px;transition:border-color .15s,transform .15s}
.tcard:hover,.tcard:focus-visible{border-color:var(--navy);transform:translateY(-2px);outline:none}
.tcard b{font-size:17px;line-height:1.25}
.badge{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--accent2);color:var(--navy);align-self:flex-start}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
/* tema */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-decoration:none;color:var(--muted);margin-bottom:10px}
.back:hover{color:var(--ink)}
.thead h1{font-size:clamp(26px,5vw,38px);line-height:1.1;margin:6px 0 10px;letter-spacing:-.02em;font-weight:900}
.tabs{display:flex;gap:8px;margin:18px 0 0;border-bottom:2px solid var(--line)}
.tab{padding:12px 18px;border:none;background:none;font-weight:800;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px;font-size:17px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:24px;margin-top:18px}
.teoria p,.teoria li{font-size:18px}
.teoria ul,.teoria ol{padding-left:22px}
.teoria li{margin:6px 0}
.ex{background:#F0F4FF;border-left:0;border-radius:14px;padding:14px 16px;margin:14px 0}
.tip{background:#FFF6DA;border-radius:14px;padding:12px 16px}
.big{font-size:22px;text-align:center}
table.t{border-collapse:collapse;margin:12px 0;width:100%;max-width:640px;font-size:16px}
table.t td,table.t th{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
table.t th{background:#F0F4FF}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.15}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.ov{border-top:2px solid currentColor;padding:0 2px}
.hl{background:var(--accent);padding:0 3px;border-radius:4px}
sup{font-size:.7em}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:18px}
.seg{display:inline-flex;background:#E8ECF6;border-radius:14px;padding:4px}
.seg button{border:none;background:none;padding:10px 16px;border-radius:10px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{border:2px solid var(--navy);background:#fff;color:var(--navy);padding:10px 16px;border-radius:12px;font-weight:800}
.btn.primary{background:var(--navy);color:#fff}
.btn.gold{background:var(--accent);border-color:var(--accent);color:var(--navy)}
.btn:disabled{opacity:.4;cursor:default}
.listinfo{font-size:14px;color:var(--muted);font-weight:700}
.quiz{text-align:left}
.qnum{font-weight:900;color:var(--muted);font-size:15px;letter-spacing:.08em}
.progress{height:8px;background:#E8ECF6;border-radius:4px;margin:10px 0 18px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:4px}
.qtext{font-size:22px;font-weight:700;line-height:1.5}
.answer{margin-top:20px;border-radius:16px;background:var(--okbg);padding:18px}
.answer .ans{font-size:22px;font-weight:900;color:var(--ok)}
.steps{margin:12px 0 0;padding-left:22px}
.steps li{margin:6px 0;font-size:17px}
.qnav{display:flex;gap:10px;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.qitem{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 20px}
.qitem .qtext{font-size:19px}
.qitem .answer{padding:14px 16px;margin-top:12px}
.qitem .answer .ans{font-size:19px}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.dots button{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:14px;color:var(--muted)}
.dots button.cur{border-color:var(--navy);color:var(--navy)}
.dots button.seen{background:var(--accent2)}
.hint{font-size:13px;color:var(--muted);margin-top:10px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:20px}
@media (max-width:600px){.panel{padding:18px}.qtext{font-size:19px}main{padding:18px 14px 50px}}
@media print{header,.tabs,.toolbar,.back,footer,.noprint{display:none!important}body{background:#fff}.panel,.qitem{border:1px solid #ccc;break-inside:avoid}.answer{background:#fff;border:1px solid #9c9}}
</style>
</head>
<body>
<header>
<div class="wrap">
<a class="brand" href="#"><span class="logo">∑</span><span><b>Matemática Academy</b><small>Teoria e exercícios resolvidos</small></span></a>
<div class="search" id="searchBox">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#55627F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input id="q" type="search" placeholder="Pesquise um assunto: frações, MMC, Pitágoras…" aria-label="Pesquisar assunto" autocomplete="off">
</div>
<div class="chips" id="chips" role="group" aria-label="Filtrar por ano"></div>
</div>
</header>
<main><div class="wrap" id="view"></div></main>
<footer>Questões geradas com o gabarito calculado automaticamente. Use “Nova lista” para outras questões do mesmo assunto.</footer>

<script>
/*TOPICS*/
</script>
<script>
(function(){
var view=document.getElementById('view'),qInput=document.getElementById('q'),chips=document.getElementById('chips');
var ANOS=['Todos','4º ano','5º ano','6º ano','7º ano','8º ano','9º ano'],anoSel='Todos';
var AREAS=['Números','Álgebra','Geometria','Grandezas e medidas','Estatística e probabilidade'];
var state={id:null,tab:'teoria',mode:'quiz',seed:0,idx:0,shown:{},seen:{}};
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/<[^>]+>/g,' ');}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function steps(s){if(!s)return [];if(Array.isArray(s))return s;return String(s).split(/(?<=\.)\s+(?=[A-ZÀ-Ú0-9(√−\[])/);}
ANOS.forEach(function(a){var b=document.createElement('button');b.className='chip';b.textContent=a;b.setAttribute('aria-pressed',a===anoSel);b.onclick=function(){anoSel=a;[].forEach.call(chips.children,function(c){c.setAttribute('aria-pressed',c.textContent===a);});if(state.id){location.hash='';}else renderHome();};chips.appendChild(b);});
qInput.addEventListener('input',function(){if(state.id){history.replaceState(null,'',location.pathname);state.id=null;}renderHome();});
qInput.addEventListener('keydown',function(e){if(e.key==='Enter'){var f=filtered();if(f.length===1)location.hash=f[0].id;}});
function filtered(){var q=norm(qInput.value.trim());var words=q.split(/\s+/).filter(Boolean);
 return TOPICS.filter(function(t){if(anoSel!=='Todos'&&t.ano!==anoSel)return false;if(!words.length)return true;var hay=norm(t.nome+' '+t.tags+' '+t.area+' '+t.ano);return words.every(function(w){return hay.indexOf(w)>=0;});});}
function renderHome(){
 state.id=null;var f=filtered();
 if(!f.length){view.innerHTML='<p class="empty">Nenhum assunto encontrado para “'+esc(qInput.value)+'”. Tente outra palavra (ex.: fração, equação, área).</p>';return;}
 var html='';AREAS.forEach(function(a){var L=f.filter(function(t){return t.area===a;});if(!L.length)return;
  html+='<section class="area"><h2>'+a+' <span style="font-weight:600">('+L.length+')</span></h2><div class="grid">'+L.map(function(t){return '<a class="tcard" href="#'+t.id+'"><span class="badge">'+t.ano+'</span><b>'+t.nome+'</b></a>';}).join('')+'</div></section>';});
 view.innerHTML='<p style="margin:0;color:var(--muted);font-weight:600">'+f.length+' assunto(s)'+(qInput.value?' para “'+esc(qInput.value)+'”':'')+'. Toque em um para ver a teoria e os exercícios.</p>'+html;
}
var cache={};
function getList(t,seed){var k=t.id+'|'+seed;if(!cache[k])cache[k]=lista(t,seed);return cache[k];}
function renderTopic(){
 var t=TOPICS.filter(function(x){return x.id===state.id;})[0];if(!t){location.hash='';return;}
 var L=getList(t,state.seed);
 var h='<a class="back noprint" href="#">← Todos os assuntos</a><div class="thead"><span class="badge">'+t.ano+'</span> <span class="badge" style="background:#E8ECF6">'+t.area+'</span><h1>'+t.nome+'</h1></div>';
 h+='<div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="teoria" aria-selected="'+(state.tab==='teoria')+'">1. Teoria</button><button class="tab" role="tab" data-tab="ex" aria-selected="'+(state.tab==='ex')+'">2. Exercícios (20)</button></div>';
 if(state.tab==='teoria'){
  h+='<div class="panel teoria">'+t.teoria+'</div><div class="toolbar"><span></span><button class="btn primary" data-go="ex">Ir para os exercícios →</button></div>';
 }else{
  h+='<div class="toolbar"><div class="seg" role="group" aria-label="Modo"><button data-mode="quiz" aria-pressed="'+(state.mode==='quiz')+'">Quiz</button><button data-mode="gab" aria-pressed="'+(state.mode==='gab')+'">Com gabarito</button></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="listinfo">Lista '+(state.seed+1)+'</span>'+(state.seed>0?'<button class="btn" data-seed="-1">← Anterior</button>':'')+'<button class="btn gold" data-seed="1">Nova lista ↻</button>'+(state.mode==='gab'?'<button class="btn" data-print="1">Imprimir</button>':'')+'</div></div>';
  if(state.mode==='quiz'){
   var i=state.idx,g=L[i],shown=!!state.shown[i];state.seen[i]=1;
   h+='<div class="panel quiz"><div class="qnum">QUESTÃO '+(i+1)+' DE '+L.length+'</div><div class="progress"><i style="width:'+((i+1)/L.length*100)+'%"></i></div><div class="qtext">'+g.q+'</div>';
   h+=shown?ansHTML(g):'<div style="margin-top:22px"><button class="btn primary" data-reveal="1">Mostrar resposta</button></div>';
   h+='<div class="qnav"><button class="btn" data-nav="-1" '+(i===0?'disabled':'')+'>← Anterior</button><button class="btn '+(shown?'primary':'')+'" data-nav="1" '+(i===L.length-1?'disabled':'')+'>Próxima →</button></div>';
   h+='<div class="dots" aria-label="Ir para a questão">'+L.map(function(_,k){return '<button data-jump="'+k+'" class="'+(k===i?'cur ':'')+(state.seen[k]?'seen':'')+'" aria-label="Questão '+(k+1)+'">'+(k+1)+'</button>';}).join('')+'</div><p class="hint">Atalhos: espaço mostra a resposta; setas ← → trocam de questão.</p></div>';
  }else{
   h+='<ol class="qlist">'+L.map(function(g,k){return '<li class="qitem"><div class="qnum">QUESTÃO '+(k+1)+'</div><div class="qtext">'+g.q+'</div>'+ansHTML(g)+'</li>';}).join('')+'</ol>';
  }
 }
 view.innerHTML=h;
}
function ansHTML(g){var st=steps(g.s);return '<div class="answer"><div><span style="font-weight:800;color:var(--muted);font-size:14px;letter-spacing:.08em">RESPOSTA</span></div><div class="ans">'+g.a+'</div>'+(st.length?'<div style="margin-top:10px;font-weight:800">Passo a passo:</div><ol class="steps">'+st.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ol>':'')+'</div>';}
view.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){state.tab=b.dataset.tab;renderTopic();}
 else if(b.dataset.go){state.tab='ex';renderTopic();window.scrollTo(0,0);}
 else if(b.dataset.mode){state.mode=b.dataset.mode;renderTopic();}
 else if(b.dataset.seed){state.seed=Math.max(0,state.seed+ +b.dataset.seed);state.idx=0;state.shown={};state.seen={};renderTopic();}
 else if(b.dataset.reveal){state.shown[state.idx]=1;renderTopic();}
 else if(b.dataset.nav){go(+b.dataset.nav);}
 else if(b.dataset.jump){state.idx=+b.dataset.jump;renderTopic();}
 else if(b.dataset.print){try{window.print();}catch(err){}}
});
function go(d){var t=TOPICS.filter(function(x){return x.id===state.id;})[0];var L=getList(t,state.seed);var ni=state.idx+d;if(ni<0||ni>=L.length)return;state.idx=ni;renderTopic();}
document.addEventListener('keydown',function(e){if(!state.id||state.tab!=='ex'||state.mode!=='quiz')return;if(e.target.tagName==='INPUT')return;
 if(e.key==='ArrowRight'){go(1);}else if(e.key==='ArrowLeft'){go(-1);}else if(e.key===' '){e.preventDefault();state.shown[state.idx]=1;renderTopic();}});
function route(){var id=location.hash.replace('#','');
 if(id&&TOPICS.some(function(t){return t.id===id;})){if(state.id!==id){state={id:id,tab:'teoria',mode:state.mode||'quiz',seed:0,idx:0,shown:{},seen:{}};}renderTopic();window.scrollTo(0,0);}
 else{state.id=null;renderHome();}}
window.addEventListener('hashchange',route);route();
})();
</script>
</body>
</html>
